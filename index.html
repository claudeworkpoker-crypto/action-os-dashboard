<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Action OS">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Action OS</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#f0efeb; --line:#e3e1db; --text:#1d1d1f; --sub:#6b6a66; --faint:#9a9893;
  --accent:#2f6fde; --accent-soft:#e6eefc;
  --red:#d33f3f; --red-soft:#fbe9e9; --amber:#b7791f; --amber-soft:#fbf1df; --green:#2e8b57; --green-soft:#e4f3ea;
  --c-p2:#c2577a; --c-p1:#3f6fd1; --c-p3:#c7862b; --c-p4:#3a9a6a; --c-misc:#8a8780; --c-p5:#7a5cc7; --c-p6:#2a9aa8; --c-p7:#b5583a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --radius:14px;
  color-scheme:light dark;  /* スクロールバーや日付・選択の欄も、明るい／暗いに合わせて描かせる（Windows で暗い画面に白いバーが出ないように） */
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16171a; --panel:#1f2024; --panel2:#26272c; --line:#33343a; --text:#ececee; --sub:#a3a3aa; --faint:#75757d;
    --accent:#6b9cff; --accent-soft:#22304d;
    --red:#ff6b6b; --red-soft:#3a2224; --amber:#f0b44c; --amber-soft:#3a3020; --green:#5cc98a; --green-soft:#1f3328;
    --c-p2:#e07fa0; --c-p1:#6f98f0; --c-p3:#e5a64f; --c-p4:#5cc98a; --c-misc:#a3a19a; --c-p5:#a58cf0; --c-p6:#4fc3d0; --c-p7:#e08a6a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation}
/* iOS は16px未満の入力欄にフォーカスすると自動で拡大するため、入力欄は常に16px以上にする */
input,select,textarea{font-size:16px !important}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Yu Gothic UI","Meiryo UI","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
/* スクロールバー：Windows でも細く目立たないものにする（Mac は元から重ねて出すので変わらない） */
html,*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--faint) 55%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--faint) 50%,transparent);border-radius:999px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--faint) 75%,transparent)}
.tabs{scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ヘッダ */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em}
.today{color:var(--sub);font-size:13px}
.sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--sub)}
.iconbtn:hover{color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* サマリー */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.stat .n{font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
.stat.on{outline:2px solid var(--accent);outline-offset:-1px}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)}

/* タブ */
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;color:var(--sub);font-size:14px;white-space:nowrap}
.tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.tab .cnt{font-size:12px;color:var(--faint);margin-left:4px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filterchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:5px 10px}
#updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:70;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:9px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
/* メニュー（左から出す。広い画面では左に出しっぱなしにできる） */
:root{--navw:272px}
.menubtn{position:relative;margin-left:-4px}
.navdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--panel)}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(var(--navw),86vw);z-index:40;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);box-shadow:0 0 40px rgba(0,0,0,.18)}
body.navopen .drawer{transform:none}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .22s}
body.navopen .scrim{opacity:1;pointer-events:auto}
body.navopen .fab{display:none}
.dhd{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 16px;border-bottom:1px solid var(--line);flex:none}
.dsearch{padding:10px 12px 2px;flex:none}
.dsearch .inp{width:100%}
.dbody{flex:1;overflow-y:auto;padding:2px 8px 16px;overscroll-behavior:contain}
.dgrp{font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;padding:14px 10px 4px}
.drow{display:flex;align-items:center;gap:2px}
.navi{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--text);text-align:left;font-size:15px}
.navi:hover{background:var(--panel2)}
.navi.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navi .ic{width:20px;height:20px;flex:none;color:var(--sub);display:flex;align-items:center;justify-content:center}
.navi.on .ic{color:var(--accent)}
.navi .ic svg{width:18px;height:18px}
.navi .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi .nb{font-size:12px;color:var(--faint);font-weight:500}
.navi .nb.red{color:#fff;background:var(--red);border-radius:999px;padding:0 7px;font-weight:600}
.navi .ext{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.navi.soon{opacity:.6;cursor:default}
.navi.soon:hover{background:none}
.pinbtn{flex:none;width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.pinbtn svg{width:16px;height:16px}
.pinbtn.on{color:var(--amber)}
.pinbtn.on svg{fill:currentColor}
button.pinbtn:hover{background:var(--panel2);color:var(--amber)}
.dfoot{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex:none}
.dfoot .hint{flex:1;font-size:12px}
.tab .cnt.red{color:var(--red);font-weight:600}
.tab.more{display:inline-flex;align-items:center;gap:5px;color:var(--sub)}
.tab.more svg{width:15px;height:15px}
.hd .brand{white-space:nowrap}
.hd .today{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){ .toolbar .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%} .toolbar .tab{flex:none} .toolbar .tab.more{display:none} }
@media (min-width:1100px){
  body.navpin{padding-left:var(--navw)}
  body.navpin .drawer{transform:none;box-shadow:none;z-index:15;width:var(--navw)}
  body.navpin .scrim{display:none}
  body.navpin .tab.more{display:none}
}

/* Inbox */
.inbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.inbox h3{margin:0 0 8px;font-size:14px}
.ibrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.ibrow:first-of-type{border-top:0}
.ibrow .t{flex:1 1 200px;min-width:0}
.ibrow .b{font-size:12px;color:var(--sub);white-space:pre-wrap;word-break:break-word}

/* カテゴリボード */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.colhd{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-top:4px solid var(--cc)}
.colhd .name{font-weight:700}
.colhd .iconbtn.sm{width:26px;height:26px;border:0;background:transparent;color:var(--faint)}
.colhd .iconbtn.sm:hover{color:var(--red);background:var(--red-soft)}
.colhd .iconbtn.sm svg{width:14px;height:14px}
.addcat{background:transparent;border:2px dashed var(--line);box-shadow:none;padding:6px}
.addcat input{width:100%;border:0;background:transparent;padding:10px;font-size:15px;font-weight:600}
.addcat input:focus{outline:none}
.addcat:focus-within{border-color:var(--accent)}
.colhd .count{font-size:12px;color:var(--sub);background:var(--panel2);border-radius:999px;padding:1px 8px}
.list{padding:2px 6px 6px}
.empty{color:var(--faint);font-size:13px;padding:6px 10px 10px}
.quick{display:flex;gap:6px;padding:0 10px 12px}
.quick input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:14px}
.quick input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--panel)}

/* タスク行 */
.task{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:10px}
.task:hover{background:var(--panel2)}
.task.sub{margin-left:30px;padding-top:4px;padding-bottom:4px}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.chk:hover{border-color:var(--green);background:var(--green-soft)}
.chk svg{width:12px;height:12px;opacity:0;color:var(--green)}
.chk:hover svg{opacity:1}
.task.sub .chk{width:18px;height:18px}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttext{word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--panel2);color:var(--sub);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.over{background:var(--red-soft);color:var(--red);font-weight:600}
.chip.today{background:var(--amber-soft);color:var(--amber);font-weight:600}
.chip.soon{background:var(--accent-soft);color:var(--accent)}
.chip.prio{background:var(--red-soft);color:var(--red)}
.chip.who{border:0;font:inherit;font-size:12px;cursor:pointer;background:color-mix(in srgb,var(--c-p5) 14%,transparent);color:var(--c-p5)}
.chip.who.on{background:var(--c-p5);color:#fff}
.whobar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}
.whobar .lbl{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);margin-right:2px}
.whobar .lbl svg{width:14px;height:14px}
.wp{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--sub)}
.wp.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.wp .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent);color:#fff;vertical-align:1px}
.wp .cnt.zero{min-width:0;padding:0;background:transparent;color:var(--faint);font-weight:400;opacity:.7}
.dates .btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rvbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:0 0 12px}
.rvbar svg{width:14px;height:14px;flex:none}
.rvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.rvcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.rvcard.bad{cursor:default}
.rvhd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rvhd .name{font-weight:700;font-size:16px}
.rvhd svg{width:16px;height:16px;color:var(--faint)}
.rvday{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.rvday .dn{font-size:13px;color:var(--sub);padding-top:1px}
.rvday .dv{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.rvslot{font-size:13px;padding:1px 9px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.rvnone{font-size:13px;color:var(--faint)}
.rvhid{flex-basis:100%;font-size:12px;color:var(--sub)}
.rvprob{font-size:13px;color:var(--red);background:var(--red-soft);border-radius:8px;padding:6px 8px;margin:6px 0}
.rvrow{display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr));gap:6px;align-items:center;margin-top:12px}
.rvrow .dl{font-size:14px;color:var(--sub)}
.rvrow .inp{min-width:0;padding-left:8px;padding-right:8px}
.rvhrow{margin:6px 0 0 30px}
.rverr{color:var(--red);background:var(--red-soft);border-radius:8px;padding:8px 10px;margin-top:12px;font-size:13px}
.boksub{font-size:13px;color:var(--sub);margin:0 0 10px}
.boklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.bokfn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);color:inherit}
.bokfn .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.bokfn .ic svg{width:18px;height:18px}
.bokfn .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.bokfn .t1{font-weight:600;font-size:15px}
.bokfn .t2{font-size:12px;color:var(--sub)}
.bokfn>svg{width:16px;height:16px;color:var(--faint);flex:none}
.bokfn.off{opacity:.55;border-style:dashed;box-shadow:none}
.bokfn .tag{font-size:11px;font-weight:400;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--sub);margin-left:6px}
.bokback{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.bokback .ttl{font-weight:700;font-size:15px}
.bokback .iconbtn svg{width:16px;height:16px}
.himepill{margin-left:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#ff3b30;color:#fff;vertical-align:1px}
.bokn{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#ff3b30;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.bkok{font-size:14px;line-height:1.7}
.bkok p{margin:0 0 8px}
.bkok .warn{color:var(--red)}
.bkok .sub{color:var(--sub);font-size:13px}
.btn.warnbtn{background:var(--red);border-color:var(--red);color:#fff}
.bkcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.bklist{display:flex;flex-direction:column;gap:10px}
.bktop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bknote{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.6}
.bkwarn{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;line-height:1.6}
.bkbad{font-size:13px;color:var(--red);background:var(--red-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;line-height:1.6}
.bkok-ok{font-size:13px;color:var(--green);background:var(--green-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;line-height:1.6}
.bktag{display:inline-flex;align-items:center;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--sub);white-space:nowrap}
.bktag.red{background:var(--red-soft);color:var(--red)}
.bktag.amber{background:var(--amber-soft);color:var(--amber)}
.bktag.violet{background:color-mix(in srgb,var(--c-p5) 16%,transparent);color:var(--c-p5)}
.bktag.green{background:var(--green-soft);color:var(--green)}
.bktag.blue{background:var(--accent-soft);color:var(--accent)}
.bkbody{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:14px}
.bkclip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bksel{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.bkseg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:3px;margin-top:10px}
.bkseg button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 0;font-size:13px;color:var(--sub)}
.bkseg button.on1{background:var(--red-soft);color:var(--red);font-weight:600}
.bkseg button.on2{background:var(--amber-soft);color:var(--amber);font-weight:600}
.bkcard.hl.hot{border-color:color-mix(in srgb,var(--red) 55%,var(--line));box-shadow:inset 3px 0 0 var(--red),var(--shadow)}
.bkcard.hl.done{opacity:.6}
.hltop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.hlreg{margin-left:auto;font-size:12px;color:var(--faint)}
.hlwho{font-size:15px;font-weight:600}
.hlrow{display:flex;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-top:4px;align-items:center}
.hlrow svg{width:13px;height:13px;vertical-align:-2px}
.hltel{color:var(--accent);text-decoration:underline;font-size:14px}
.bkclick{cursor:pointer}
.bkclick:hover{border-color:var(--accent)}
.bkchk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-top:4px;font-size:14px;line-height:1.5}
.bkchk input{width:18px;height:18px;margin-top:2px;flex:none}
.bkchk .sub{color:var(--sub);font-size:12px}
.bkquote{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.6;max-height:40vh;overflow:auto}
.bkcard.rbbad{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.sicard.sel{border-color:#ea580c}
.siempty{text-align:center;color:var(--sub);font-size:14px;padding:18px 14px}
.siempty .btn{display:block;width:100%;margin-top:14px;padding:12px 0;font-size:15px;font-weight:600;color:var(--text)}
.sitog{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sitog button{flex:1;min-width:130px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 8px;font-size:14px;color:var(--sub)}
.sitog button.on{background:#ea580c;border-color:#ea580c;color:#fff;font-weight:600}
.sitog button:disabled{opacity:.45}
.btn.siorange{background:#ea580c;border-color:#ea580c;color:#fff}
.siprog{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:8px 0}
.siprog i{display:block;height:100%;background:#ea580c}
.stsec .sthd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15px}
.strm{display:flex;gap:6px;align-items:center;margin-top:6px}
.strm .inp{flex:1;min-width:0}
.stlogo{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.stlogo img{max-width:160px;max-height:120px}
.stcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.stcmp div{background:var(--panel2);border-radius:8px;padding:8px 10px;line-height:1.7}
.mtrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.mtrow:first-of-type{border-top:0}
.mtrow.off{opacity:.45}
.mtnone{margin-left:auto;font-size:12px;color:var(--sub)}
.mtsw{margin-left:auto;display:flex;background:var(--panel2);border-radius:999px;padding:3px;gap:3px}
.mtsw button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--faint)}
.mtsw button.ok{background:var(--green-soft);color:var(--green);font-weight:600}
.mtsw button.stop{background:var(--red);color:#fff;font-weight:600}
.bkseg button.on3{background:var(--green-soft);color:var(--green);font-weight:600}
.chip.cat{background:transparent;border:1px solid var(--line)}
.chip.cat i{width:8px;height:8px;border-radius:50%;background:var(--cc);display:inline-block}
.task.done .ttext{text-decoration:line-through;color:var(--faint)}

/* 期限順リスト */
.flat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.grouphd{font-size:12px;font-weight:700;color:var(--sub);padding:10px 10px 4px;letter-spacing:.04em}
.grouphd.red{color:var(--red)} .grouphd.amber{color:var(--amber)}

/* いつか・完了 */
.plain{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px}
.prow:hover{background:var(--panel2)}
.prow .t{flex:1;min-width:0;word-break:break-word}
.prow .d{font-size:12px;color:var(--faint);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:14px}
.btn:hover{background:var(--panel2)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.monthhd{font-size:13px;font-weight:700;color:var(--sub);margin:18px 4px 8px}

/* 追加ボタン */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:30}
.fab svg{width:26px;height:26px}

/* モーダル */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:880px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:18px}
.modal h2{font-size:17px;margin:0 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.subl{display:flex;flex-direction:column;gap:6px}
.subl .row input{flex:1}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.catrow .dot{flex:none;width:10px;height:10px;border-radius:50%}
.catrow .cname{flex:1;padding:10px 12px;font-weight:600}
.catrow input{flex:1}
.iconbtn:disabled{opacity:.3;cursor:default}
.hint code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:11px}

/* トースト */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(28,29,33,.92);color:#f2f2f4;padding:8px 14px;border-radius:12px;font-size:13px;line-height:1.4;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(420px,calc(100vw - 120px));animation:toastin .18s ease-out}
.toast.err{background:rgba(190,50,50,.95);color:#fff;white-space:normal}
@keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* 初期設定 */
.setup{max-width:520px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.setup h1{font-size:20px;margin:0 0 6px}
.setup ol{padding-left:20px;margin:8px 0 16px}
.setup li{margin-bottom:4px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:14px}


/* ===== 縦一列のリスト表示 ===== */
main.wrap,header .wrap{max-width:1080px}
.board{display:flex;flex-direction:column;gap:26px;align-items:stretch}
.col{background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible}
.colhd{border-top:0;padding:0 2px 10px}
.colhd .name{display:flex;align-items:center;gap:8px;font-size:15px}
.colhd .name::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--cc)}
.list{padding:0;display:flex;flex-direction:column;gap:6px}
.list .empty{padding:4px 2px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;align-items:center;box-shadow:var(--shadow);transition:border-color .12s}
.task:hover{background:var(--panel);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.task.sub{margin-left:calc(34px * var(--d,1));padding:8px 12px;box-shadow:none;background:color-mix(in srgb,var(--panel) 60%,var(--bg))}
.tbody{display:flex;align-items:center;gap:12px}
.ttext{flex:1;min-width:0}
.meta{margin-top:0;flex:none;justify-content:flex-end}
.chk{margin-top:0}
/* タスクのメモ（表題の下の箇条書き） */
.tnotes{margin:5px 0 0;padding:0 0 0 1.15em;font-size:12.5px;line-height:1.55;color:var(--sub)}
.tnotes li{word-break:break-word}
.tnotes li.more{list-style:none;margin-left:-1.15em;color:var(--faint)}
.task.hasnotes,.task.hasnotes .tbody{align-items:flex-start}
.task.hasnotes .runbtn{align-self:flex-start}
.quick{padding:6px 0 0}
.quick input{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:11px 14px;font-size:14px}
.addcat{border-radius:12px;padding:0}
.addcat input{padding:12px 14px}
.flat{background:transparent;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:6px}
.flat .grouphd{padding:14px 2px 2px}
.flat .grouphd:first-child{padding-top:0}
.chip.cat{order:-1}
.runbtn{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0}
.runbtn svg{width:13px;height:13px;margin-left:2px}
.runbtn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.task.sub .runbtn{width:26px;height:26px}
.task.sub .runbtn svg{width:11px;height:11px}
.runparent{font-size:12px;color:var(--sub);margin:-8px 0 14px;padding:0 2px;line-height:1.5}
.runhd .rparent{flex:1 1 100%;order:4;font-size:12px;color:var(--sub);line-height:1.5}
.chip.run{cursor:pointer}
.chip.run svg{width:10px;height:10px}
.chip.tog{border:1px solid var(--line);cursor:pointer;font:inherit;font-size:12px;padding:2px 9px 2px 5px}
.chip.tog svg{width:12px;height:12px;transition:transform .15s}
.chip.tog.on svg{transform:rotate(90deg)}
.chip.tog:hover{border-color:var(--accent);color:var(--text)}
.chip.run.wait{background:var(--panel2);color:var(--sub)}
.chip.run.busy{background:var(--accent-soft);color:var(--accent)}
.chip.run.busy svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.chip.run.review{background:var(--amber-soft);color:var(--amber);font-weight:600}
.chip.run.ok{background:var(--green-soft);color:var(--green);font-weight:600}
.chip.run.ng{background:var(--red-soft);color:var(--red);font-weight:600}
.runtask{font-weight:600;margin-bottom:14px;padding:10px 12px;background:var(--panel2);border-radius:10px}
.runs{display:flex;flex-direction:column;gap:12px}
.runcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.runhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.runhd .rtitle{font-weight:700;flex:1 1 100%;order:3;min-width:0;line-height:1.5}
.runhd .rcat{margin-left:auto}
.runhd .rcat{font-size:12px;color:var(--faint)}
.mdbody{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;background:var(--panel2);border-radius:10px;padding:12px 14px;margin:8px 0;max-height:60vh;overflow:auto}
.mdbody .mdh{font-weight:700;font-size:14px;color:var(--text);margin-top:10px}
.mdbody .mdh:first-child{margin-top:0}
.mdbody .mdgap{height:6px}
.mdbody code,.runcard code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.mdbody .send{color:var(--red);font-weight:700}
.runcard .err{color:var(--red);font-size:13px;white-space:pre-wrap;margin:6px 0}
.runcard form textarea{margin-top:6px}
.runcard details{margin:6px 0}
.pg{margin:6px 0 4px}
.pgnow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:9px 12px;border-radius:10px;background:var(--panel2)}
.pgnow .pgdot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.pgnow.busy .pgdot{animation:pulse 1.2s ease-in-out infinite}
.pgnow.review{background:var(--amber-soft)} .pgnow.review .pgdot{background:var(--amber)} .pgnow.review b{color:var(--amber)}
.pgnow.ng{background:var(--red-soft)} .pgnow.ng .pgdot{background:var(--red)} .pgnow.ng b{color:var(--red)}
.pgnow.busy b{color:var(--accent)}
.pgnow .pgago{margin-left:auto;font-size:12px;color:var(--faint)}
.pgplan{list-style:none;margin:10px 0 6px;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.pgplan li{display:flex;align-items:center;gap:8px;color:var(--sub)}
.pgplan li svg{width:14px;height:14px;color:var(--green);flex:none}
.pgplan li.completed span{color:var(--faint);text-decoration:line-through}
.pgplan li.in_progress{color:var(--text);font-weight:600}
.pgplan .dotnow,.pgplan .dotwait{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid var(--faint)}
.pgplan .dotnow{border-color:var(--accent);background:radial-gradient(var(--accent) 35%,transparent 40%)}
.pgrecap{font-size:14px;line-height:1.7;margin:8px 0 4px;padding:10px 12px;background:var(--panel2);border-radius:10px}
.pgask{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--amber);margin:8px 0 2px}
.pgask svg{width:14px;height:14px;flex:none;margin-top:3px}
.pglast summary{cursor:pointer;font-size:13px;color:var(--accent)}
.runcard details.plan summary{cursor:pointer;font-size:13px;color:var(--accent);margin:4px 0}
a.chip.run{text-decoration:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.wp{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);background:var(--panel2);border-radius:999px;padding:3px 4px 3px 12px;margin-bottom:4px}
.wp b{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--panel);color:var(--sub)}
.wp.new b{background:var(--accent);color:#fff}
@media (max-width:640px){
  .tbody{flex-direction:column;align-items:flex-start;gap:4px}
  .meta{justify-content:flex-start}
  .task.sub{margin-left:calc(22px * var(--d,1))}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .stat{padding:10px 12px}
  .stat .n{font-size:20px}
  .board{grid-template-columns:1fr}
  .today{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}

/* ===== 引き継ぎ・メモ ===== */
.notes{display:flex;flex-direction:column;gap:26px}
.ncat .colhd .tools{display:flex;gap:2px}
.ncat .colhd .btn svg{width:13px;height:13px;vertical-align:-2px}
.ncat .colhd .tools .iconbtn.sm:hover{color:var(--accent);background:var(--accent-soft)}
.ncat .colhd .tools .iconbtn.sm.del:hover{color:var(--red);background:var(--red-soft)}
.nlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px 6px}
.ncat.rule .nlist{background:var(--panel2)}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:8px}
.nrow+.nrow{border-top:1px solid var(--line)}
.ncat.rule .nrow+.nrow{border-top-color:color-mix(in srgb,var(--line) 60%,transparent)}
.nchk{flex:none;width:20px;height:20px;margin-top:2px;border-radius:5px;border:2px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.nchk svg{width:12px;height:12px;opacity:0}
.nchk.on{background:var(--accent);border-color:var(--accent)}
.nchk.on svg{opacity:1}
.nt{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap;cursor:pointer;line-height:1.6}
.nrow.done .nt{color:var(--faint);text-decoration:line-through}
.nt .em{color:var(--red);font-weight:600}
.nlist .empty{padding:8px 6px}
.ncat .quick{padding:8px 0 0}
.nfold{display:inline-flex;align-items:center;gap:4px;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.nfold svg{flex:none;width:14px;height:14px;color:var(--faint);transition:transform .15s}
.nfold.on svg{transform:rotate(90deg)}
.ngrip{flex:none;width:22px;height:24px;margin:0 -6px 0 -4px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--faint);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.ngrip svg{width:16px;height:16px}
.ngrip:hover{color:var(--sub);background:var(--panel2)}
.ncat .colhd .cgrip{margin:0 -2px 0 -6px}
.ndrag-src{opacity:.35}
.ndrag-ghost{background:var(--panel);border:1px solid var(--accent);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.35);opacity:.97;list-style:none}
.ncat.ndrag-ghost{max-height:140px;overflow:hidden;padding:0 8px}
.ndrop{height:3px;background:var(--accent);border-radius:2px;margin:3px 6px}
body.ndragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.nfoot{border-top:1px dashed var(--line);padding-top:14px}
.chkline{display:flex;gap:8px;align-items:flex-start;font-weight:400 !important;color:var(--text) !important;font-size:14px !important;line-height:1.5}
.chkline input{margin-top:3px;width:18px;height:18px;flex:none}
/* ===== ルームの清掃 ===== */
.rsum{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.rsum span{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--panel2);color:var(--sub)}
.rsum span.red{background:var(--red-soft);color:var(--red)} .rsum span.amber{background:var(--amber-soft);color:var(--amber)}
.rooms{display:flex;flex-direction:column;gap:6px}
.room{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.room.red{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.room.amber{border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.room .rmain{flex:1;min-width:0;cursor:pointer}
.room .rname{font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.room .rb{font-weight:400;font-size:13px;color:var(--sub)}
.room .rmeta{font-size:13px;color:var(--sub);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 12px}
.room .rnext{font-weight:600;color:var(--text)}
.room.red .rnext{color:var(--red)} .room.amber .rnext{color:var(--amber)} .room.soon .rnext{color:var(--accent)}
.room .btn{flex:none}
.room .rmemo{font-size:13px;color:var(--sub);margin-top:2px;white-space:pre-wrap;word-break:break-word}
@media (max-width:640px){ .room{align-items:flex-start} .room .btn{margin-top:2px} }

/* ===== パスワード表 ===== */
.gdbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.gdat{font-size:13px;color:var(--sub)}
.gdre{height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;border-radius:10px}
.gdre svg{width:16px;height:16px}
.gdre.spin svg{animation:spin .8s linear infinite}
.gdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.gdblock{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.gdhd{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.gdhd .cnt{font-size:12px;font-weight:500;color:var(--sub)}
.gdrow{display:flex;align-items:center;gap:10px;padding:9px 14px}
.gdrow+.gdrow{border-top:1px solid var(--line)}
.gdname{flex:1;min-width:0;font-weight:600}
.gdtime{font-variant-numeric:tabular-nums;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--panel2);color:var(--text);white-space:nowrap}
.gdtime.now{background:var(--green-soft);color:var(--green)}
.gdtime.full{background:var(--red-soft);color:var(--red)}
.sqcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
.sqcard.low{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.sqmeta{font-size:13px;color:var(--sub);margin-top:2px}
.sqrates{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sqrate{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--panel2);color:var(--sub);white-space:nowrap}
.sqrate.g2{background:var(--green-soft);color:var(--green);font-weight:600}

  if(n===0) return {cls:'today', label:`今日 ${mdw(due)}`, n};
  if(n===1) return {cls:'soon', label:`明日 ${mdw(due)}`, n};
  if(n<=3) return {cls:'soon', label:`${mdw(due)} · あと${n}日`, n};
  return {cls:'', label:`${mdw(due)} · あと${n}日`, n};
}

// ===== todo.md の読み書き =====
const TASK_RE = /^(\s*)- \[( |x|X)\] (.*)$/;
function parseBody(s){
  let due=null, prio=false, who=null;
  const m = s.match(/📅\s*(\d{4}-\d{2}-\d{2})/);
  if(m){ due=m[1]; s=s.replace(m[0],''); }
  if(s.includes('🔺')){ prio=true; s=s.replace(/🔺/g,''); }
  // 担当者の印（👤名前）。2つ以上あっても最初の1人だけを担当にする
  const w = s.match(/👤\s*(\S+)/u);
  if(w){ who=w[1]; s=s.replace(/👤\s*\S*/gu,''); }
  return {text:s.replace(/\s+/g,' ').trim(), due, prio, who};
}
// 担当者の名前を整える（印・空白を外す）。空なら null
const cleanWho = v => String(v||'').replace(/👤/gu,'').replace(/\s+/g,'').trim() || null;
// メモの1行を整える（頭の「- 」「・」を外す。「[ ] 」で始まるとサブタスクと区別できなくなるので外す）
function cleanNote(l){ return String(l).trim().replace(/^(?:[-*+]\s+|[・•]\s*)/,'').replace(/^\[[ xX]\]\s*/,'').trim(); }
const notesOf = s => String(s||'').replace(/\r/g,'').split('\n').map(cleanNote).filter(Boolean);
function fmtTask(t, indent=''){
  return `${indent}- [ ] ${t.text}${t.who?` 👤${t.who}`:''}${t.due?` 📅${t.due}`:''}${t.prio?' 🔺':''}`;
}
function parseTodo(text){
  const sections=[]; let cur=null, stack=[];  // stack[d] = いまの深さ d のタスク（サブタスクは2スペースずつ深くなる）
  for(const line of text.replace(/\r/g,'').split('\n')){
    const h=line.match(/^##\s+(.+?)\s*$/);
    if(h){ cur={name:h[1], items:[]}; sections.push(cur); stack=[]; continue; }
    if(!cur) continue;
    const m=line.match(TASK_RE);
    if(m){
      const t={...parseBody(m[3]), notes:[], subs:[]};
      const d=Math.floor(m[1].replace(/\t/g,'  ').length/2);
      if(d>0 && stack.length){
        const pd=Math.min(d,stack.length)-1;
        stack[pd].subs.push(t); stack.length=pd+1; stack.push(t); continue;
      }
      cur.items.push(t); stack=[t]; continue;
    }
    // タスクの下の、チェックの無い字下げした行はそのタスクのメモ（何段目のタスクにも付く）
    const n=line.match(/^(\s+)\S/);
    if(n && stack.length){
      const d=Math.max(1, Math.floor(n[1].replace(/\t/g,'  ').length/2));
      const note=cleanNote(line); if(note) stack[Math.min(d,stack.length)-1].notes.push(note);
      continue;
    }
    if(line.trim()) cur.items.push({raw:line});
  }
  // インボックスは必ず先頭に置く
  const ib=sections.findIndex(s=>s.name===INBOX);
  if(ib<0) sections.unshift({name:INBOX, items:[]}); else if(ib>0) sections.unshift(sections.splice(ib,1)[0]);
  return sections;
}
function serializeTodo(sections){
  let out='# TODO\n';
  for(const s of sections){
    out+=`\n## ${s.name}\n`;
    if(s.items.length){
      out+='\n';
      for(const it of s.items){
        if(it.raw!==undefined){ out+=it.raw+'\n'; continue; }
        const put=(t,d)=>{ out+=fmtTask(t,'  '.repeat(d))+'\n'; for(const n of t.notes||[]) out+=`${'  '.repeat(d+1)}- ${n}\n`; for(const st of t.subs||[]) put(st,d+1); };
        put(it,0);
      }
    }
  }
  return out;
}
function parseSomeday(text){
  return text.replace(/\r/g,'').split('\n').filter(l=>/^\s*- /.test(l)).map(l=>l.replace(/^\s*- (\[[ xX]\] )?/,'').trim()).filter(Boolean);
}
function serializeSomeday(items){ return '# いつかやる\n' + (items.length? '\n'+items.map(i=>`- ${i}`).join('\n')+'\n' : ''); }
function parseDone(text){
  return text.replace(/\r/g,'').split('\n').map(l=>l.match(/^- \[[xX]\] (.*?)\s*(?:✅\s*(\d{4}-\d{2}-\d{2}))?\s*$/)).filter(Boolean).map(m=>({text:m[1], date:m[2]||''}));
}
// タスクの指し方: {cat, text} ／ サブタスクは parent（すぐ上の親）も持つ。2段より深いときは path（いちばん上から親までの並び）も持つ
const refPath = ref => ref.path || (ref.parent!==undefined ? [ref.parent] : []);
const mkRef = (cat, text, path=[]) => path.length ? {cat, text, parent:path[path.length-1], ...(path.length>1?{path:[...path]}:{})} : {cat, text};
const samePath = (a, b) => a.length===b.length && a.every((x,i)=>x===b[i]);
function findTask(sections, ref){
  const sec=sections.find(s=>s.name===ref.cat); if(!sec) return null;
  let list=sec.items.filter(i=>i.text!==undefined), parent=null;
  for(const name of refPath(ref)){ parent=list.find(t=>t.text===name); if(!parent) return null; list=parent.subs; }
  const t=list.find(t=>t.text===ref.text); if(!t) return null;
  if(parent) return {sec, parent, task:t, remove:()=>{ const i=parent.subs.indexOf(t); if(i>=0) parent.subs.splice(i,1); }};
  return {sec, task:t, remove:()=>{ const i=sec.items.indexOf(t); if(i>=0) sec.items.splice(i,1); }};
}

const b64enc = s => { const b=new TextEncoder().encode(s); let bin=''; for(let i=0;i<b.length;i+=0x8000) bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

function githubBackend(token, repo){
  const api = async (path, opts={}) => {
    const r = await fetch(`https://api.github.com/repos/${repo}${path}`, {
      ...opts, cache:'no-store',
      headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.body?{'Content-Type':'application/json'}:{})},
    });
    if(r.status===404) return null;
    if(!r.ok){ const e=new Error(`GitHub ${r.status}`); e.status=r.status; try{ e.detail=(await r.json()).message; }catch{} throw e; }
    return r.status===204 ? {} : r.json();
  };
  return {
    kind:'github',
    async read(path){ const j=await api(`/contents/${encodeURI(path)}?ref=${BRANCH}&t=${Date.now()}`); return j ? {text:b64dec(j.content), sha:j.sha} : null; },
    async write(path, text, sha, message){ await api(`/contents/${encodeURI(path)}`, {method:'PUT', body:JSON.stringify({message, content:b64enc(text), branch:BRANCH, ...(sha?{sha}:{})})}); },
    async issues(){ const j=await api(`/issues?state=open&per_page=100&t=${Date.now()}`); return (j||[]).filter(i=>!i.pull_request).map(i=>({number:i.number,title:i.title,body:i.body||''})); },
    async closeIssue(n){ await api(`/issues/${n}/comments`,{method:'POST',body:JSON.stringify({body:'action-osに反映'})}); await api(`/issues/${n}`,{method:'PATCH',body:JSON.stringify({state:'closed'})}); },
    async check(){ const j=await fetch(`https://api.github.com/repos/${repo}`,{headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json'}}); if(!j.ok){ const e=new Error(`GitHub ${j.status}`); e.status=j.status; throw e; } },
  };
}
function demoBackend(){
  const files={}; let n=0; const iss=[{number:99,title:'デモ: 予約表の印刷',body:'仕事用'}];
  const seed = async path => { try{ const r=await fetch('../'+path,{cache:'no-store'}); if(r.ok) return await r.text(); }catch{} return null; };
  return {
    kind:'demo', log:[],
    async read(path){ if(!(path in files)){ const t=await seed(path); files[path]= t===null?null:{text:t,sha:'d'+(n++)}; } return files[path] ? {...files[path]} : null; },
    async write(path,text,sha,message){ if(files[path] && files[path].sha!==sha){ const e=new Error('GitHub 409'); e.status=409; throw e; } files[path]={text,sha:'d'+(n++)}; this.log.push({path,message,text}); },
    async issues(){ return iss.slice(); },
    async closeIssue(num){ const i=iss.findIndex(x=>x.number===num); if(i>=0) iss.splice(i,1); },
    async check(){},
  };
}

// ファイルを最新に読み直してから変更を当てて保存する（同時編集・競合に強くする）
async function mutateFile(path, fn, message, init=''){
  for(let attempt=0; attempt<3; attempt++){
    const cur=await S.be.read(path);
    const next=fn(cur?cur.text:init);
    if(next===false) throw Object.assign(new Error('対象が見つかりません'),{gone:true});
    if(cur && next===cur.text) return;
    try{ await S.be.write(path, next, cur&&cur.sha, message); return; }
    catch(e){ if(e.status===409||e.status===422){ continue; } throw e; }
  }
  throw new Error('保存が競合しました。もう一度試してください');
}
// 画面はすぐ変え、GitHubへの保存は裏で1件ずつ順番に行う

function enqueue(label, local, remote){

async function pump(){
  if(qRunning) return;
  qRunning=true; setSyncIndicator();

    const job=Q.shift();

}

const somedayFile = (fn, msg) => mutateFile('someday.md', t=>{ const it=parseSomeday(t); if(fn(it)===false) return false; return serializeSomeday(it); }, msg, '# いつかやる\n');

function completeTask(ref){

function updateTask(ref, patch){
  const fn=s=>{
    const f=findTask(s,ref); if(!f) return false;
    Object.assign(f.task, {text:patch.text, due:patch.due, prio:patch.prio, who:patch.who||null});
    if(patch.notes) f.task.notes=[...patch.notes];
    if(patch.subs) f.task.subs=JSON.parse(JSON.stringify(patch.subs));
    // 親タスクを変える（同じカテゴリの中で、別のタスクの下へ／いちばん上へ）
    if(patch.moveTo && !samePath(patch.moveTo, refPath(ref))){
      const to=patch.moveTo, dest = to.length ? findTask(s, mkRef(ref.cat, to[to.length-1], to.slice(0,-1))) : null;
      if(to.length && !dest) return false;
      f.remove(); (dest ? dest.task.subs : f.sec.items).push(f.task); return;
    }
    if(patch.cat && patch.cat!==ref.cat && ref.parent===undefined){
      f.remove(); s.find(x=>x.name===patch.cat).items.push(f.task);
    }
  };
  // 名前・置き場所・カテゴリが変わったら、そのタスク（と下のタスク）の実行の記録も合わせる
  // （合わせないと、実行係が「todo.md から消えたタスク」とみなして実行を閉じてしまう）
  const oldPath=refPath(ref), moved=patch.moveTo && !samePath(patch.moveTo, oldPath);
  const newPath=moved ? patch.moveTo : oldPath, newCat=(!moved && patch.cat && ref.parent===undefined) ? patch.cat : ref.cat;
  const fixers=[];
  if(patch.text!==ref.text || moved || newCat!==ref.cat) fixers.push(runsRenamer(ref.cat, oldPath, ref.text, newCat, newPath, patch.text));
  // 編集画面でサブタスクの名前を変えたときも、そのサブタスク（と下のタスク）の実行の記録を合わせる（上の書き換えのあとの置き場所で探す）
  const here=[...newPath, patch.text];
  for(const rn of patch.subRenames||[]) fixers.push(runsRenamer(newCat, here, rn.from, newCat, here, rn.to));
  const fix = runs=>{ let hit=false; for(const f of fixers) if(f(runs)!==false) hit=true; if(!hit) return false; };
  const touches = fixers.length>0 && fix(JSON.parse(JSON.stringify(S.runs)))!==false;
  enqueue('更新しました', ()=>{ fn(S.sections); if(touches) fix(S.runs); }, async ()=>{
    await opsTodo(fn, `dashboard: 「${patch.text}」を更新`);
    if(touches) await runsFile(fix, `dashboard: 「${patch.text}」の実行の記録を合わせる`).catch(e=>{ if(!e.gone) throw e; });
  });
}
function runsRenamer(cat, oldPath, oldText, newCat, newPath, newText){
  const oldFull=[...oldPath, oldText], newFull=[...newPath, newText];
  const setPath=(r,p)=>{ delete r.parent; delete r.path; if(p.length){ r.parent=p[p.length-1]; if(p.length>1) r.path=[...p]; } };
  return runs=>{ let hit=false;
    for(const r of runs){
      if(!runOpen(r) || r.cat!==cat) continue;
      const rp=runPath(r);
      if(r.task===oldText && samePath(rp, oldPath)){ r.task=newText; setPath(r, newPath); r.cat=newCat; hit=true; }
      else if(rp.length>=oldFull.length && samePath(rp.slice(0,oldFull.length), oldFull)){ setPath(r, [...newFull, ...rp.slice(oldFull.length)]); r.cat=newCat; hit=true; }
    }
    if(!hit) return false;
  };
}

function deleteCategory(name){
  const fn=s=>{ const i=s.findIndex(x=>x.name===name); if(i<0||name===INBOX) return false; const [sec]=s.splice(i,1); s.find(x=>x.name===INBOX).items.push(...sec.items); };
  enqueue(`カテゴリ「${name}」を削除しました`, ()=>fn(S.sections), ()=>opsTodo(fn, `dashboard: カテゴリ「${name}」を削除`));
}
function moveCategory(name){
  const fn=s=>{ const i=s.findIndex(x=>x.name===name); if(i<=1) return false; [s[i-1],s[i]]=[s[i],s[i-1]]; };

}
// 「仕事：〇〇」「〇〇 #仕事」のようにカテゴリ名が書かれていたら、そのカテゴリと本文に分ける
function pickCategory(title){
  const names=catNames().filter(n=>n!==INBOX);
  for(const n of names){
    const pre=new RegExp('^\\s*'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:：、,]\\s*');
    if(pre.test(title)) return {cat:n, text:title.replace(pre,'').trim()};
    const tag='#'+n;
    if(title.includes(tag)) return {cat:n, text:title.replace(tag,'').replace(/\s+/g,' ').trim()};
  }
  return {cat:null, text:title.trim()};
}

// デスクトップアプリのスレッドの会話記録（<ホーム>/.claude/projects/<作業フォルダ>/<セッション>.jsonl。場所は実行係が runs.json の proj_dir に書く）
function sessionLog(sid){ if(!S.projDir) return `（セッション ${sid}）`; const sep=S.projDir.includes('\\')?'\\':'/'; return `${S.projDir}${sep}${sid}.jsonl`; }
// サブタスクのときは、親タスク・同じ親の他のサブタスク・親タスクのスレッドの会話記録を添える
function subContext(r){
  if(!r.parent) return '';
  let t=`\n\nこのタスクは、親タスクを進めるためのサブタスクの1つです。親タスクは目的として踏まえ、作業はこのサブタスクの範囲にとどめてください。`;
  if(r.siblings&&r.siblings.length) t+=`\n同じ親タスクの他のサブタスク（参考。このスレッドではやらない）:\n${r.siblings.map(x=>`  - ${x}`).join('\n')}`;
  if(r.parent_session) t+=`\n親タスクのスレッドの会話記録: ${sessionLog(r.parent_session)}\n経緯が分からないところがあるときだけ、この記録から必要な部分を探して読んでください（長いので全部は読まない）。`;

}
// 下にサブタスクがあるタスクの進め方と完了の仕方（親の行を先に消すと、残ったサブタスクが1段上にずれるため）
function subsRule(r, who){
  if(!(r.subs && r.subs.length)) return '';
  return `${who}の下にはサブタスクがあります（上の一覧）。進め方と完了の仕方:
- どのサブタスクから・どの順で進めるかを提案し、合意したものを1つずつ進める（全部を一度に進めない）。
- サブタスクが1つ終わるたびに、そのサブタスクを完了にしてよいか確認する。了承されたら、そのサブタスクの行だけを todo.md から消し（その下にさらに行があれば一緒に消す）、done/YYYY-MM.md に「- [x] サブタスク名（${r.task}） ✅YYYY-MM-DD」を1行足して、その2つだけをコミットして push する。
- ${who}自体の行を完了にするのは、下のサブタスクがすべて片付いてから。下に行が残っているうちは${who}の行を消さない（消すと、残った行が1段上にずれる）。残っているのに終えたいと言われたら、残りをどうするか（一緒に完了にする・残しておく）を確認する。`;
}
// salon-os からの依頼（〔依頼 salon-os#番号〕の印）のタスク・その下のサブタスクなら、最初に Issue の本文とやり取りを読ませる
// （▶ のスレッドは作業フォルダで開くので、Action OS の CLAUDE.md の「取りかかるとき」の決まりが届かないため）

}

${rules()}`;

function buildParentAsk(r){

${lines.join('\n')}${r.note?`\n補足（ユーザーより）: ${r.note}`:''}${r.near_session?`\n\n途中の親タスク「${r.near_task}」にも別のスレッドがあります。その会話記録: ${sessionLog(r.near_session)}\n指示書を書くときに経緯が足りなければ、この記録から必要な部分だけ探して読んでください（長いので全部は読まない）。`:''}

立て方:
- start_session を initiation "user_asked" で使い、このスレッドの下に立てる（ユーザーがダッシュボードで頼んだもの）。
- 指示書は、このスレッドで分かっている経緯（決まったこと・関係するファイル・やりかけの作業）を踏まえて書く。
- 指示書の1行目に、次の1行をそのまま入れる（ダッシュボードが子スレッドの進み具合を追う目印）:
【Action OS から】（実行ID: ${r.id}）

${r.subs&&r.subs.length?`- このサブタスクの下にはさらにサブタスクがあるので、指示書には次の決まりもそのまま入れる:\n${subsRule(r,'このサブタスク').replace(/^/gm,'  ')}\n`:''}- 立てたら、このスレッドでは立てたことを1行で報告するだけにし、サブタスクの作業はこのスレッドでは進めない。`;

// サブタスクを親タスクのスレッドから立てられるか（PC で、親タスクのスレッドが開いていて、その ID が分かっているとき）
// 上の階層のタスクで開いている実行（近い順）。すぐ上の親にスレッドが無ければ、さらに上の親のスレッドを使う
function ancestorRuns(ref){ const out=[]; let p=refPath(ref); while(p.length){ const r=runFor(mkRef(ref.cat, p[p.length-1], p.slice(0,-1))); if(r) out.push(r); p=p.slice(0,-1); } return out; }
// 子スレッドを立ててもらう先は、開いているうちで「いちばん上」の親タスクのスレッド（孫でも、途中の親にスレッドがあっても、いちばん上の親の下にそろえる）
function parentRunFor(ref){ if(ref.parent===undefined || !IS_MAC_DESKTOP) return null; return ancestorRuns(ref).filter(pr=>pr.status==='opened' && pr.desk_local).pop() || null; }
const threadName = r => (S.progress[r.id] && S.progress[r.id].title) || r.task;
function startRun(ref, note, extra={}){
  const f=findTask(S.sections, ref);
  const sub = ref.parent!==undefined;
  const run={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), task:ref.text, cat:ref.cat, due:f?.task.due||null,
    subs:(f?.task.subs||[]).map(x=>x.text), note:note||null, created:nowJst(), updated:nowJst(), ...extra};
  if(f?.task.notes?.length) run.notes=[...f.task.notes];
  if(f?.task.who) run.who=f.task.who;
  if(sub){
    run.parent=ref.parent; run.parent_due=f?.parent.due||null;
    if(refPath(ref).length>1) run.path=[...refPath(ref)];
    run.siblings=(f?.parent.subs||[]).filter(x=>x.text!==ref.text).map(x=>x.text);
    const pr=ancestorRuns(ref).find(x=>x.desk_session);  // 親タスク（無ければさらに上）で開いているスレッドがあれば、その会話記録を参考に渡す
    if(pr && pr.desk_session) run.parent_session=pr.desk_session;
    const pp=parentRunFor(ref);  // 親タスクのスレッドから子スレッドとして立ててもらう
    if(pp){ run.via='parent'; run.parent_run=pp.id; run.parent_local=pp.desk_local;
      // 途中の親タスクにもスレッドがあれば、その会話記録を指示書づくりの参考に渡す
      if(pr && pr.id!==pp.id){ run.near_session=pr.desk_session; run.near_task=pr.task; } }
  }
  run.prompt = run.via==='parent' ? buildParentAsk(run) : buildPrompt(run);
  const here = IS_MAC_DESKTOP && S.workdir;
  run.status = here ? 'opened' : 'queued';
  const ok = here ? openInDesktop(run) : false;
  enqueue(!here ? 'PC のデスクトップアプリに開くよう依頼しました'
    : run.via==='parent' ? (ok ? `依頼文をコピーして親スレッドを開きました。${PASTE_KEY} → Enter で子スレッドが立ちます` : '親スレッドに貼り付ける文を出しました')
    : 'デスクトップアプリに開きました。Enter で始まります',
    ()=>S.runs.push({...run}), ()=>runsFile(runs=>{ runs.push(run); }, `dashboard: 「${ref.text}」のスレッドを依頼`));
}
// 旧い方式で止まったものを、デスクトップアプリの新しいスレッドに引き継ぐ
function handover(id, note){
  const old=S.runs.find(x=>x.id===id); if(!old) return;
  setRun(id,{status:'closed'},'','dashboard: 旧いスレッドを閉じる');
  startRun(runRef(old), note, {prev_session:old.session||null});
}
function setRun(id, patch, label, msg){
  enqueue(label||null, ()=>patchRun(id,patch)(S.runs), ()=>runsFile(patchRun(id,patch), msg));
}
// 計画や実行が進んでいる間は runs.json だけをこまめに読み直す
async function pollRuns(){
  if(!S.be || qRunning || Q.length || document.visibilityState!=='visible') return;
  if(!S.runs.some(r=>RUN_ST[r.status]?.active)) return;
  try{
    const [f,pg]=await Promise.all([S.be.read('runs.json'), S.be.read('progress.json').catch(()=>null)]);
    const next=parseRuns(f&&f.text), nextPg=parseProgress(pg&&pg.text);
    if(JSON.stringify(nextPg)!==JSON.stringify(S.progress)){
      const wasSt=Object.fromEntries(Object.entries(S.progress).map(([k,v])=>[k,v.state]));
      S.progress=nextPg;
      const w=Object.entries(nextPg).find(([k,v])=>v.state==='waiting' && wasSt[k] && wasSt[k]!=='waiting');
      if(w){ const r=next.find(x=>x.id===w[0]); toast(`「${(r&&r.task||'').slice(0,18)}」が返事を待っています`); }
      if(!S.modal && !document.activeElement?.closest?.('form,textarea')) render();
    }
    if(JSON.stringify(next)!==JSON.stringify(S.runs)){
      const was=Object.fromEntries(S.runs.map(r=>[r.id,r.status]));
      S.runs=next;
      const changed=next.find(r=>was[r.id] && was[r.id]!==r.status && RUN_ST[r.status].attn);
      if(changed) toast(`「${changed.task}」が${RUN_ST[changed.status].label}になりました`);
      if(!S.modal && !document.activeElement?.closest?.('form,textarea')) render();
    }
  }catch(e){ console.warn(e); }
}
function parseProgress(text){ try{ const d=JSON.parse(text||'{}'); return d&&d.runs&&typeof d.runs==='object'?d.runs:{}; }catch{ return {}; } }
const PG_ST = {working:{label:'作業中', cls:'busy'}, waiting:{label:'返事待ち', cls:'review'}, blocked:{label:'止まっている', cls:'ng'}};
function ago(iso){
  if(!iso) return ''; const t=Date.parse(iso); if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'たった今'; if(m<60) return `${m}分前`; const h=Math.round(m/60); if(h<24) return `${h}時間前`; return `${Math.round(h/24)}日前`;
}
function progressView(pg){
  if(!pg) return `<div class="hint">デスクトップアプリで Enter を押して始めると、ここに進み具合が出ます。</div>`;
  const st=PG_ST[pg.state]||PG_ST.working;
  const planHtml = (pg.plan||[]).length ? `<ul class="pgplan">${pg.plan.map(p=>`<li class="${p.s}">${p.s==='completed'?icon('check'):p.s==='in_progress'?'<span class="dotnow"></span>':'<span class="dotwait"></span>'}<span>${esc(p.t)}</span></li>`).join('')}</ul>` : '';
  return `<div class="pg">
    <div class="pgnow ${st.cls}"><span class="pgdot"></span><b>${st.label}</b><span>${esc(pg.doing||'')}</span><span class="pgago">${esc(ago(pg.last_at))}</span></div>
    ${pg.title?`<div class="hint">デスクトップのスレッド名：${esc(pg.title)}</div>`:''}
    ${planHtml}
    ${pg.recap?`<div class="pgrecap">${esc(pg.recap)}</div>`:''}
    ${pg.ask?`<div class="pgask">${icon('flag')}<span>${esc(pg.ask)}</span></div>`:''}
    ${pg.last_text?`<details class="pglast"><summary>Claude の最後の発言を見る</summary><div class="mdbody">${md(pg.last_text)}</div></details>`:''}
  </div>`;
}
function md(text){
  return esc(text||'').trim().split('\n').map(l=>{
    if(/^#{1,4}\s/.test(l)) return `<div class="mdh">${l.replace(/^#+\s*/,'')}</div>`;
    if(!l.trim()) return '<div class="mdgap"></div>';
    return '<div>'+l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/【送信】/g,'<span class="send">【送信】</span>')+'</div>';
  }).join('');
}
// 計画の「作業場所: `xxx/`（既存|新規）」を読み取る
function workplace(r){
  const m=(r.plan||'').match(/作業場所\s*[:：]\s*`?([^`\s（(]+)`?\s*[（(]\s*(既存|新規)/);
  return m ? {path:m[1], kind:m[2]} : null;
}
function viewRuns(){
  const list=S.runs.filter(runOpen).slice().reverse();
  const hist=S.runs.filter(r=>!runOpen(r)).slice(-10).reverse();
  const card=r=>{
    const st=RUN_ST[r.status];
    const wp=workplace(r);
    const openBtn = r.url ? `<a class="btn sm pri" href="${esc(r.url)}" target="_blank" rel="noopener">スレッドを開く</a>` : '';
    const finish = `<button class="btn sm" data-act="run-close" data-id="${r.id}">スレッドを終える</button><button class="btn sm" data-act="run-complete" data-id="${r.id}">タスクを完了にする</button>`;
    const ctl = {
      queued:`<div class="hint">PC のデスクトップアプリにスレッドを開くのを待っています（PC が起動していれば30秒ほど）。開いたら PC で Enter を押すと始まります。</div><div class="actions"><button class="btn sm danger" data-act="run-cancel" data-id="${r.id}">取り消す</button>${IS_MAC_DESKTOP?`<button class="btn sm pri" data-act="run-reopen" data-id="${r.id}">今ここで開く</button>`:''}</div>`,
      opened:`${r.via==='parent'&&!S.progress[r.id]?`<div class="hint">親タスクのスレッドで <b>${PASTE_KEY} → Enter</b> を押すと、親スレッドがこのサブタスクの子スレッドを立てます。立つと、ここに進み具合が出ます。</div>`:progressView(S.progress[r.id])}<div class="actions">${finish}${IS_MAC_DESKTOP&&!S.progress[r.id]?`<button class="btn sm pri" data-act="run-reopen" data-id="${r.id}">${r.via==='parent'?'コピーして親スレッドをもう一度開く':'もう一度開く'}</button>`:''}</div>`,
      thread:`<div class="hint">（旧い方式のスレッドです）デスクトップアプリの新しいスレッドに、これまでの会話記録ごと引き継げます。</div>
        <form data-act="run-resume" data-id="${r.id}"><textarea class="inp" name="note" rows="2" placeholder="引き継ぎ時に伝えること（任意）"></textarea>
        <div class="actions">${finish}<button class="btn sm pri">デスクトップアプリで続ける</button></div></form>`,
      paused:`<div class="hint">（旧い方式のスレッドです）デスクトップアプリの新しいスレッドに、これまでの会話記録ごと引き継げます。</div>
        <form data-act="run-resume" data-id="${r.id}"><textarea class="inp" name="note" rows="2" placeholder="引き継ぎ時に伝えること（任意）"></textarea>
        <div class="actions">${finish}<button class="btn sm pri">デスクトップアプリで続ける</button></div></form>`,
      review:`<form data-act="run-resume" data-id="${r.id}"><div class="hint">（旧い方式で作られた計画です）返事を書いて「デスクトップアプリで続ける」を押すと、この計画の続きとしてデスクトップアプリにスレッドが開きます。</div><textarea class="inp" name="note" rows="3" placeholder="計画への返事（例：数字を確認するところまで進めて。絞り込みは一緒にやる）"></textarea>
        <div class="actions"><button type="button" class="btn sm danger left" data-act="run-cancel" data-id="${r.id}">取り消す</button><button class="btn sm pri">デスクトップアプリで続ける</button></div></form>`,
      done:`<div class="actions">${finish}</div>`,
      failed:`<div class="err">${esc(r.error||'失敗しました')}</div><div class="actions"><button class="btn sm" data-act="run-close" data-id="${r.id}">閉じる</button></div>`,
    }[r.status]||'';
    const body = r.status==='review' && r.plan ? `<details class="plan"><summary>計画を見る</summary><div class="mdbody">${md(r.plan)}</div></details>` : (r.status==='done'&&r.result?`<div class="mdbody">${md(r.result)}</div>`:'');
    return `<div class="runcard"><div class="runhd"><span class="chip run ${st.cls}">${icon('play')}${st.label}</span><span class="rtitle">${esc(r.task)}</span><span class="rcat">${esc(r.cat||'')}</span>${r.parent?`<span class="rparent">親タスク：${esc(r.parent)}</span>`:''}</div>
      ${wp?`<div class="wp ${wp.kind==='新規'?'new':''}">作業場所 <code>${esc(workName())}/${esc(wp.path.replace(/^\.?\/?/,''))}</code><b>${wp.kind}</b></div>`:''}
      ${body}
      ${ctl}</div>`;
  };
  return `<div class="runs">${list.length? list.map(card).join('') : `<div class="plain"><div class="empty">進行中のスレッドはありません。${IS_MAC_DESKTOP?'':'PC のダッシュボードで、'}タスクの右の ▶ から Claude のスレッドを立てられます。</div></div>`}
    ${hist.length?`<div class="monthhd">最近の履歴</div><div class="plain">${hist.map(r=>`<div class="prow"><div class="t">${esc(r.task)}${r.parent?`<div class="hint">親タスク：${esc(r.parent)}</div>`:''}${r.closed_why?`<div class="hint">自動で閉じました（${esc(r.closed_why)}）</div>`:''}</div><div class="d">${RUN_ST[r.status].label}</div></div>`).join('')}</div>`:''}</div>`;
}

// ===== 集計 =====
function allTasks(){
  const out=[];
  for(const s of S.sections) for(const it of s.items) if(it.text!==undefined){
    out.push({cat:s.name, t:it});
  }
  return out;
}
function stats(){
  const eow=endOfWeek(), t=todayStr(); let over=0, today=0, week=0, none=0;
  for(const {t:x} of allTasks()){
    if(!x.due){ none++; continue; }
    if(x.due<t) over++; else if(x.due===t) today++;
    if(x.due>=t && x.due<=eow) week++;
  }
  return {over,today,week,none,total:allTasks().length};
}
const FILTERS = {
  over:{label:'期限切れ', fn:x=>x.due && x.due<todayStr()},
  today:{label:'今日まで', fn:x=>x.due && x.due<=todayStr()},
  week:{label:'今週（日曜まで）', fn:x=>x.due && x.due<=endOfWeek()},
  none:{label:'期限なし', fn:x=>!x.due},
};
function sortTasks(a,b){
  if(a.t.prio!==b.t.prio) return a.t.prio?-1:1;
  if(a.t.due && b.t.due) return a.t.due<b.t.due?-1:a.t.due>b.t.due?1:0;
  if(a.t.due) return -1; if(b.t.due) return 1; return 0;
}
function sortByDue(a,b){
  if(a.t.due && b.t.due && a.t.due!==b.t.due) return a.t.due<b.t.due?-1:1;
  if(!!a.t.due!==!!b.t.due) return a.t.due?-1:1;
  if(a.t.prio!==b.t.prio) return a.t.prio?-1:1; return 0;
}

// ===== 描画 =====
function toast(msg, err){ S.toast={msg,err}; renderToast(); clearTimeout(toast.h); toast.h=setTimeout(()=>{ S.toast=null; renderToast(); }, err?4500:1800); }
function renderToast(){
  let el=document.getElementById('toast');
  if(!S.toast){ el&&el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.className='toast'+(S.toast.err?' err':''); el.textContent=S.toast.msg;
}

// サブのサブ以降（サブタスクの下にさらにサブタスクがあるもの）は開閉できる。開いているものだけこの端末に覚えておく（最初は閉じている）
const openKey = (cat, path, text) => JSON.stringify([cat, ...path, text]);
function isOpen(key){ try{ return JSON.parse(safeGet(LS.open)||'[]').includes(key); }catch{ return false; } }
function setOpen(key, on){ let a=[]; try{ a=JSON.parse(safeGet(LS.open)||'[]'); }catch{} a=a.filter(x=>x!==key); if(on) a.push(key); safeSet(LS.open, JSON.stringify(a.slice(-200))); }
function taskRow(cat, t, opts={}){
  const path = opts.path || [];
  const ref = mkRef(cat, t.text, path), sub = path.length>0;
  const kids = t.subs || [];
  const key = sub && kids.length ? openKey(cat, path, t.text) : null;
  const open = key ? isOpen(key) : true;
  const di=dueInfo(t.due);
  const meta=[];
  if(opts.showCat) meta.push(`<span class="chip cat" style="--cc:var(${catColor(cat)})"><i></i>${esc(cat)}</span>`);
  if(t.who) meta.push(`<button type="button" class="chip who${S.who===t.who?' on':''}" data-act="who" data-k="${esc(t.who)}" title="${esc(t.who)}の分だけ表示">${icon('user')}${esc(t.who)}</button>`);
  if(di) meta.push(`<span class="chip ${di.cls}">${icon('cal')}${esc(di.label)}</span>`);
  if(t.prio) meta.push(`<span class="chip prio">${icon('flag')}高</span>`);
  if(key && !opts.flat) meta.push(`<button type="button" class="chip tog${open?' on':''}" data-act="toggle" data-key="${esc(key)}" title="${open?'サブタスクを閉じる':'サブタスクを開く'}">${icon('chev')}サブ ${kids.length}件</button>`);
  else if(kids.length) meta.push(`<span class="chip">サブ ${kids.length}件</span>`);
  const run = runFor(ref);
  const pgr = run && run.status==='opened' ? S.progress[run.id] : null;
  if(pgr){ const st=PG_ST[pgr.state]||PG_ST.working; meta.push(`<span class="chip run ${st.cls}" data-act="tab" data-k="runs">${icon('play')}${st.label}${pgr.state==='working'&&pgr.doing?`・${esc(pgr.doing.replace(/しています$|ています$/,'中'))}`:''}</span>`); }
  else if(run) meta.push(run.url && run.status==='thread'
    ? `<a class="chip run ${RUN_ST[run.status].cls}" href="${esc(run.url)}" target="_blank" rel="noopener">${icon('play')}${RUN_ST[run.status].label}・開く</a>`
    : `<span class="chip run ${RUN_ST[run.status].cls}" data-act="tab" data-k="runs">${icon('play')}${RUN_ST[run.status].label}</span>`);
  const notes=t.notes||[], NOTE_MAX=3;
  const notesHtml = notes.length ? `<ul class="tnotes">${notes.slice(0,NOTE_MAX).map(n=>`<li>${esc(n)}</li>`).join('')}${notes.length>NOTE_MAX?`<li class="more">ほか ${notes.length-NOTE_MAX}行</li>`:''}</ul>` : '';
  let h=`<div class="task${sub?' sub':''}${notes.length?' hasnotes':''}"${sub?` style="--d:${path.length}"`:''}>
    <button class="chk" title="完了にする" data-act="done" data-ref='${esc(JSON.stringify(ref))}' >${icon('check')}</button>
    <div class="tbody" data-act="edit" data-ref='${esc(JSON.stringify(ref))}'>
      <div class="ttext">${esc(t.text)}${notesHtml}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}
    </div>${!run&&IS_MAC_DESKTOP?`<button class="runbtn" title="${sub?'このサブタスクを Claude で実行':'Claude で実行'}" data-act="run-open" data-ref='${esc(JSON.stringify(ref))}'>${icon('play')}</button>`:''}</div>`;
  if(!opts.flat && open) for(const st of kids) h+=taskRow(cat, st, {path:[...path, t.text]});
  return h;
}

function viewBoard(){
  const f=S.filter&&FILTERS[S.filter];
  return `<div class="board">${S.sections.map(s=>{
    let rows=s.items.filter(i=>i.text!==undefined).map(t=>({cat:s.name,t}));
    if(f) rows=rows.filter(r=>f.fn(r.t));
    if(S.who) rows=rows.filter(r=>whoMatch(r.t));
    rows.sort(sortTasks);
    if(f && !rows.length) return '';  // 担当者だけで絞り込んでいるときは、空の列も出す（その人の分を入力欄から足せるように）
    return `<section class="col" style="--cc:var(${catColor(s.name)})">
      <div class="colhd"><span class="name">${esc(s.name)}</span><span class="count">${rows.length}</span><span class="sp"></span>${s.name!==INBOX?`<button class="iconbtn sm" data-act="cat-del" data-name="${esc(s.name)}" title="このカテゴリを削除">${icon('x')}</button>`:''}</div>
      <div class="list">${rows.length? rows.map(r=>taskRow(r.cat,r.t)).join('') : '<div class="empty">タスクはありません</div>'}</div>
      <form class="quick" data-act="quick" data-cat="${esc(s.name)}"><input name="q" placeholder="＋ タスクを「〜する」の形で入力" autocomplete="off" enterkeyhint="done" ></form>
    </section>`;
  }).join('') || `<div class="empty">該当するタスクはありません ${S.filter||S.who?'<button type="button" class="btn sm" data-act="filter-reset">絞り込みを解く</button>':''}</div>`}</div>`;
}
// 担当者で絞り込む帯（カテゴリ別・期限順の上）。担当者がいないときは出さない
function whoBar(){
  const names=memberNames(); if(!names.length) return '';
  if(S.who && S.who!=='__none' && !names.includes(S.who)) setWho(null);
  const all=allTasks().map(r=>r.t);
  const pill=(k,label,n)=>`<button type="button" class="wp${(S.who||'')===k?' on':''}" data-act="who" data-k="${esc(k)}">${label}${n!==undefined?`<span class="cnt${n?'':' zero'}">${n}</span>`:''}</button>`;
  return `<div class="whobar"><span class="lbl">${icon('user')}担当</span>${pill('', 'すべて')}${names.map(n=>pill(n, esc(n), all.filter(t=>hasWho(t,n)).length)).join('')}${pill('__none','担当なし', all.filter(t=>!t.who).length)}</div>`;
}
function viewTimeline(){
  const f=S.filter&&FILTERS[S.filter];
  let rows=allTasks(); if(f) rows=rows.filter(r=>f.fn(r.t));
  if(S.who) rows=rows.filter(r=>whoMatch(r.t));
  rows.sort(sortByDue);
  const t=todayStr(), eow=endOfWeek();
  const groups=[['期限切れ','red',r=>r.t.due&&r.t.due<t],['今日','amber',r=>r.t.due===t],['今週','',r=>r.t.due&&r.t.due>t&&r.t.due<=eow],['来週以降','',r=>r.t.due&&r.t.due>eow],['期限なし','',r=>!r.t.due]];
  const body=groups.map(([name,cls,fn])=>{ const g=rows.filter(fn); if(!g.length) return ''; return `<div class="grouphd ${cls}">${name}（${g.length}）</div>`+g.map(r=>taskRow(r.cat,r.t,{showCat:true})).join(''); }).join('');
  return `<div class="flat">${body||`<div class="empty">該当するタスクはありません ${S.filter||S.who?'<button type="button" class="btn sm" data-act="filter-reset">絞り込みを解く</button>':''}</div>`}</div>`;
}
function viewSomeday(){

// ===== 引き継ぎ・メモ（notes.md）と ルームの清掃（rooms.md） =====
// どちらも、リポジトリにファイルがあるときだけタブを出す（設定画面から作れる）。Claude Code で話しかけて書き換えてもよい（CLAUDE.md の決まり）。
const NOTES_INIT = '# 引き継ぎ・メモ\n\n## 重要\n\n## 引き継ぎ\n\n## メモ\n';
const MEMO_INIT = '# ノート\n\n## メモ\n';
const ROOMS_INIT = '# ルームの清掃\n\n| ルーム | エリア | 建物 | 次回清掃 | 前回清掃 | 間隔（日） | メモ |\n|---|---|---|---|---|---|---|\n';

// --- 引き継ぎ・メモ と ノート ---
// notes.md: 「## 区分」ごとに、チェック付き（- [ ] / - [x]）か、チェック無し（- ）の箇条書き。**で囲んだところは赤く強調する
// memo.md（ノート）も同じ形。引き継ぎとは別に、あとで探して見る参照用のメモ（ポスト番号・設備の使い方・連絡先など）を貯めておく
function parseNotes(text){
  const cats=[]; let cur=null, title='引き継ぎ・メモ';
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    const h1=line.match(/^#\s+(.+?)\s*$/); if(h1 && !cats.length){ title=h1[1]; continue; }
    const h=line.match(/^##\s+(.+?)\s*$/); if(h){ cur={name:h[1], items:[]}; cats.push(cur); continue; }
    if(!cur || !line.trim()) continue;
    let m=line.match(/^\s*[-*] \[( |x|X)\]\s?(.*)$/); if(m){ cur.items.push({text:m[2].trim(), check:m[1]!==' '}); continue; }
    m=line.match(/^\s*[-*・]\s*(.*)$/); cur.items.push({text:(m?m[1]:line).trim(), check:null});
  }
  return {title, cats};
}
function serializeNotes(n){
  let out=`# ${n.title||'引き継ぎ・メモ'}\n`;
  for(const c of n.cats){
    out+=`\n## ${c.name}\n`;
    if(c.items.length){ out+='\n'; for(const it of c.items){ const t=it.text.replace(/\s*\n\s*/g,' '); out+= it.check===null ? `- ${t}\n` : `- [${it.check?'x':' '}] ${t}\n`; } }
  }
  return out;
}
// どちらのファイルを触るかは doc で選ぶ（'notes' が引き継ぎ、'memo' がノート）。保存の記録の頭には、ノートなら「ノート:」を付ける
const NDOC = {
  notes:{file:'notes.md', name:'引き継ぎ', title:'引き継ぎ・メモ', log:''},
  memo:{file:'memo.md', name:'ノート', title:'ノート', log:'ノート: '},
};
const ndoc = k => k==='memo' ? 'memo' : 'notes';
const ndocInit = k => ndoc(k)==='memo' ? MEMO_INIT : NOTES_INIT;
const fmtNote = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="em">$1</span>');
const notesFile = (fn,msg,k='notes') => mutateFile(NDOC[ndoc(k)].file, t=>{ const n=parseNotes(t); if(!/^#\s/m.test(String(t||''))) n.title=NDOC[ndoc(k)].title; if(fn(n)===false) return false; return serializeNotes(n); }, msg, ndocInit(k));
function noteOp(label, fn, msg, k='notes'){ k=ndoc(k); enqueue(label, ()=>{ if(S[k]) fn(S[k]); }, ()=>notesFile(fn, `dashboard: ${NDOC[k].log}${msg}`, k)); }
const findCat = (n, name) => n.cats.find(c=>c.name===name);
const findNote = (n, ref) => { const c=findCat(n, ref.cat); if(!c) return null; const i=c.items.findIndex(x=>x.text===ref.text); return i<0?null:{c, i, it:c.items[i]}; };
// 区分の既定：中身がすべてチェック無しなら、足すものもチェック無し（「重要」のような決まりごとの区分）
const catPlain = c => c.items.length>0 && c.items.every(x=>x.check===null);
function notesOpenCount(){ return S.notes ? S.notes.cats.reduce((a,c)=>a+c.items.filter(x=>x.check===false).length,0) : 0; }

function addNote(cat, text, check, k='notes'){
  noteOp('追加しました', n=>{ const c=findCat(n,cat); if(!c) return false; c.items.push({text, check: check?false:null}); }, `「${cat}」に「${text.slice(0,30)}」を追加`, k);
}
function toggleNote(ref){
  noteOp('', n=>{ const f=findNote(n,ref); if(!f || f.it.check===null) return false; f.it.check=!f.it.check; }, `「${ref.text.slice(0,30)}」のチェックを切り替え`, ref.doc);
}
function updateNote(ref, patch){
  noteOp('更新しました', n=>{
    const f=findNote(n,ref); if(!f) return false;
    f.it.text=patch.text;
    f.it.check = patch.kind==='plain' ? null : (f.it.check===null ? false : f.it.check);
    if(patch.cat && patch.cat!==ref.cat){ const to=findCat(n,patch.cat); if(!to) return false; f.c.items.splice(f.i,1); to.items.push(f.it); }
  }, `「${patch.text.slice(0,30)}」を更新`, ref.doc);
}
function deleteNote(ref){ noteOp('削除しました', n=>{ const f=findNote(n,ref); if(!f) return false; f.c.items.splice(f.i,1); }, `「${ref.text.slice(0,30)}」を削除`, ref.doc); }
function clearChecked(cat, k='notes'){ noteOp('済みを消しました', n=>{ const c=findCat(n,cat); if(!c) return false; const before=c.items.length; c.items=c.items.filter(x=>x.check!==true); if(c.items.length===before) return false; }, `「${cat}」の済みを消す`, k); }
function badNoteCat(name, except, k='notes'){
  if(!name) return '区分の名前を入れてください';
  if(/[#\n]/.test(name)) return '区分の名前に # は使えません';
  const n=S[ndoc(k)];
  if(n && n.cats.some(c=>c.name===name && c.name!==except)) return '同じ名前の区分があります';
  return null;
}
function addNoteCat(name, k='notes'){ noteOp('区分を追加しました', n=>{ if(findCat(n,name)) return false; n.cats.push({name, items:[]}); }, `${ndoc(k)==='notes'?'引き継ぎに':''}区分「${name}」を追加`, k); }
function renameNoteCat(from, to, k='notes'){ noteOp('区分の名前を変えました', n=>{ const c=findCat(n,from); if(!c || findCat(n,to)) return false; c.name=to; }, `区分「${from}」を「${to}」に変更`, k); }
function deleteNoteCat(name, k='notes'){ noteOp('区分を削除しました', n=>{ const i=n.cats.findIndex(c=>c.name===name); if(i<0) return false; n.cats.splice(i,1); }, `区分「${name}」を削除`, k); }
// ドラッグでの並べ替え。入れる場所は「その直前に来る行（区分）」で覚えておき、保存の直前に読み直した最新のファイルでもその前に入れる
// （ほかの人が行を足していてもずれないように）。見つからなければ、画面で見ていたときの位置（index）に入れる
function moveNoteTo(from, toCat, toIndex, beforeText){
  noteOp(from.cat===toCat?'':`「${toCat}」へ移しました`, n=>{
    const c=findCat(n, from.cat), to=findCat(n, toCat); if(!c || !to) return false;
    const i=c.items.findIndex(x=>x.text===from.text); if(i<0) return false;
    const [it]=c.items.splice(i,1);
    let at = beforeText!=null ? to.items.findIndex(x=>x.text===beforeText) : to.items.length;
    if(at<0) at=Math.min(toIndex, to.items.length);
    to.items.splice(at,0,it);
  }, `「${from.text.slice(0,30)}」を${from.cat===toCat?'並べ替え':`「${toCat}」へ移す`}`, from.doc);
}
function moveNoteCatTo(name, toIndex, beforeName, k='notes'){
  noteOp('', n=>{
    const i=n.cats.findIndex(c=>c.name===name); if(i<0) return false;
    const [c]=n.cats.splice(i,1);
    let at = beforeName!=null ? n.cats.findIndex(x=>x.name===beforeName) : n.cats.length;
    if(at<0) at=Math.min(toIndex, n.cats.length);
    n.cats.splice(at,0,c);
  }, `区分「${name}」を並べ替え`, k);
}

// 区分のメモを、貼り付け用の文にする（チェック付きは未対応だけ。** の強調は外す）
function noteCatText(c){

// ノートの区分の開け閉め（この端末に覚える。検索中はすべて開いて、当たった行だけ出す）

function setMemoShut(name, shut){ const a=memoShut().filter(x=>x!==name); if(shut) a.push(name); safeSet(LS.memoShut, JSON.stringify(a.slice(-200))); }
function viewNotes(k='notes'){

    const plain=catPlain(c), doneN=c.items.filter(x=>x.check===true).length;

        ${grip('note','つかんで並べ替え・ほかの区分へ移す')}

        <div class="nt" data-act="note-edit" data-ref='${ref(c,it)}'>${fmtNote(it.text)}</div></div>`).join('')
      : '<div class="empty">まだありません</div>';
    const name = memo
      ? `<button type="button" class="nfold ${closed?'':'on'}" data-act="mcat-fold" data-cat="${esc(c.name)}" title="${closed?'開く':'閉じる'}">${icon('chev')}<span class="name">${esc(c.name)}</span></button>`
      : `<span class="name">${esc(c.name)}</span>`;
    return `<section class="ncat ${plain&&!memo?'rule':''}" data-cat="${esc(c.name)}" style="--cc:var(${PALETTE[ci%PALETTE.length]})">
      <div class="colhd">${grip('ncat','つかんで区分ごと並べ替え',' cgrip')}${name}<span class="count">${c.items.length}</span><span class="sp"></span>
        ${c.items.some(x=>x.check!==true)?`<button class="btn sm" data-act="note-copy" data-doc="${k}" data-cat="${esc(c.name)}" title="${plain?'この区分を全部':'まだ対応していないものを'}コピー">${icon('copy')} コピー</button>`:''}
        ${doneN?`<button class="btn sm" data-act="note-clear" data-doc="${k}" data-cat="${esc(c.name)}">済みを消す（${doneN}）</button>`:''}
        <span class="tools">
          <button class="iconbtn sm" data-act="ncat-rename" data-doc="${k}" data-cat="${esc(c.name)}" title="名前を変える">${icon('edit')}</button>
          <button class="iconbtn sm del" data-act="ncat-del" data-doc="${k}" data-cat="${esc(c.name)}" title="区分を削除">${icon('x')}</button>
        </span></div>
      ${closed?'':`<div class="nlist">${rows}</div>
      ${qq?'':`<form class="quick" data-act="note-add" data-doc="${k}" data-cat="${esc(c.name)}"><input name="q" placeholder="＋ ${esc(c.name)}に追加${plain||memo?'':'（チェック付き）'}" autocomplete="off" enterkeyhint="done"></form>`}`}
    </section>`;
  }).join('');
  const search = memo ? `<form class="supsearch" onsubmit="return false"><input class="inp" data-memoq placeholder="さがす（メモ・区分）" value="${esc(S.memoQ||'')}" autocomplete="off"></form>` : '';
  const empty = qq ? `<div class="empty">「${esc(S.memoQ.trim())}」に合うメモはありません <button type="button" class="btn sm" data-act="memo-clear">検索を消す</button></div>` : '<div class="empty">区分がありません。下から追加してください</div>';
  const hint = memo
    ? 'あとで探して見るメモ（ポスト番号・設備の使い方・連絡先など）を、区分ごとに貯めておく場所です。対応したら片付けるものは「引き継ぎ」へ。区分の名前を押すと開け閉めできます（この端末に覚えます）。行や区分の左の ⋮⋮ を押したまま動かすと、並べ替えたり、ほかの区分へ移したりできます（検索中はできません）。文字を押すと編集できます。**で囲んだところは赤く強調されます。'
    : '行や区分の左の ⋮⋮ を押したまま動かすと、並べ替えたり、ほかの区分へ移したりできます。チェックを押すと「対応済み」になります。済んだものは区分の「済みを消す」でまとめて片付けられます。文字を押すと編集できます。**で囲んだところは赤く強調されます。';
  return `${search}<div class="notes" data-doc="${k}">${body||empty}
    <div class="nfoot">${qq?'':`<form class="quick" data-act="ncat-add" data-doc="${k}"><input name="q" placeholder="＋ 区分を追加（例：${memo?'設備の使い方':'セラピスト情報'}）" autocomplete="off" enterkeyhint="done"></form>`}
