// ===== 引き継ぎ・メモ（notes.md）と ルームの清掃（rooms.md） =====
// どちらも、リポジトリにファイルがあるときだけタブを出す（設定画面から作れる）。Claude Code で話しかけて書き換えてもよい（CLAUDE.md の決まり）。
const NOTES_INIT = '# 引き継ぎ・メモ\n\n## 重要\n\n## 引き継ぎ\n\n## メモ\n';
const MEMO_INIT = '# ノート\n\n## メモ\n';
const ROOMS_INIT = '# ルームの清掃\n\n| ルーム | エリア | 建物 | 次回清掃 | 前回清掃 | 間隔（日） | メモ |\n|---|---|---|---|---|---|---|\n';

// --- 引き継ぎ・メモ と ノート ---
// notes.md: 「## 区分」ごとに、チェック付き（- [ ] / - [x]）か、チェック無し（- ）の箇条書き。**で囲んだところは赤く強調する
// 1行目が表題。内容（任意・2026-11-28）は、そのすぐ下に2つ下げた「  - 」の行で1行ずつ書く（例：「- [ ] E403 洗濯機」の下に「  - 乾燥不良・異臭あり」）
// memo.md（ノート）も同じ形。引き継ぎとは別に、あとで探して見る参照用のメモ（ポスト番号・設備の使い方・連絡先など）を貯めておく
function parseNotes(text){
  const cats=[]; let cur=null, title='引き継ぎ・メモ';
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    const h1=line.match(/^#\s+(.+?)\s*$/); if(h1 && !cats.length){ title=h1[1]; continue; }
    const h=line.match(/^##\s+(.+?)\s*$/); if(h){ cur={name:h[1], items:[]}; cats.push(cur); continue; }
    if(!cur || !line.trim()) continue;
    // 2つ以上下げた「- 」の行は、すぐ上の項目の内容（区分の最初の行なら、ふつうの項目として読む）
    let m=line.match(/^\s{2,}[-*・]\s?(.*)$/); const last=cur.items[cur.items.length-1];
    if(m && last){ last.body = last.body ? last.body+'\n'+m[1].trimEnd() : m[1].trimEnd(); continue; }
    m=line.match(/^\s*[-*] \[( |x|X)\]\s?(.*)$/); if(m){ cur.items.push({text:m[2].trim(), body:'', check:m[1]!==' '}); continue; }
    m=line.match(/^\s*[-*・]\s*(.*)$/); cur.items.push({text:(m?m[1]:line).trim(), body:'', check:null});
  }
  return {title, cats};
}
function serializeNotes(n){
  let out=`# ${n.title||'引き継ぎ・メモ'}\n`;
  for(const c of n.cats){
    out+=`\n## ${c.name}\n`;
    if(c.items.length){ out+='\n'; for(const it of c.items){ const t=it.text.replace(/\s*\n\s*/g,' '); out+= it.check===null ? `- ${t}\n` : `- [${it.check?'x':' '}] ${t}\n`; out+=noteBodyLines(it.body).map(l=>`  - ${l}\n`).join(''); } }
  }
  return out;
}
// 内容を行に分ける（空の行と、行の前後の空白は捨てる）
const noteBodyLines = b => String(b||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
const noteBody = b => noteBodyLines(b).join('\n');
// どちらのファイルを触るかは doc で選ぶ（'notes' が引き継ぎ、'memo' がノート）。保存の記録の頭には、ノートなら「ノート:」を付ける
const NDOC = {
  notes:{file:'notes.md', name:'引き継ぎ', title:'引き継ぎ・メモ', log:''},
  memo:{file:'memo.md', name:'ノート', title:'ノート', log:'ノート: '},
};
const ndoc = k => k==='memo' ? 'memo' : 'notes';
const ndocInit = k => ndoc(k)==='memo' ? MEMO_INIT : NOTES_INIT;
const fmtNote = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="em">$1</span>');
const notesFile = (fn,msg,k='notes') => mutateFile(NDOC[ndoc(k)].file, t=>{ const n=parseNotes(t); if(!/^#\s/m.test(String(t||''))) n.title=NDOC[ndoc(k)].title; if(fn(n)===false) return false; return serializeNotes(n); }, msg, ndocInit(k));
function noteOp(label, fn, msg, k='notes'){ k=ndoc(k); enqueue(label, ()=>{ if(S[k]) fn(S[k]); }, ()=>notesFile(fn, `dashboard: ${NDOC[k].log}${msg}`, k)); }
const findCat = (n, name) => n.cats.find(c=>c.name===name);
const findNote = (n, ref) => { const c=findCat(n, ref.cat); if(!c) return null; const i=c.items.findIndex(x=>x.text===ref.text); return i<0?null:{c, i, it:c.items[i]}; };
// 区分の既定：中身がすべてチェック無しなら、足すものもチェック無し（「重要」のような決まりごとの区分）
const catPlain = c => c.items.length>0 && c.items.every(x=>x.check===null);
function notesOpenCount(){ return S.notes ? S.notes.cats.reduce((a,c)=>a+c.items.filter(x=>x.check===false).length,0) : 0; }

function addNote(cat, text, check, k='notes', body=''){
  noteOp('追加しました', n=>{ const c=findCat(n,cat); if(!c) return false; c.items.push({text, body:noteBody(body), check: check?false:null}); }, `「${cat}」に「${text.slice(0,30)}」を追加`, k);
}
function toggleNote(ref){
  // 押したときに見えていた状態（ref.chk）の反対にそろえる。ほかの端末で先に同じにされていたら何もしない（前は反転していたので、打ち消し合っていた）
  noteOp('', n=>{ const f=findNote(n,ref); if(!f || f.it.check===null) return false; f.it.check = typeof ref.chk==='boolean' ? !ref.chk : !f.it.check; }, `「${ref.text.slice(0,30)}」を${ref.chk?'未対応に戻す':'対応済みにする'}`, ref.doc);
}
function updateNote(ref, patch){
  noteOp('更新しました', n=>{
    const f=findNote(n,ref); if(!f) return false;
    f.it.text=patch.text;
    if(patch.body!==undefined) f.it.body=noteBody(patch.body);
    f.it.check = patch.kind==='plain' ? null : (f.it.check===null ? false : f.it.check);
    if(patch.cat && patch.cat!==ref.cat){ const to=findCat(n,patch.cat); if(!to) return false; f.c.items.splice(f.i,1); to.items.push(f.it); }
  }, `「${patch.text.slice(0,30)}」を更新`, ref.doc);
}
function deleteNote(ref){ noteOp('削除しました', n=>{ const f=findNote(n,ref); if(!f) return false; f.c.items.splice(f.i,1); }, `「${ref.text.slice(0,30)}」を削除`, ref.doc); }
function clearChecked(cat, k='notes'){ noteOp('済みを消しました', n=>{ const c=findCat(n,cat); if(!c) return false; const before=c.items.length; c.items=c.items.filter(x=>x.check!==true); if(c.items.length===before) return false; }, `「${cat}」の済みを消す`, k); }
function badNoteCat(name, except, k='notes'){

function renameNoteCat(from, to, k='notes'){ noteOp('区分の名前を変えました', n=>{ const c=findCat(n,from); if(!c || findCat(n,to)) return false; c.name=to; }, `区分「${from}」を「${to}」に変更`, k); }
function deleteNoteCat(name, k='notes'){ noteOp('区分を削除しました', n=>{ const i=n.cats.findIndex(c=>c.name===name); if(i<0) return false; n.cats.splice(i,1); }, `区分「${name}」を削除`, k); }
// ドラッグでの並べ替え。入れる場所は「その直前に来る行（区分）」で覚えておき、保存の直前に読み直した最新のファイルでもその前に入れる
// （ほかの人が行を足していてもずれないように）。見つからなければ、画面で見ていたときの位置（index）に入れる
function moveNoteTo(from, toCat, toIndex, beforeText){
  noteOp(from.cat===toCat?'':`「${toCat}」へ移しました`, n=>{
    const c=findCat(n, from.cat), to=findCat(n, toCat); if(!c || !to) return false;
    const i=c.items.findIndex(x=>x.text===from.text); if(i<0) return false;
    const [it]=c.items.splice(i,1);
    let at = beforeText!=null ? to.items.findIndex(x=>x.text===beforeText) : to.items.length;
    if(at<0) at=Math.min(toIndex, to.items.length);
    to.items.splice(at,0,it);
  }, `「${from.text.slice(0,30)}」を${from.cat===toCat?'並べ替え':`「${toCat}」へ移す`}`, from.doc);
}
function moveNoteCatTo(name, toIndex, beforeName, k='notes'){
  noteOp('', n=>{
    const i=n.cats.findIndex(c=>c.name===name); if(i<0) return false;
    const [c]=n.cats.splice(i,1);
    let at = beforeName!=null ? n.cats.findIndex(x=>x.name===beforeName) : n.cats.length;
    if(at<0) at=Math.min(toIndex, n.cats.length);
    n.cats.splice(at,0,c);
  }, `区分「${name}」を並べ替え`, k);
}

// 表題の頭に ①②…、内容は全角の空白2つで下げて表題の文字の頭にそろえる。内容のある項目があるときは、項目の間を1行あける（LINE などに貼っても崩れにくいように）
const NOTE_NUM = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function noteCatText(c){
  const items=c.items.filter(x=>x.check!==true); if(!items.length) return '';
  const plain = t => String(t||'').replace(/\*\*(.+?)\*\*/g,'$1');
  const num = i => i<NOTE_NUM.length ? NOTE_NUM[i] : `(${i+1})`;
  const blocks = items.map((x,i)=>[`${num(i)}　${plain(x.text)}`, ...noteBodyLines(x.body).map(l=>`　　${plain(l)}`)].join('\n'));
  const gap = items.some(x=>noteBodyLines(x.body).length) ? '\n\n' : '\n';
  return `【${c.name}】${mdw(todayStr())}　${items.length}件\n\n${blocks.join(gap)}`;
}

// --- ルームの清掃 ---
// rooms.md: 表（ルーム・建物・次回清掃・前回清掃・間隔（日）・メモ）。日付は YYYY-MM-DD
function normDate(s){
  s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function parseRooms(text){
  const rows=[]; let hdr=null;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    if(!/^\s*\|/.test(line)) continue;
    const cells=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
    if(!hdr){ if(cells.some(x=>/ルーム|部屋/.test(x))) hdr=cells.map(x=>x.replace(/\s/g,'')); continue; }
    if(cells.every(x=>/^:?-{2,}:?$/.test(x)||x==='')) continue;
    const get=(...ks)=>{ const i=hdr.findIndex(h=>ks.some(k=>h.startsWith(k))); return i>=0?(cells[i]||''):''; };
    const name=get('ルーム','部屋'); if(!name) continue;
    rows.push({name, area:get('エリア','店舗','地域'), bldg:get('建物','備考'), next:normDate(get('次回')), last:normDate(get('前回')), every:parseInt(get('間隔'),10)||null, memo:get('メモ')});
  }
  return rows;
}
function serializeRooms(rows){
  const cell=v=>String(v??'').replace(/\|/g,'／').replace(/\s*\n\s*/g,' ').trim();
  return ROOMS_INIT + rows.map(r=>`| ${[r.name,r.area,r.bldg,r.next,r.last,r.every||'',r.memo].map(cell).join(' | ')} |`).join('\n') + (rows.length?'\n':'');
}
const roomsFile = (fn,msg) => mutateFile('rooms.md', t=>{ const r=parseRooms(t); if(fn(r)===false) return false; return serializeRooms(r); }, msg, ROOMS_INIT);
function roomOp(label, fn, msg){ enqueue(label, ()=>{ if(S.rooms) fn(S.rooms); }, ()=>roomsFile(fn, msg)); }
const findRoom = (rows, name) => rows.find(r=>r.name===name);
function roomState(r){
  const t=todayStr();
  if(!r.next) return {cls:'', label:'未定'};
  if(r.next<t){ const d=Math.round((new Date(t)-new Date(r.next))/864e5); return {cls: d>=3?'red':'amber', label:`${d}日過ぎ`}; }  // 赤は3日以上の遅れだけ（赤ばかりで本当に急ぐものが埋もれないように）
  if(r.next===t) return {cls:'amber', label:'今日'};
  const d=Math.round((new Date(r.next)-new Date(t))/864e5);
  return {cls: d<=3?'soon':'', label: d===1?'明日':`あと${d}日`};
}
function roomsDueCount(){ const t=todayStr(); return S.rooms ? S.rooms.filter(r=>r.next && r.next<=t).length : 0; }
function cleanedRoom(name, next, every){
  const t=todayStr(), before=findRoom(S.rooms||[], name), prev = before ? {last:before.last, next:before.next, every:before.every} : null;
  const nx = next!==undefined ? next : (before && (every!==undefined?every:before.every) ? addDays(t, every!==undefined?every:before.every) : before && before.next);
  if(prev) setTimeout(()=>toast(`${name} を清掃済みにしました${nx?`（次回 ${mdw(nx)}）`:''}`, false, {undo:()=>roomOp('元に戻しました', rows=>{ const r=findRoom(rows,name); if(!r) return false; Object.assign(r, prev); }, `dashboard: ${name} の清掃済みを元に戻す`)}), 0);
  roomOp('', rows=>{ const r=findRoom(rows,name); if(!r) return false; r.last=t; if(every!==undefined) r.every=every; r.next = next!==undefined ? next : (r.every ? addDays(t, r.every) : r.next); }, `dashboard: ${name} を清掃済みにする`);
}
function saveRoom(orig, v){
  roomOp(orig?'更新しました':'追加しました', rows=>{
    if(orig){ const r=findRoom(rows,orig); if(!r) return false; if(v.name!==orig && findRoom(rows,v.name)) return false; Object.assign(r, v); }
    else { if(findRoom(rows,v.name)) return false; rows.push(v); }
  }, orig?`dashboard: ルーム ${v.name} を更新`:`dashboard: ルーム ${v.name} を追加`);
}
function deleteRoom(name){ roomOp('削除しました', rows=>{ const i=rows.findIndex(r=>r.name===name); if(i<0) return false; rows.splice(i,1); }, `dashboard: ルーム ${name} を削除`); }

  return `<div class="rsum"><span class="${over?'red':''}">期限切れ ${over}</span><span class="${today?'amber':''}">今日 ${today}</span><span>3日以内 ${soon}</span><span>全 ${rows.length}室</span></div>

    <div class="hint" style="margin-top:8px">次回清掃が近い順に並びます。「清掃した」を押すと、前回清掃が今日になり、次回清掃が間隔のぶん先に進みます（間隔が無いときは次回の日を聞きます）。ルームを押すと編集できます。</div>`;
}

async function pwCall(action, payload={}){
  if(S.be && S.be.kind==='demo' && !pwConf().url){  // デモ（接続先が未設定のとき）：画面の中だけで動かす
    if(!pwDemo) pwDemo=[
      {ID:'d1','区分':'媒体','サービス':'見本の媒体（管理画面）','ログインURL':'https://example.com/login','ID・メール':'shop@example.com','パスワード':'sample-Pass-123','メモ':'二段階認証は店のスマホ','更新日':todayStr()},

    if(action==='add'){ const r={...payload.row, ID:'d'+Date.now(), '更新日':todayStr()}; pwDemo.push(r); return {ok:true, row:r}; }

    if(action==='delete'){ pwDemo=pwDemo.filter(x=>x.ID!==payload.id); return {ok:true}; }
  }
  const {url,key}=pwConf();
  if(!url||!key) throw new Error('パスワード表の接続先と鍵が設定されていません（設定画面）');
  // text/plain で送ると、Apps Script へ事前確認なしで届く
  const r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow'});

// ===== クーポン（アンケートのくじの当選。正本はアンケートのスプレッドシートの「当選者一覧」） =====
// 読み書きは、アンケートの Apps Script（salon-os の survey/gas/Code.gs）の窓口（coupon.search / coupon.use / coupon.unuse）を通して行う。GitHub には一切書かない。
// 窓口の URL はお客様に送っているアンケートの URL と同じなので、鍵が無いと誰でも当選者を見たり利用済みにしたりできてしまう。だから鍵を付ける。
// 接続先の URL と鍵は、この端末のブラウザにだけ保存する。お客様の名前などは端末に残さない（開いている間だけ持つ）。
const cpConf = () => ({url:safeGet(LS.cpUrl)||'', key:safeGet(LS.cpKey)||''});
const cpOn = () => S.be && (S.be.kind==='demo' || !!cpConf().url);
// all：開いたときに窓口から1回読んだ全件（新しい順）。探すのは手元で行い、打つたびにすぐ絞り込む（窓口へは聞きに行かない）
// partial：窓口が古い版で全件を返さなかったとき（50件まで）。そのときだけ、文字を入れたら窓口に探しに行く
const CP = {all:null, at:0, partial:false, q:'', loading:false, error:'', busy:{}, seq:0, sq:'', sItems:null, sTimer:0};
const CP_STALE_MS = 3*60*1000;  // 開き直したとき、これより古ければ裏で読み直す

    {row:5, drawn:d(-40)+' 19:49', visit:d(-40), therapist:'見本ゆら', name:'ミナミ', num:'7191', prize:'1,000円OFF', code:'IZ8BVY', note:'電話で確認済み', usedAt:'', colored:true},
  ];

// 期限：抽選日の1ヶ月後の同じ日まで（窓口の couponExpires_ と同じ）
function cpExpires(drawn){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(drawn||''); if(!m) return ''; const day=+m[3]; const d=new Date(+m[1], +m[2]-1+1, day); if(d.getDate()!==day) d.setDate(0); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function cpDemoItem(r){
  const t=todayStr(), expires=cpExpires(r.drawn), used=!!r.usedAt||r.colored;
  const status = used ? 'used' : (expires && t>expires ? 'expired' : 'valid');
  return {...r, expires, status, daysLeft: status==='valid' ? Math.round((new Date(expires+'T00:00:00')-new Date(t+'T00:00:00'))/86400000) : null};
}
const cpNorm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
async function cpCall(action, payload={}){
  if(S.be && S.be.kind==='demo' && !cpConf().url){
    if(!cpDemo) cpDemo=cpDemoRows();
    await new Promise(r=>setTimeout(r,200));
    if(action==='coupon.search'){ const q=cpNorm(payload.q); return {ok:true, items:cpDemo.filter(r=>!q||[r.code,r.num,r.name,r.therapist].some(x=>cpNorm(x).includes(q))).map(cpDemoItem)}; }
    const r=cpDemo.find(x=>x.row===payload.row && x.code===payload.code); if(!r) return {ok:false, error:'当選者一覧が変わっています。探し直してください'};
    if(action==='coupon.use'){ r.usedAt=todayStr(); r.colored=true; } else { r.usedAt=''; r.colored=false; }
    return {ok:true, item:cpDemoItem(r)};
  }
  const {url,key}=cpConf();
  if(!url||!key) throw new Error('クーポンの接続先と鍵が設定されていません（設定画面）');
  // text/plain で送ると、Apps Script へ事前確認なしで届く
  const r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow'});
  if(!r.ok) throw new Error(`アンケートの窓口に接続できませんでした（${r.status}）`);
  const j=await r.json().catch(()=>{ throw new Error('アンケートの窓口の返事を読めませんでした（URL が正しいか、窓口を足した版が公開されているか確かめてください）'); });
  if(!j.ok) throw new Error(j.error||'アンケートの窓口でエラーが出ました');
  return j;
}
async function cpLoad(){
  const my=++CP.seq; const had=cpFocused(); CP.loading=true; CP.error=''; render(); if(had) cpRefocus();
  try{ const j=await cpCall('coupon.search',{q:'', all:true}); if(my!==CP.seq) return; CP.all=j.items||[]; CP.partial=!!j.more; CP.at=Date.now(); CP.sItems=null; CP.sq=''; }
  catch(e){ if(my===CP.seq){ CP.error=e.message; if(!CP.all) CP.all=[]; } }
  if(my===CP.seq){ const had2=cpFocused(); CP.loading=false; render(); if(had2) cpRefocus(); }
}
// 窓口が全件を返さなかったときだけ使う：文字を入れて少し待ったら窓口で探す
function cpRemoteSearch(q){
  clearTimeout(CP.sTimer);
  CP.sTimer=setTimeout(async ()=>{ CP.sq=q; try{ const j=await cpCall('coupon.search',{q}); if(CP.q.trim()===q){ const had=cpFocused(); CP.sItems=j.items||[]; render(); if(had) cpRefocus(); } }catch(e){ toast(e.message,true); } }, 400);
}
const cpMatch = (it, q) => [it.code, it.num, it.name, it.therapist].some(x=>cpNorm(x).includes(q));
// 今の検索の文字で絞った一覧（文字が空なら新しい順に50件）
function cpShown(){
  const q=cpNorm(CP.q);
  if(!q) return {list:(CP.all||[]).slice(0,50), total:(CP.all||[]).length, q:''};
  if(CP.partial){ if(CP.sq!==CP.q.trim()) cpRemoteSearch(CP.q.trim()); return {list:CP.sItems||[], total:null, q, remote:true}; }
  const hit=(CP.all||[]).filter(it=>cpMatch(it,q));

async function sqLoad(){

    const j=await sqCall({offset:0, limit:SQ_PAGE}); if(my!==SQ.seq) return;
    SQ.items=j.items||[]; SQ.total=j.total||0; SQ.more=!!j.more; SQ.next=j.next||0; SQ.at=Date.now();
    if(SQ.more){
      // 最初の分を先に出し、残りは並べて読む（新しい順を保ってつなげる）
      const offs=[]; for(let o=SQ.next; o<SQ.total; o+=SQ_PAGE) offs.push(o);
      SQ.rest=Math.max(0, SQ.total-SQ.items.length); had=sqFocused(); render(); if(had) sqRefocus(null, had);
      const pages=await Promise.all(offs.map(o=>sqCall({offset:o, limit:SQ_PAGE}).catch(e=>({err:e}))));
      if(my!==SQ.seq) return;
      let bad=null;
      for(const pg of pages){ if(pg.err){ bad=pg.err; break; } SQ.items=SQ.items.concat(pg.items||[]); SQ.next=pg.next||SQ.next; }
      SQ.more = !!bad || SQ.next<SQ.total;   // 読めなかった分は「もっと古い回答を読み込む」で続きから読める
      if(bad) toast(bad.message,true);
    }
  }
  catch(e){ if(my===SQ.seq){ SQ.error=e.message; if(!SQ.items) SQ.items=[]; } }
  if(my===SQ.seq){ SQ.rest=0; had=sqFocused(); SQ.loading=false; render(); if(had) sqRefocus(null, had); }
}

      <div class="cprow1"><b>${esc(it.therapist||'—')}</b><span class="sqmeta">${esc(cpMd(it.at))}${it.at&&it.at.length>10?' '+esc(it.at.slice(11)):''}</span><span class="sp"></span>${it.manzoku?`<span class="sqrate ${tone}">満足度 ${esc(it.manzoku)}</span>`:''}</div>
      <div class="sqmeta">${esc(it.name||'名前なし')}${it.num?`（${esc(it.num)}）`:''}${it.visit?`・来店 ${esc(cpMd(it.visit))}`:''}${it.source?`・${esc(it.source)}`:''}</div>
      <div class="sqrates">${SQ_RATE.filter(([k])=>it[k]).map(([k,l])=>`<span class="sqrate ${sqTone(it[k])}">${l} ${esc(it[k])}</span>`).join('')}</div>
      ${it.comment?`<div class="sqtext">${esc(it.comment)}</div>`:''}
      ${it.other?`<div class="sqtext sqother">その他：${esc(it.other)}</div>`:''}
      ${it.lot&&it.lot!=='ハズレ'?`<div class="sqmeta">くじ：${esc(it.lot)}${it.code?`（${esc(it.code)}）`:''}</div>`:''}
    </div>`; }).join('');
  const more = !first && SQ.more ? `<div style="text-align:center;margin-top:12px"><button class="btn sm" data-act="sq-more" ${SQ.loadingMore?'disabled':''}>${SQ.loadingMore?'読み込んでいます…':`もっと古い回答を読み込む（${SQ_PAGE}件）`}</button></div>` : '';
  return `${top}${bar}<div class="cpinfo">${info}${fresh}</div>${SQ.error?`<div class="bkcard" style="color:var(--red)">${esc(SQ.error)}</div>`:''}
    <div class="cplist">${cards || (first||SQ.error?'':`<div class="empty">条件に合う回答はありません ${filtered?'<button type="button" class="btn sm" data-act="sq-reset">絞り込みを解く</button>':''}</div>`)}</div>${more}
    <div class="hint" style="margin-top:12px">アンケートのスプレッドシートの「フォーム回答」を、新しい順に読むだけです（書き換えません）。セラピストの欄（集計と共通）・言葉の欄・評価の低いものだけ は、読み込んだ分の中から絞り込みます。言葉の欄は、お客様名・番号・感想・その他のご意見・何をみて・当選番号を探します。開いたときに全部の回答を読み込みます（最初の1000件を先に出し、残りは裏で読みます）。</div>`;
}

// ===== アンケートの集計（良い・普通・悪いの割合のグラフ。読み込んだ回答から、この端末の中で数える。書き換えない） =====
// 良い＝とても良い・良い（総合満足度は とても満足・満足）、悪い＝悪い・とても悪い。期間は来店日（無ければ回答日）で数える
const SQ_ITEMS = [['manzoku','総合満足度'],['aikyo','愛嬌'],['omotenashi','おもてなし'],['sejutsu','施術']];
const SQ_LV5 = ['とても良い','良い','普通','悪い','とても悪い'];
const SQ_LVN = {manzoku:['とても満足','満足','普通','悪い','とても悪い']};
const SQ_LVC = ['sv-g2','sv-g1','sv-mid','sv-r1','sv-r2'];
const SQ_YN = [['honshimei','本指名の可能性','あり','なし'],['doki','ドキドキ感','ドキドキした','ドキドキしない'],['sofa','ソファ施術','あり','なし']];
const SQ_PERS = [['30','直近30日'],['90','直近90日'],['365','直近1年'],['all','すべて']];
function sqLv(v){ v=String(v||'').trim(); return /とても(良い|満足)/.test(v)?0 : /とても(悪い|不満)/.test(v)?4 : /^(良い|満足)$/.test(v)?1 : /普通/.test(v)?2 : /悪い|不満/.test(v)?3 : -1; }
const sqDay = it => String(it.visit||it.at||'').slice(0,10);
const sqPct = (a,n) => n ? Math.round(a*100/n) : 0;
function sqBase(){ const l=SQ.items||[]; return SQ.ther ? l.filter(it=>it.therapist===SQ.ther) : l; }
// back=1 で、ひとつ前の同じ長さの期間（前と比べるため）
function sqInPer(list, back=0){
  if(SQ.per==='all') return back ? [] : list;
  const d=+SQ.per, a=addDays(todayStr(), -(d*(back+1)-1)), b=addDays(todayStr(), -d*back);
  return list.filter(it=>{ const x=sqDay(it); return x>=a && x<=b; });
}
function sqCount(list, k='manzoku'){ const c=[0,0,0,0,0]; for(const it of list){ const l=sqLv(it[k]); if(l>=0) c[l]++; } const n=c[0]+c[1]+c[2]+c[3]+c[4]; return {c, n, good:c[0]+c[1], mid:c[2], bad:c[3]+c[4]}; }
// 円のグラフ：良い（緑）・普通（灰）・悪い（赤）。間を少しあけ、真ん中に良いの割合
function sqDonut(s){
  const R=50, C=2*Math.PI*R, parts=[['良い',s.good,'g2'],['普通',s.mid,'mid'],['悪い',s.bad,'r2']].filter(p=>p[1]>0), gap=parts.length>1?2.5:0;
  let off=0;
  const segs=parts.map(([l,v,cl])=>{ const len=C*v/s.n, d=Math.max(0.6,len-gap);
    const el=`<circle class="sqd ${cl}" cx="60" cy="60" r="${R}" stroke-dasharray="${d.toFixed(2)} ${(C-d).toFixed(2)}" stroke-dashoffset="${(-(off+gap/2)).toFixed(2)}" data-tip="${l} ${v}件（${sqPct(v,s.n)}%）"/>`; off+=len; return el; }).join('');
  return `<div class="sqdonut"><svg viewBox="0 0 120 120" role="img" aria-label="良い ${sqPct(s.good,s.n)}%・普通 ${sqPct(s.mid,s.n)}%・悪い ${sqPct(s.bad,s.n)}%">${s.n?'':`<circle class="sqd track" cx="60" cy="60" r="${R}"/>`}<g transform="rotate(-90 60 60)">${segs}</g></svg>
    <div class="sqdc"><b>${s.n?sqPct(s.good,s.n):'—'}${s.n?'<small>%</small>':''}</b><span>良い</span></div></div>`;
}
// 横の帯：数の割合で塗り分ける（間は2pxあけ、両端は丸める）。parts は [数, 色, 吹き出し]
function sqBar(parts, n){
  if(!n) return '<div class="sqbar empty"></div>';
  return `<div class="sqbar">${parts.filter(p=>p[0]>0).map(([v,cl,tip])=>`<span class="${cl}" style="flex:${v} 1 0" data-tip="${esc(tip)}"></span>`).join('')}</div>`;
}
function sqItemRow(k, label, list){
  const s=sqCount(list,k), names=SQ_LVN[k]||SQ_LV5;
  return `<div class="sqirow"><span class="sqil">${esc(label)}</span>${sqBar(s.c.map((v,i)=>[v, SQ_LVC[i], `${label}：${names[i]} ${v}件（${sqPct(v,s.n)}%）`]), s.n)}<span class="sqiv">${s.n?`良い <b>${sqPct(s.good,s.n)}%</b><i>悪い ${sqPct(s.bad,s.n)}%</i>`:'<i>回答なし</i>'}</span></div>`;
}
function sqYnRow([k, label, yes, no], list){
  let y=0, n=0; for(const it of list){ const v=String(it[k]||'').trim(); if(v!==yes && v!==no) continue; n++; if(v===yes) y++; }
  return `<div class="sqirow"><span class="sqil">${esc(label)}</span>${sqBar([[y,'sv-g2',`${label}：${yes} ${y}件（${sqPct(y,n)}%）`],[n-y,'sv-mid',`${label}：${no} ${n-y}件（${sqPct(n-y,n)}%）`]], n)}<span class="sqiv">${n?`${esc(yes)} <b>${sqPct(y,n)}%</b>`:'<i>回答なし</i>'}</span></div>`;
}
// 月ごと：直近12か月（最初に回答があった月から）。下から良い・普通・悪いを積み、上に良いの割合
function sqMonths(list){
  const t=todayStr(), ms=[]; let y=+t.slice(0,4), m=+t.slice(5,7);
  for(let i=0;i<12;i++){ ms.unshift(`${y}-${String(m).padStart(2,'0')}`); if(--m<1){ m=12; y--; } }
  const by={};
  for(const it of list){ const mo=sqDay(it).slice(0,7), l=sqLv(it.manzoku); if(l<0 || !ms.includes(mo)) continue; const b=by[mo]||(by[mo]={good:0,mid:0,bad:0}); if(l<2) b.good++; else if(l===2) b.mid++; else b.bad++; }
  const first=ms.findIndex(mo=>by[mo]); if(first<0) return '<div class="empty">直近12か月の回答はありません</div>';
  const rows=ms.slice(first).map(mo=>({mo, ...(by[mo]||{good:0,mid:0,bad:0})}));
  const max=Math.max(1, ...rows.map(r=>r.good+r.mid+r.bad)), h=v=>`height:max(3px, calc(${(v/max*100).toFixed(1)}% - 2px))`;
  return `<div class="sqcols">${rows.map(r=>{ const n=r.good+r.mid+r.bad, mo=+r.mo.slice(5);
    return `<div class="sqcol" data-tip="${r.mo.slice(0,4)}年${mo}月：良い ${r.good}・普通 ${r.mid}・悪い ${r.bad}${n?`（良い ${sqPct(r.good,n)}%）`:''}"><div class="sqcolv">${n?sqPct(r.good,n)+'%':''}</div><div class="sqcolbar">${r.bad?`<span class="sv-r2" style="${h(r.bad)}"></span>`:''}${r.mid?`<span class="sv-mid" style="${h(r.mid)}"></span>`:''}${r.good?`<span class="sv-g2" style="${h(r.good)}"></span>`:''}</div><div class="sqcoll">${mo}月</div></div>`; }).join('')}</div>`;
}
// セラピストごと：押すとその人だけの集計にする。割合で並べるときは、3件未満の人を下に回す（数が少ないと割合がぶれるため）
function sqTherRows(list){
  const by={};
  for(const it of list){ const t=it.therapist, l=sqLv(it.manzoku); if(!t || l<0) continue; const b=by[t]||(by[t]={t,good:0,mid:0,bad:0,n:0}); b.n++; if(l<2) b.good++; else if(l===2) b.mid++; else b.bad++; }
  const few=r=>r.n<3?1:0, rows=Object.values(by);
  rows.sort(SQ.tsort==='good' ? (a,b)=>few(a)-few(b) || b.good/b.n-a.good/a.n || b.n-a.n
          : SQ.tsort==='bad' ? (a,b)=>few(a)-few(b) || b.bad/b.n-a.bad/a.n || b.bad-a.bad || b.n-a.n
          : (a,b)=>b.n-a.n || a.t.localeCompare(b.t,'ja'));
  if(!rows.length) return '<div class="empty">この期間の回答はありません</div>';
  return `<div class="sqtrows">${rows.map(r=>`<button type="button" class="sqtrow ${few(r)?'few':''}" data-act="sq-pick" data-v="${esc(r.t)}" title="${esc(r.t)}さんだけの集計にする">
      <span class="sqtn">${esc(r.t)}</span>${sqBar([[r.good,'sv-g2',`${r.t}：良い ${r.good}件（${sqPct(r.good,r.n)}%）`],[r.mid,'sv-mid',`${r.t}：普通 ${r.mid}件（${sqPct(r.mid,r.n)}%）`],[r.bad,'sv-r2',`${r.t}：悪い ${r.bad}件（${sqPct(r.bad,r.n)}%）`]], r.n)}
      <span class="sqtv">${sqPct(r.good,r.n)}%</span><span class="sqtc">${r.bad?`悪い ${r.bad}・`:''}${r.n}件</span></button>`).join('')}</div>`;
}
function viewSurveyStats(head, tm){
  const items=SQ.items||[];
  const bar=`<div class="pwbar sqsbar"><div class="vseg sm" role="group" aria-label="期間">${SQ_PERS.map(([k,l])=>`<button type="button" class="${SQ.per===k?'on':''}" data-act="sq-per" data-v="${k}" aria-pressed="${SQ.per===k}">${l}</button>`).join('')}</div>
    <button type="button" class="iconbtn ${SQ.loading?'spin':''}" data-act="sq-reload" title="アンケートの窓口から読み直す" aria-label="読み直す" ${SQ.loading?'disabled':''}>${icon('refresh')}</button></div>`;
  if(SQ.items===null || (SQ.loading && !items.length)) return head+bar+'<div class="cpinfo">アンケートの窓口から読んでいます…（初回だけ数秒かかります）</div>';
  const base=sqBase(), cur=sqInPer(base), s=sqCount(cur), perL=(SQ_PERS.find(p=>p[0]===SQ.per)||SQ_PERS[1])[1];
  const prev = SQ.per==='all' ? null : sqCount(sqInPer(base,1));
  const dp = prev && prev.n && s.n ? sqPct(s.good,s.n)-sqPct(prev.good,prev.n) : null;
  const delta = dp===null ? '' : `<div class="sqdelta ${dp>0?'up':dp<0?'down':''}">${dp>0?'▲':dp<0?'▼':'±'}${Math.abs(dp)}ポイント<span>その前の${perL.replace('直近','')}（良い ${sqPct(prev.good,prev.n)}%・${prev.n}件）とくらべて</span></div>`;
  const who = SQ.ther ? `${esc(SQ.ther)}さん` : '全員';
  const leg = (l,sub,v,cl) => `<div class="sqlrow"><i class="sqdot ${cl}"></i><span class="lb">${l}<small>${sub}</small></span><b>${sqPct(v,s.n)}<small>%</small></b><span class="sqln">${v}件</span></div>`;
  const hero = `<section class="sqbox sqhero wide">${sqDonut(s)}<div class="sqleg">
      <div class="sqlegt">${who}・${perL}の総合満足度（${s.n}件）</div>
      ${s.n ? leg('良い','とても満足・満足',s.good,'sv-g2')+leg('普通','',s.mid,'sv-mid')+leg('悪い','悪い・とても悪い',s.bad,'sv-r2') : '<div class="empty" style="text-align:left;padding:6px 0">この期間の回答はありません</div>'}
      ${delta}
      ${s.bad||s.mid?`<div><button type="button" class="btn sm" data-act="sq-lowlist">評価の低い回答を読む</button></div>`:''}
    </div></section>`;
  const lg = `<div class="sqlg">${SQ_LV5.map((l,i)=>`<span><i class="${SQ_LVC[i]}"></i>${l}</span>`).join('')}</div>`;
  const itemsBox = `<section class="sqbox"><h3>項目ごと<small>${perL}</small></h3>${lg}${SQ_ITEMS.map(([k,l])=>sqItemRow(k,l,cur)).join('')}
      <div class="sqsub">あり・なしの割合</div>${SQ_YN.map(y=>sqYnRow(y,cur)).join('')}</section>`;
  const monthBox = `<section class="sqbox"><h3>月ごとの移り変わり<small>直近12か月・総合満足度</small></h3>${sqMonths(base)}
      <div class="sqlg" style="margin:10px 0 0"><span><i class="sv-g2"></i>良い</span><span><i class="sv-mid"></i>普通</span><span><i class="sv-r2"></i>悪い</span><span>上の数字は良いの割合</span></div></section>`;
  const therBox = SQ.ther
    ? `<section class="sqbox wide"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="hint" style="margin:0">${who}だけの集計です。</span><button type="button" class="btn sm" data-act="sq-tclear">全員の集計に戻す</button></div></section>`
    : `<section class="sqbox wide"><h3>セラピストごと<small>${perL}・総合満足度${tm?`・「${esc(SQ.tq)}」に合う人だけ`:''}</small><span class="sp"></span><span class="vseg sm">${[['n','件数順'],['good','良いが多い順'],['bad','悪いが多い順']].map(([k,l])=>`<button type="button" class="${SQ.tsort===k?'on':''}" data-act="sq-tsort" data-v="${k}">${l}</button>`).join('')}</span></h3>${sqTherRows(tm ? cur.filter(it=>tm.includes(it.therapist)) : cur)}</section>`;
  const info = `<div class="cpinfo">${SQ.error?'':`読み込んだ回答 ${items.length}件から数えています${SQ.rest?'（残りを読み込んでいます。数はまだ増えます）':items.length<SQ.total?`（全部で${SQ.total}件のうち）`:''}`}<span class="cpat">${SQ.at?`${new Date(SQ.at).toTimeString().slice(0,5)} に読み込み`:''}</span></div>`;
  return head+bar+info+(SQ.error?`<div class="bkcard" style="color:var(--red);margin-bottom:10px">${esc(SQ.error)}</div>`:'')
    +`<div class="sqgrid">${hero}${itemsBox}${monthBox}${therBox}</div>
    <div class="hint" style="margin-top:12px">読み込んだ回答を、この端末の中で数えているだけです（スプレッドシートは書き換えません）。良い＝とても良い・良い（総合満足度は とても満足・満足）、悪い＝悪い・とても悪い です。期間は来店日で数えます。月ごとのグラフは、期間に関係なく直近12か月です。グラフに指やマウスを乗せると、件数が出ます。上のセラピストの欄（回答と共通）に名前の一部を打つと、合う人が1人ならその人だけの集計になり、何人かいれば候補が出ます。セラピストの行を押しても、その人だけの集計になります（3件未満の人は、割合がぶれやすいので薄く出します）。</div>`;
}
// グラフの吹き出し：data-tip を付けた所にマウスを乗せる・指で触ると出る
let tipEl=null, tipFor=null;
function tipShow(el, x, y){ if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='vtip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); } tipEl.textContent=el.dataset.tip; tipEl.style.display='block'; tipFor=el; tipMove(x,y); }
function tipMove(x, y){ if(!tipEl) return; const w=tipEl.offsetWidth, h=tipEl.offsetHeight; let l=x-w/2, t=y-h-14; l=Math.max(8, Math.min(innerWidth-w-8, l)); if(t<8) t=y+18; tipEl.style.left=l+'px'; tipEl.style.top=t+'px'; }
function tipHide(){ if(tipEl) tipEl.style.display='none'; tipFor=null; }
document.addEventListener('pointerover', e=>{ const el=e.target.closest ? e.target.closest('[data-tip]') : null; if(el) tipShow(el, e.clientX, e.clientY); else if(tipFor) tipHide(); });
document.addEventListener('pointermove', e=>{ if(tipFor && e.pointerType==='mouse'){ if(!tipFor.isConnected) tipHide(); else tipMove(e.clientX, e.clientY); } });
document.addEventListener('scroll', ()=>{ if(tipFor) tipHide(); }, true);

// ===== ご案内状況（受付台帳の「最短」シートの A〜D 列。正本は受付台帳。受付システムが随時書き換える） =====
// クーポンと同じ窓口・同じ鍵（guide.status）。読むだけ。開いている間は30秒ごとに読み直し、ほかのアプリから戻ったときもすぐ読み直す
const GD = {blocks:null, at:0, srvAt:'', loading:false, error:'', seq:0, timer:0};
const GD_EVERY_MS = 30*1000;
let gdDemo = null;
async function gdCall(){
  if(S.be && S.be.kind==='demo' && !cpConf().url){
    await new Promise(r=>setTimeout(r,200));
    if(!gdDemo) gdDemo=[{area:'北千住', head:['セラピスト','時間'], rows:[['見本そら','最短'],['見本りあ','最短'],['見本ゆうな','13:30'],['見本てん','13:40'],['見本つむぎ','14:00'],['見本きく','14:20']]},{area:'柏', head:['セラピスト','時間'], rows:[['見本えみ','最短'],['見本りの','13:20'],['見本える','14:00'],['見本えな','完売🈵']]}];
    return {ok:true, blocks:gdDemo, at:todayStr()+' '+new Date().toTimeString().slice(0,5)};
  }
  return cpCall('guide.status', {});
}
async function gdLoad(){
  const my=++GD.seq; GD.loading=true; GD.error=''; if(S.tab==='guide' && !S.modal) render();
  try{ const j=await gdCall(); if(my!==GD.seq) return; GD.blocks=j.blocks||[]; GD.at=Date.now(); GD.srvAt=j.at||''; }
  catch(e){ if(my===GD.seq){ GD.error=e.message; GD.failAt=Date.now(); } }  // 失敗したときも30秒あけて読み直す（前は5秒ごとに窓口を呼び続けていた）
  if(my===GD.seq){ GD.loading=false; if(S.tab==='guide' && !S.modal) render(); }
}
// 開いている間だけ読み直す（ほかの画面・裏にいるときは読まない）
function gdTick(){ if(S.tab==='guide' && document.visibilityState==='visible' && !GD.loading && Date.now()-Math.max(GD.at, GD.failAt||0)>=GD_EVERY_MS-500) gdLoad(); }
setInterval(gdTick, 5000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.tab==='guide' && !GD.loading) gdLoad(); });
// 時間の書き方で色を分ける：最短（すぐ案内できる）は緑、完売・満は赤、それ以外（13:30 など）はふつう
const gdTone = t => /最短/.test(t) ? 'now' : /完売|満|🈵|×|休/.test(t) ? 'full' : '';
function viewGuide(){
  if(!cpOn()) return `<div class="bkcard"><b>窓口につながっていません</b><div class="hint" style="margin-top:6px">クーポンと同じ窓口を使います。設定画面の「クーポン（アンケートの当選）」に URL と鍵を入れると使えます。</div><div style="margin-top:10px"><button class="btn sm pri" data-act="settings">設定画面を開く</button></div></div>`;
  if(GD.blocks===null && !GD.loading && !GD.error) setTimeout(()=>{ if(GD.blocks===null && !GD.loading) gdLoad(); },0);
  const bar = `<div class="gdbar"><span class="gdat">${GD.loading&&!GD.blocks?'受付台帳から読んでいます…':GD.at?`${new Date(GD.at).toTimeString().slice(0,5)} に読み込み（30秒ごとに自動で読み直し）`:''}</span><span class="sp"></span><button type="button" class="btn gdre ${GD.loading?'spin':''}" data-act="gd-reload" ${GD.loading?'disabled':''}>${icon('refresh')}今すぐ更新</button></div>`;

const BOK_DEMO = {};

async function bokCall(action, payload={}, timeoutMs=45000){

    const fn=BOK_DEMO[action]; if(!fn) throw new Error('デモには、この機能の見本がありません');
    await new Promise(r=>setTimeout(r,450));
    j=fn(clone(payload));
  } else {
    const {url,key}=rvConf();
    if(!url||!key) throw new Error('BOK の接続先と鍵が設定されていません（設定画面の「BOK（ささやき）につなぐ」）');
    // text/plain で送ると、Apps Script へ事前確認なしで届く。BOK の窓口は数秒かかるので、待つのは timeoutMs まで
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(), timeoutMs);

    catch(e){ throw new Error(e.name==='AbortError' ? 'BOK からの返事に時間がかかりすぎました。少し待ってからもう一度試してください。' : 'BOK につながりませんでした。通信を確かめて、もう一度試してください。'); }
    finally{ clearTimeout(t); }
    if(!r.ok) throw new Error(`BOK につながりませんでした（${r.status}）`);
    j=await r.json().catch(()=>{ throw new Error('BOK の返事を読めませんでした（設定の URL が正しいか確かめてください）'); });
  }

function mtSave(){

    const prev=l.status; Object.assign(l, j.log||{status});

      if(typeof d.openCount==='number') d.openCount=Math.max(0,d.openCount+dop);
    }
    himeSetCount({unconfirmedCount:d.unconfirmedCount});

// 一覧をまるごと保存する画面（お知らせ・アンケート）と、1件ずつの画面で共通：保存して、ずれていたら読み直す
// 返り値：保存できたら true（2026-11-28。書く窓が、成功したときだけ閉じられるように）。保存中にもう一度呼ばれたら、黙って捨てずに知らせる
async function bkSave(k, action, payload, apply, msg){
  const s=bk(k); if(s.saving){ bkSave.err='前の保存がまだ終わっていません。終わってからもう一度押してください'; toast(bkSave.err,true); return false; }
  s.saving=true; render();
  try{ const j=await bokCall(action, payload); if(apply) apply(j); toast(msg); s.saving=false; render(); return true; }
  catch(e){
    bkSave.err=e.message; toast(e.message,true); s.saving=false;
    if(/先に変更|変わって|ずれて|読み直/.test(e.message)){ bkSave.err=e.message+'（最新を読み直しました。内容を確かめて、もう一度「BOK に保存」を押してください）'; await BK_LOAD[k](); return false; }
    render(); return false;
  }
}

async function bkModalSave(m, run){
  m.saving=true; m.error=''; S.modal=m; render();
  const ok=await run();
  m.saving=false;
  if(ok){ if(S.modal===m) S.modal=null; }
  else if(!S.modal || S.modal===m){ S.modal=m; m.error=bkSave.err||'保存できませんでした'; }
  render();
}

const SI = {pick:{}, mark:true, edit:{}, editing:{}, fails:{}, sending:false, prog:null};

  for(const r of Object.keys(SI.fails)) if(!(d.items||[]).some(it=>String(it.row)===r)) delete SI.fails[r];
});
function siPlan(){

function siSendConfirm(){

    html:`<p>Telegram：<b>${tg.length}件</b>${tg.length?`（${tg.map(nm).join('、')}）`:''}</p>

    run:()=>siSend(plan)});

async function siSend(plan){
  const d=bk('surveyImport').data; if(!d || SI.sending) return;
  SI.sending=true; SI.prog={done:0, total:plan.length, lines:[]}; render();
  const nm=x=>esc(x.it.matchedName||x.it.rawName||'（名前なし）');
  for(let i=0;i<plan.length;i+=20){  // 1回20件まで（BOK の決まり）
    const chunk=plan.slice(i,i+20);
    const items=chunk.map(x=>({row:x.it.row, rowKey:x.it.rowKey??x.it.key, text:String(SI.edit[x.it.row]??x.it.text), toTelegram:x.tg, toApp:x.app, matchedName:x.it.matchedName||''}));
    let res;
    try{ res=(await bokCall('surveyImport.sendMany',{items, markSent:SI.mark}, 180000)).results||[]; }
    catch(e){
      for(const x of chunk){ SI.fails[x.it.row]=`送れたかどうか分かりません（${e.message}）。「更新」で一覧を取り直して確かめてください。`; SI.prog.lines.push(`<span class="warn">？</span> ${nm(x)}：分かりません`); }
      SI.prog.done+=chunk.length; render(); break;
    }
    chunk.forEach((x,k)=>{
      const r=res.find(y=>Number(y.row)===Number(x.it.row)) || res[k] || {ok:false, error:'返事がありませんでした'};
      if(r.ok){
        delete SI.fails[x.it.row];
        SI.prog.lines.push(`<span style="color:var(--green)">✓</span> ${nm(x)}（${esc((r.done||[]).join('・'))}）`);
        if(SI.mark){ d.items=(d.items||[]).filter(it=>it.row!==x.it.row); if(typeof d.total==='number') d.total=Math.max(0,d.total-1); }
        else if(SI.pick[x.it.row]) SI.pick[x.it.row]={tg:false, app:false};  // 色を塗らないときは一覧に残るので、二重に送らないようチェックを外す
      } else if(SI_ALREADY.test(r.error||'')){  // ほかの人がもう送った回答（BOK が色を見て止めた）。一覧から外す
        delete SI.fails[x.it.row];
        SI.prog.lines.push(`<span style="color:var(--sub)">－</span> ${nm(x)}：もう送ってあります（ほかの人が送ったようです）`);
        d.items=(d.items||[]).filter(it=>it.row!==x.it.row); if(typeof d.total==='number') d.total=Math.max(0,d.total-1);
      } else {
        let err=r.error||'送れませんでした';
        // 途中で失敗しても、BOK はできたところまでを done で返す（v7.99）。済んだ送り先はチェックを外して、二重に送らないようにする
        const done=r.done||[], pk=SI.pick[x.it.row];
        if(done.length){ err+=`（${done.join('・')} は済んでいます。もう一度送るときは、済んだ分のチェックは外したままにしてください）`;
          if(pk){ if(done.includes('Telegram')) pk.tg=false; if(done.includes('アプリ')) pk.app=false; } }
        SI.fails[x.it.row]=err;
        SI.prog.lines.push(`<span class="warn">×</span> ${nm(x)}：${esc(err)}`);
      }
    });
    SI.prog.done+=chunk.length; render();
  }
  SI.sending=false; render();
  const bad=Object.keys(SI.fails).length; toast(bad?`送り終わりました（送れなかったもの ${bad}件）`:'送り終わりました', !!bad);
}

    for(const f of Object.keys(fields)) if(ST_FIELDS.includes(f)) ST.dr[f]=String(d[f]??'');
    if('rooms' in fields) ST.rooms=splitList(d.rooms);
    if('telegramToken' in fields){ ST.tokEdit=false; ST.dr.telegramToken=''; }

async function stLogoPick(file){
  try{
    const url=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    for(const size of [512,400,320,256,200,160,128,96]) for(const [type,q] of [['image/png'],['image/jpeg',0.88],['image/jpeg',0.72]]){
      const sc=Math.min(1,size/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      const g=c.getContext('2d'); if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); } g.drawImage(img,0,0,c.width,c.height);
      const out=c.toDataURL(type,q); if(out.length<=44000){ ST.logoNew=out; render(); return; }
    }
    toast('画像を小さくしきれませんでした。もう少し軽い画像を選んでください',true);
  }catch(e){ toast('画像を読めませんでした',true); }
}

// 読み書きは、セラピストDB の Apps Script（salon-os の roster/gas）に足した入口 ActionOS.gs（doPost）を通す。中身は今のセラピストDB の画面と同じ処理（api_*）なので、
// ロック・「先に誰かが保存しています」の確認・入力のチェック・変更履歴・保存のあとの反映（受付・シフト収集・特徴DB・BOK）は今の画面とまったく同じ（salon-os#7）。
// GitHub には一切書かない。名簿・特徴・受け入れNG の中身（本名・PIN・電話番号など）は端末に保存しない（開いている間だけ持つ）。URL と鍵だけ、この端末のブラウザに保存する。
// 保存・登録・元に戻す・今すぐ反映は、4か所への反映が終わるまで返事が来ない（数十秒）ので90秒まで待つ。
// 時間切れ・通信の失敗のときは送り直さない（保存は済んでいることがある）。読み直して、確かめてから入れ直してもらう。
const rdConf = () => ({url:safeGet(LS.rdUrl)||'', key:safeGet(LS.rdKey)||''});
const rdDemo = () => !!(S.be && S.be.kind==='demo' && !rdConf().url);
const rdOn = () => !!(S.be && (S.be.kind==='demo' || rdConf().url));
const RD_LONG = 90*1000;
const RD_DEMO = {};
async function rdCall(action, payload={}, timeoutMs=45000){
  let j;
  if(rdDemo()){
    const fn=RD_DEMO[action]; if(!fn) throw new Error('デモには、この機能の見本がありません');
    await new Promise(r=>setTimeout(r, timeoutMs>45000?1500:400));
    j=fn(clone(payload));
  } else {
    const {url,key}=rdConf();
    if(!url||!key) throw new Error('セラピストDB の接続先と鍵が設定されていません（設定画面の「セラピストDB につなぐ」）');
    // 届いたかどうか分からない失敗（時間切れ・通信・返事が読めない）。書く操作では送り直さない
    const lost = msg => { const e=new Error(msg); e.unknown=true; return e; };
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(), timeoutMs);
    let r;
    try{ r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow', signal:ac.signal}); }
    catch(e){ throw lost(e.name==='AbortError' ? 'セラピストDB からの返事が、時間内に来ませんでした' : 'セラピストDB につながりませんでした（通信を確かめてください）'); }
    finally{ clearTimeout(t); }
    if(!r.ok) throw lost(`セラピストDB から正しい返事が来ませんでした（${r.status}）`);
    try{ j=await r.json(); }catch{ throw lost('セラピストDB の返事を読めませんでした（設定の URL が正しいか確かめてください）'); }
  }
  if(!j || !j.ok){
    const msg=(j&&j.error)||'セラピストDB でエラーが出ました';
    const e=new Error(msg==='鍵が違います' ? '鍵が違います。設定画面の「セラピストDB につなぐ」の鍵を確かめてください' : msg);
    e.res=j; e.conflict=!!(j&&j.conflict); throw e;
  }
  return j;
}

  m.cast.fields.forEach(f=>{ const g=f.internal?'':(f.group||''), it=!!f.internal; let x=gs.find(y=>y.g===g && y.it===it); if(!x) gs.push(x={g, it, fs:[]}); x.fs.push(f); });

  return gs.map(x=>`<section class="rdsec${x.it?' int':''}"><h3>${x.it?'社外秘（社内メモ）':esc(x.g||'特徴')}</h3><div class="rdgrid">${x.fs.map(f=>`<div class="field${f.type==='textarea'||f.type==='multi'?' wide':''}"><label>${esc(f.name)}</label>${rdCastInput(f, m, dis)}</div>`).join('')}</div></section>`).join('');
}
function rdAddTag(el){
  const m=S.modal; if(!m || !m.cast) return false;
  const name=el.dataset.rdtag, v=el.value.replace(/[,、\n]/g,' ').trim(); el.value='';
  const f=m.cast.fields.find(x=>x.name===name); if(!v || !f) return false;
  const ex=m.cextra[name]||(m.cextra[name]=[]); if(!f.options.includes(v) && !ex.includes(v)) ex.push(v);
  const k='c:'+name, sel=Array.isArray(m.draft[k])?m.draft[k]:[]; if(!sel.includes(v)) m.draft[k]=[...sel, v];
  return true;
}

// ----- 名簿・受け入れNG の詳細（入力の画面）。まず手元の一覧の値で見せて入力は止め、最新の値と変更履歴を読んで描き直す -----
function rdFill(m, r, cast){
  m.row=r||{}; m.draft={}; m.dateText={}; m.init={};
  const groups = m.type==='rdng' ? RD_NG_GROUPS : RD_GROUPS;
  groups.forEach(g=>g.f.forEach(([k,,type])=>{ let v=m.row[k]; if(k==='st' && !v) v=RD.ng.st[0]; m.draft[k]=rdInVal(type, k, v, m); }));
  groups.forEach(g=>g.f.forEach(([k,,type])=>{ m.init[k]=rdOutVal(type, k, m.draft[k], m); }));
  rdFillCast(m, cast);
}
// 特徴の欄だけを入れ直す（名簿の欄に入れかけた内容は消さない）
function rdFillCast(m, cast){
  m.castInfo=cast||null; m.cast = cast && cast.fields ? cast : null; m.cextra={}; m.cinit={};
  Object.keys(m.draft).filter(k=>k.startsWith('c:')).forEach(k=>delete m.draft[k]);
  if(m.cast) m.cast.fields.forEach(f=>{
    const raw=m.cast.row[f.name];
    if(f.type==='multi') m.cextra[f.name]=rdSplit(raw).filter(x=>!f.options.includes(x));
    m.draft['c:'+f.name]=rdCastIn(f, raw);
    m.cinit[f.name]=rdCastOut(f, m.draft['c:'+f.name], m);
  });
}
function rdOpen(id, pane){

  const m={type:'rdp', id, pane:pane||'cast', step:'edit', loading:true, saving:false, error:'', notice:'', showPin:false, hist:null};

function rdNew(){ const m={type:'rdp', id:'', step:'edit', loading:false, saving:false, error:'', notice:'', showPin:true, hist:null}; rdFill(m, {}, null); S.modal=m; render(); }
// 名簿の詳細：名簿の1行（detailRow）と、特徴・変更履歴（detailMore）を同時に頼み、名簿の1行が届いたらすぐ入力できるようにする。
// 特徴と変更履歴は届きしだい出す（それまでは「読み込んでいます」）。窓口が古い版（この2つを知らない）なら、前のやり方（detail をまとめて）に戻す
let rdSplitOk = true;
async function rdDetailSplit(m, gen){
  const r0=m.row||{}, ask=r=>rdCall('detailMore', {id:m.id, castId:String(r.castId||'').trim(), name:String(r.name||'').trim()}).catch(e=>({err:e}));
  m.moreLoading=true; m.hist=null; rdFillCast(m, null);
  let more=ask(r0), d;
  try{ d=await rdCall('detailRow', {id:m.id}); }
  catch(e){
    if(/知らない操作/.test(e.message||'')){ rdSplitOk=false; m.moreLoading=false; return false; }
    if(S.modal===m){ m.loading=false; m.moreLoading=false; m.loadErr=`最新の内容を読めませんでした。閉じて開き直してください（${e.message}）`; render(); }
    return true;
  }
  if(S.modal!==m || gen!==RD.gen) return true;
  if(RD.rows) RD.rows=RD.rows.map(x=>x.id===m.id?d.row:x);
  rdFill(m, d.row, null); m.moreLoading=true; m.loading=false; m.showPin=false; m.snap0=undefined; render();
  // 一覧の特徴DB の ID・名前が古かったときは、最新の値で読み直す（読むだけ）
  if(String(d.row.castId||'').trim()!==String(r0.castId||'').trim() || String(d.row.name||'').trim()!==String(r0.name||'').trim()) more=ask(d.row);
  const x=await more;
  if(S.modal!==m || gen!==RD.gen) return true;
  // 特徴が届く前に名簿の欄を直していたら、閉じるときの「入れかけの内容があります」の確認が効くように、直した印を残す
  const dirty=modalDirty();
  m.moreLoading=false;
  if(x.err){ rdFillCast(m, {error:x.err.message}); m.hist=[]; m.histErr=x.err.message; }
  else { rdFillCast(m, x.cast); m.hist=x.hist||[]; m.histErr=''; }
  m.snap0 = dirty ? '直しかけ' : undefined; render();
  return true;
}
async function rdDetail(m, notice){
  m.loading=true; m.loadErr=''; if(notice!==undefined) m.notice=notice;
  if(S.modal===m) render();

  if(m.type==='rdp' && rdSplitOk && m.id && await rdDetailSplit(m, gen)) return;
  try{
    const d=await rdCall(m.type==='rdng'?'ngDetail':'detail', {id:m.id});
    if(S.modal!==m || gen!==RD.gen) return;
    if(m.type==='rdng'){ if(RD.ng.rows) RD.ng.rows=RD.ng.rows.map(x=>x.id===m.id?d.row:x); rdFill(m, d.row, null); }
    else { if(RD.rows) RD.rows=RD.rows.map(x=>x.id===m.id?d.row:x); rdFill(m, d.row, d.cast); }
    m.hist=d.hist||[]; m.loading=false; m.showPin=false;
  }catch(e){
    if(S.modal!==m) return;
    m.loading=false; m.loadErr=`最新の内容を読めませんでした。閉じて開き直してください（${e.message}）`;
  }
  m.snap0=undefined; render();
}
function rdHistHtml(m){
  if(!m.hist) return m.loading||m.moreLoading ? '<div class="hint">読み込んでいます…</div>' : '';
  if(m.histErr) return `<div class="rderr">変更履歴を読めませんでした（${esc(m.histErr)}）。閉じて開き直してください</div>`;

// 確かめる画面での見せ方（送る値 → 人が読む形。例：3000 → 3,000 円、1 → ★★★ 高）
function rdDisp(type, k, v, ph0){
  v=String(v??''); if(v==='') return '';
  if(type==='pick'){ const o=(RD_PICK[k]||[]).find(x=>x[0]===v); return o ? o[1] : v; }
  if(type==='pri') return RD_PRI[v] ? `${'★'.repeat(rdStarN(v))} ${RD_PRI[v]}` : v;
  if(type==='send') return '送らない';
  if(type==='bool') return String(ph0||'しない|する').split('|')[1];
  if(type==='yen' && /^-?\d+$/.test(v)) return Number(v).toLocaleString('ja-JP')+'円';
  if(type==='min') return v+'分';
  return v;
}
// 変えた欄（送るもの）と、確かめる画面に出す「前 → 後」
function rdChanges(m){
  const ch={}, cch={}, lines=[], isNew=!m.id, ng=m.type==='rdng';
  (ng?RD_NG_GROUPS:RD_GROUPS).forEach(g=>g.f.forEach(([k,label,type,ph0])=>{
    if(isNew && !ng && k==='status') return;   // 新しく入った人は名前だけ（在籍はセラピストDB が「在籍」にする）
    const out=rdOutVal(type, k, m.draft[k], m), dsp=v=>rdDisp(type, k, v, ph0);
    if(isNew){ ch[k]=out; if(out!=='') lines.push([label,'',dsp(out)]); }
    else if((m.init[k]||'')!==out){ ch[k]=out; lines.push([label, dsp(m.init[k]||''), dsp(out)]); }
  }));
  if(m.cast) m.cast.fields.forEach(f=>{ const out=rdCastOut(f, m.draft['c:'+f.name], m); if((m.cinit[f.name]||'')!==out){ cch[f.name]=out; lines.push(['特徴：'+f.name, m.cinit[f.name]||'', out]); } });
  return {ch, cch, lines};
}
function rdSubmit(){
  const m=S.modal; if(!m || !/^rd(p|ng)$/.test(m.type) || m.saving || m.loading || m.loadErr || m.step!=='edit') return;

}

async function rdGo(){
  const m=S.modal; if(!m || m.step!=='confirm' || m.saving) return;
  const {ch, cch, lines}=m.pending, isNew=!m.id, ng=m.type==='rdng';
  m.saving=true; m.rdBusy=true; m.error=''; render();

  const back = html => { m.saving=false; m.rdBusy=false; m.step='edit'; rdDetail(m, html); };
  try{
    if(ng){
      if(isNew){ const j=await rdCall('ngCreate', {data:ch}, RD_LONG); rdDone(m); rdToast(`${j.id} で受け入れNG に登録しました`); }
      else { const j=await rdCall('ngSave', {id:m.id, changes:ch, upd:m.row.upd}, RD_LONG); rdDone(m); rdToast(j.nochange?'変更はありません':'保存しました'); }
      RD.ng.stale=true; rdNgLoad(); return;
    }
    if(isNew){ const j=await rdCall('create', {data:ch}, RD_LONG); if(j.sync && !j.sync.busy) RD.sync=j.sync; rdDone(m); rdToast(`${j.id} で登録しました${rdSyncMsg(j.sync)}`, rdSyncBad(j.sync)); rdAfterWrite(); return; }
    if(Object.keys(cch).length){ await rdCall('castSave', {castId:m.cast.castId, changes:cch, upd:m.cast.upd}, RD_LONG); castDone=true; }
    if(Object.keys(ch).length){ const j=await rdCall('save', {id:m.id, changes:ch, upd:m.row.upd}, RD_LONG); if(j.sync && !j.sync.busy) RD.sync=j.sync; rdDone(m); rdToast(j.nochange?'変更はありません':`保存しました${rdSyncMsg(j.sync)}`, rdSyncBad(j.sync)); }
    else { rdDone(m); rdToast('特徴を保存しました'); }
    rdAfterWrite();
  }catch(e){
    const pre = castDone ? '特徴は保存しました。名簿は、' : '';
    if(e.unknown && isNew){   // 登録できたか分からない：送り直さず、一覧を読み直して確かめてもらう
      m.saving=false; m.rdBusy=false; rdDone(m);
      const nm=String(ng?ch.honmei:ch.name||'');
      const msg=`<b>登録できたかどうか分かりません</b>（${esc(e.message)}）。一覧を読み直しました。「${esc(nm)}」が入っていないか確かめて、入っていなければ登録し直してください。`;
      if(ng){ RD.ng.q=nm; RD.ng.dob=''; RD.ng.tel=''; RD.ng.fst=''; RD.ng.notice=msg; rdNgLoad(); }
      else { RD.q=nm; RD.fst=''; RD.fpri=''; RD.blank=false; RD.notice=msg; rdAfterWrite(); }

// ----- 成績表 PDF の取り込み（元のセラピストDB の「成績の取り込み」と同じ読み方。PDF は画面の中で読み、読み取った7項目だけを窓口に送る） -----
// 報酬総額・本名などは読まない・送らない。PDF も端末に残さない
const RD_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let rdPdfjsReady = null;
function rdLoadPdfjs(){
  if(rdPdfjsReady) return rdPdfjsReady;
  rdPdfjsReady = new Promise((resolve, reject)=>{
    const sc=document.createElement('script'); sc.src=RD_PDFJS+'pdf.min.js';
    sc.onload = async ()=>{ try{ const src=await (await fetch(RD_PDFJS+'pdf.worker.min.js')).text(); window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([src],{type:'text/javascript'})); resolve(window.pdfjsLib); }catch(e){ rdPdfjsReady=null; reject(new Error('PDF の読み取り部品を読み込めませんでした（通信を確かめてください）')); } };
    sc.onerror = ()=>{ rdPdfjsReady=null; reject(new Error('PDF の読み取り部品を読み込めませんでした（通信を確かめてください）')); };
    document.head.appendChild(sc);
  });
  return rdPdfjsReady;
}
// 成績表の1行：名前 出勤日数 本指名数 フリー本数 総数 本指名率% 姫予約 報酬総額 …（担当内勤・本名は読まない）
const RD_STATS_ROW = /^(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+(?:\.\d+)?%)\s+(\d+)\s+[\d,]+/;
// NFKC で普通の漢字に戻らない部首用の文字（PDF に「⻘空」「⺒山」などで出てくる）と、NFKC だと旧い字体になるもの
const RD_RADICALS = {'⺒':'巳','⻘':'青','⻄':'西','⻑':'長','⺟':'母','⻆':'角','⻝':'食','⻤':'鬼','⻩':'黄','⻨':'麦','⻭':'歯','⻯':'竜','⻲':'亀','⻁':'虎','⻌':'辶'};
const RD_KANGXI = {'⿊':'黒','⾭':'青','⿈':'黄','⿆':'麦','⿒':'歯','⿔':'亀','⼾':'戸','⿑':'斉'};
const rdFixChars = t => t.replace(/[⼀-⿟]/g, c=>RD_KANGXI[c]||c).normalize('NFKC').replace(/[⺀-⻿]/g, c=>RD_RADICALS[c]||c);
async function rdReadStatsPdf(buf){
  const pdfjs=await rdLoadPdfjs(), doc=await pdfjs.getDocument({data:buf}).promise, lines=[];
  for(let i=1;i<=doc.numPages;i++){
    const items=(await (await doc.getPage(i)).getTextContent()).items.filter(it=>it.str && it.str.trim()), rows=[];
    items.forEach(it=>{ const y=it.transform[5], x=it.transform[4]; let row=rows.find(r0=>Math.abs(r0.y-y)<=2); if(!row) rows.push(row={y, parts:[]}); row.parts.push({x, w:it.width||0, h:it.height||8, s:it.str}); });
    rows.sort((a,b)=>b.y-a.y).forEach(r0=>{ let line='', end=null; r0.parts.sort((a,b)=>a.x-b.x).forEach(p=>{ if(end!==null && p.x-end>Math.max(2, p.h*0.3)) line+=' '; line+=p.s; end=p.x+p.w; }); lines.push(line); });
  }
  const text=lines.map(l=>rdFixChars(l).replace(/\s+/g,' ').trim()), out=[], skipped=[];
  text.forEach(l=>{ if(!l || /^セラピスト\s*名/.test(l) || /月\s*度/.test(l)) return; const m=RD_STATS_ROW.exec(l); if(!m){ skipped.push(l); return; } out.push({名前:m[1].trim(), 出勤日数:+m[2], 本指名数:+m[3], フリー本数:+m[4], 総数:+m[5], 本指名率:m[6], 姫予約:+m[7]}); });
  const mm=/(\d{4})\s*年\s*(\d{1,2})\s*月\s*度/.exec(text.join(' '));
  return {rows:out, skipped, month: mm ? `${mm[1]}-${mm[2].padStart(2,'0')}` : ''};
}
// 先月（日本時間）。成績表はふつう先月分を取り込む
function rdLastMonth(){ const [y,m]=todayStr().split('-').map(Number); return m===1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`; }
const rdMonthFromName = name => { const m=/(\d{4})\s*年\s*(\d{1,2})\s*月/.exec(name) || /(\d{4})[.\-_](\d{1,2})/.exec(name); return m ? `${m[1]}-${m[2].padStart(2,'0')}` : ''; };
const rdMonthLabel = mo => { const m=/^(\d{4})-(\d{2})$/.exec(mo||''); return m ? `${m[1]}年${+m[2]}月` : mo; };
function rdPdfOpen(){ S.modal={type:'rdpdf', month:rdLastMonth(), reading:false, saving:false, pdf:null, error:'', done:''}; render(); }
async function rdPdfRead(file){

}
async function rdPdfSave(){
  const m=S.modal; if(!m || m.type!=='rdpdf' || !m.pdf || !m.pdf.rows.length || m.saving) return;

const rdNgStrong = m => m.includes('電話番号') || (m.includes('生年月日') && m.length>=2);   // 電話が全部同じ、または生年月日と名前が同じ

// ===== 備品の補充（supplies.md） =====
// 「## チェック項目」の表に、品目ごとの目安（至急・補充必要・補充の必要無）を持つ。
// 「## ルーム名」ごとに、点検した日（点検: YYYY-MM-DD）と、補充が要るものをチェック付きの箇条書きで持つ（例：- [ ] お茶【至急】）。
// 足りているものは書かない。ファイルがあるときだけタブを出す。
// 在庫切れで注文しているものは、未補充の行の後ろに【注文中】を付ける（例：- [ ] パイプユニッシュ【至急】【注文中】）。ルームの行ごとに付け外しする。補充したら外す
const SUP_INIT = '# 備品の補充\n\n## チェック項目\n\n| 品目 | 至急 | 補充必要 | 補充の必要無 | ピン |\n|---|---|---|---|---|\n';
const SUP_LV = {urgent:{tag:'至急', cls:'red'}, need:{tag:'補充', cls:'amber'}};
function supItemOf(t){
  let s=String(t), level='need', qty=1, order=false;
  const od=s.match(/【\s*注文中\s*】/); if(od){ order=true; s=s.replace(od[0],''); }
  const lv=s.match(/【\s*(至急|補充|補充必要)\s*】/); if(lv){ level = lv[1]==='至急'?'urgent':'need'; s=s.replace(lv[0],''); }
  const q=s.match(/\s*[×xX＊*]\s*(\d+)\s*$/); if(q){ qty=+q[1]; s=s.slice(0,q.index); }
  return {name:s.trim(), level, qty, order};
}
function parseSupplies(text){
  const d={items:[], rooms:[]}; let cur=null, inItems=false;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    const h=line.match(/^##\s+(.+?)\s*$/);
    if(h){ inItems = /^チェック項目$/.test(h[1]); cur = inItems ? null : {room:h[1], checked:'', items:[]}; if(cur) d.rooms.push(cur); continue; }
    if(inItems){
      if(!/^\s*\|/.test(line)) continue;
      const c=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
      if(c[0]==='品目' || c.every(x=>/^:?-{2,}:?$/.test(x)||x==='')) continue;
      if(c[0]) d.items.push({name:c[0], urgent:c[1]||'', need:c[2]||'', ok:c[3]||'', pin:/★|☆|1|ピン|○|〇/.test(c[4]||'')});
      continue;
    }
    if(!cur || !line.trim()) continue;
    const ck=line.match(/^\s*点検\s*[:：]\s*(\d{4}-\d{2}-\d{2})/); if(ck){ cur.checked=ck[1]; continue; }
    const m=line.match(/^\s*[-*] (?:\[( |x|X)\]\s?)?(.*)$/); if(!m) continue;
    const it=supItemOf(m[2]); if(!it.name) continue;
    cur.items.push({...it, done: m[1]!==undefined && m[1]!==' '});
  }
  return d;
}
function serializeSupplies(d){
  const cell=v=>String(v??'').replace(/\|/g,'／').replace(/\s*\n\s*/g,' ').trim();
  let out=SUP_INIT;
  for(const it of d.items) out+=`| ${[it.name,it.urgent,it.need,it.ok,it.pin?'★':''].map(cell).join(' | ')} |\n`;
  for(const r of d.rooms){
    if(!r.items.length && !r.checked) continue;
    out+=`\n## ${r.room}\n\n`;
    if(r.checked) out+=`点検: ${r.checked}\n\n`;
    for(const it of r.items) out+=`- [${it.done?'x':' '}] ${it.name}【${SUP_LV[it.level].tag}】${it.order&&!it.done?'【注文中】':''}${it.qty>1?` ×${it.qty}`:''}\n`;
  }
  return out;
}
const suppliesFile = (fn,msg) => mutateFile('supplies.md', t=>{ const d=parseSupplies(t); if(fn(d)===false) return false; return serializeSupplies(d); }, msg, SUP_INIT);
function supOp(label, fn, msg){ enqueue(label, ()=>{ if(S.supplies) fn(S.supplies); }, ()=>suppliesFile(fn, msg)); }
const supRoom = (d, room) => d.rooms.find(r=>r.room===room);
const supFind = (d, ref) => { const r=supRoom(d, ref.room); if(!r) return null; const i=r.items.findIndex(x=>x.name===ref.name && !!x.done===!!ref.done); return i<0?null:{r, i, it:r.items[i]}; };
const supOpen = r => r.items.filter(x=>!x.done);
function supOpenCount(){ return S.supplies ? S.supplies.rooms.reduce((a,r)=>a+supOpen(r).length,0) : 0; }
function supRoomCount(room){ const r=S.supplies && supRoom(S.supplies, room); return r ? supOpen(r).length : 0; }
// ルームの並び：清掃の表の順（エリアごと）。補充リストにだけあるルームは後ろ
function supRoomNames(){ return [...new Set([...(S.rooms||[]).map(r=>r.name), ...(S.supplies?S.supplies.rooms.map(r=>r.room):[])])]; }
const roomArea = n => ((S.rooms||[]).find(x=>x.name===n)||{}).area || '';

// 点検の結果を書く：選んだ品目は「至急／補充」にし、「足りている」にした品目の未補充の行は消す。点検した日も書く
function saveInspection(room, picks){
  const day=todayStr();
  supOp('点検の結果を保存しました', d=>{
    let r=supRoom(d, room); if(!r){ r={room, checked:'', items:[]}; d.rooms.push(r); }
    for(const [name, lv] of Object.entries(picks)){
      const open=r.items.find(x=>x.name===name && !x.done);
      if(lv==='ok'){ if(open) r.items.splice(r.items.indexOf(open),1); }
      else if(open) open.level=lv;
      else r.items.push({name, level:lv, qty:1, done:false, order:false});
    }
    r.checked=day;
  }, `dashboard: ${room} の備品を点検`);
}
function addSupply(room, name, level){
  supOp('補充リストに足しました', d=>{
    let r=supRoom(d, room); if(!r){ r={room, checked:'', items:[]}; d.rooms.push(r); }
    const open=r.items.find(x=>x.name===name && !x.done);
    if(open) open.level=level; else r.items.push({name, level, qty:1, done:false, order:false});
  }, `dashboard: ${room} に「${name}」の補充を追加`);
}
// 補充済みにしたら【注文中】も外す（届いて補充できたので）
function toggleSupply(ref){ supOp('', d=>{ const f=supFind(d,ref); if(!f) return false; f.it.done=!f.it.done; if(f.it.done) f.it.order=false; }, `dashboard: ${ref.room} の「${ref.name}」を${ref.done?'未補充に戻す':'補充済みにする'}`); }
function delSupply(ref){ supOp('消しました', d=>{ const f=supFind(d,ref); if(!f) return false; f.r.items.splice(f.i,1); }, `dashboard: ${ref.room} の「${ref.name}」を消す`); }
// 「全部補充した」：注文中のものは届いていないので残す（注文中だけ残っているときはボタンを出さない）
function roomSupplyDone(room){ supOp('このルームの補充を済みにしました', d=>{ const r=supRoom(d,room); if(!r || !supOpen(r).some(x=>!x.order)) return false; r.items.forEach(x=>{ if(!x.order) x.done=true; }); }, `dashboard: ${room} の補充をすべて済みにする${supOpen(supRoom(S.supplies,room)||{items:[]}).some(x=>x.order)?'（注文中のものは残す）':''}`); }
// 注文中の付け外し：ルームの1行ごと

// ===== 補充：いまルームに入っているセラピスト（受付システムの「ルーム割当」と出勤の時間。アンケートの窓口 room.now で読むだけ） =====
// 補充の画面を開いたときに読み（2分より前に読んだ分は読み直す）、開いている間は5分ごとに読み直す。名前は端末に保存しない（開いている間だけ持つ）
// 入っている＝出勤の開始の30分前（入室）から、終了の30分後（退出）まで（受付の「ルーム表」と同じ）。時間は受付と同じ書き方（深夜は 26:00 など）
// 施術中＝受付ログの予約の開始から終了まで（終了は延長込み）。窓口が予約を読めないとき（jobs が無い）は、施術中・待機中の印を出さない
// 受付終了（done。早退などで受付システムが「受付終了」にした人）：施術中か、このあと予約が残っている間だけルームにいる扱い。残りが無ければ帰ったものとして「いる人」から外す（2026-11-28 社長：早退した人が待機中と出ていた）
const RN = {rows:null, biz:'', jobs:false, at:0, tried:0, loading:false, error:'', seq:0};
const RN_EVERY_MS = 5*60*1000, RN_STALE_MS = 2*60*1000;
const rnBiz = hhmm => { const m=/^(\d{1,2}):(\d{2})$/.exec(String(hhmm||'').trim()); if(!m) return -1; let t=(+m[1])*60+(+m[2]); if(+m[1]<10) t+=1440; return t; };  // 受付と同じ：10時より前は前の日の深夜
const rnHm = t => t<0 ? '' : `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const rnAbs = (d,t) => new Date(d+'T00:00:00+09:00').getTime() + t*60000;
const rnKey = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').toUpperCase();
const rnJst = ms => { const j=new Date(ms+9*3600000); return `${j.getUTCFullYear()}-${String(j.getUTCMonth()+1).padStart(2,'0')}-${String(j.getUTCDate()).padStart(2,'0')}`; };
// 見本（?demo で接続先が未設定のとき）：いまの時刻から作る
function rnDemoRows(){
  const now=Date.now(), biz=rnJst(now-8*3600000), names=(S.rooms||[]).map(r=>r.name);
  const base=rnAbs(biz,0), cm=Math.round((now-base)/60000/30)*30;   // 営業日の0時からの分（30分刻み）
  const job=(s,e)=>({start:rnHm(s), end:rnHm(e)});
  const at=(i,s,e,name,jobs=[])=>names[i] ? [{date:biz, name, room:names[i], start:rnHm(s), end:rnHm(e), status:'', noShift:false, jobs}] : [];
  return {biz, jobs:true, rows:[
    ...at(0, cm-120, cm+240, '見本みく', [job(cm-90, cm-10), job(cm-30, cm+60)]), ...at(0, cm+300, cm+540, '見本さや'),
    ...at(1, cm+120, cm+420, '見本れん', [job(cm+150, cm+240)]),
    ...(names[2]?[{date:biz, name:'見本ゆら', room:names[2], start:'', end:'', status:'完売', noShift:false, jobs:[job(cm-60, cm+30)]}]:[]),
    ...at(3, cm-300, cm-60, '見本えみ'),
    ...at(4, cm-10, cm+600, '見本りの', [job(cm+40, cm+120)]),
    ...(names[5]?[{date:biz, name:'見本ゆずき', room:names[5], start:rnHm(cm-360), end:rnHm(cm+60), status:'満枠', noShift:false, done:true, jobs:[job(cm-300, cm-200)]}]:[]),
  ]};
}

async function rnLoad(){

  try{ const j=await rnCall(); if(my!==RN.seq) return; RN.rows=j.rows||[]; RN.biz=j.biz||''; RN.jobs=!!j.jobs; RN.at=Date.now(); RN.error=''; }

const rnWant = () => cpOn() && !!S.supplies && !RN.loading && Date.now()-RN.tried >= RN_STALE_MS;
setInterval(()=>{ if(S.tab==='supplies' && document.visibilityState==='visible' && cpOn() && !RN.loading && Date.now()-RN.tried>=RN_EVERY_MS-500) rnLoad(); }, 30000);

// ルームごと：いま入っている人（cur）・このあと入る人（next。今の営業日だけ）・時間が分からない人（unknown。完売・出勤の行が無いなど）
// 予約（施術）：いま施術中の予約（job）と、このあと最初の予約（nextJob）。予約を読めていないときは付けない
function rnJob(r, now){
  if(!RN.jobs || !Array.isArray(r.jobs)) return {};
  let job=null, nextJob=null;
  for(const j of r.jobs){
    const s=rnBiz(j.start); let e=rnBiz(j.end); if(s<0 || e<0) continue; if(e<s) e+=1440;
    const a=rnAbs(r.date,s), b=rnAbs(r.date,e);
    if(now>=a && now<b){ if(!job || b>job.b) job={s, e, a, b}; }
    else if(now<a && (!nextJob || a<nextJob.a)) nextJob={s, e, a, b};
  }
  return {job, nextJob, hasJobs:true};
}
function rnRoom(room){
  if(!RN.rows) return null;
  const k=rnKey(room), now=Date.now(), cur=[], later=[], unknown=[], left=[];
  for(const r0 of RN.rows){
    if(rnKey(r0.room)!==k) continue;
    const r={...r0, ...rnJob(r0, now)};
    if(r.done && !r.job && !r.nextJob){ if(r.date===RN.biz) left.push(r); continue; }  // 受付終了で、施術中でも予約が残ってもいない＝帰った
    const s=rnBiz(r.start); let e=rnBiz(r.end);
    if(s<0 || e<0){ if(r.date===RN.biz) unknown.push(r); continue; }
    if(e<s) e+=1440;
    const x={...r, s, e, a:rnAbs(r.date, s-30), b:rnAbs(r.date, e+30)};
    if(now>=x.a && now<=x.b) cur.push(x); else if(now<x.a && r.date===RN.biz) later.push(x);
  }
  cur.sort((x,y)=>x.a-y.a); later.sort((x,y)=>x.a-y.a);
  return {cur, next:later[0]||null, unknown, left};
}
// 表示：chip＝ルームのボタン（短く）／line＝ルームの見出し・点検の画面（時間も）
function rnWho(room, mode){
  const st=rnRoom(room); if(!st) return '';
  const tm=x=>`${rnHm(x.s)}〜${rnHm(x.e)}`, unk=x=>`${esc(x.name)}（時間不明${x.status?`・${esc(x.status)}`:''}）`;
  // 施術中・待機中の印（予約を読めたときだけ）
  const job=x=>!x.hasJobs ? '' : x.job ? `<span class="rnjob on" title="施術中（予約 ${rnHm(x.job.s)}〜${rnHm(x.job.e)}）"><s></s>施術中 〜${rnHm(x.job.e)}</span>` : `<span class="rnjob" title="いまは予約が入っていない時間">待機中${x.nextJob?`・次 ${rnHm(x.nextJob.s)}`:''}</span>`;
  if(mode==='chip'){
    // 名前と出勤の時間（開始〜終了）を1人ずつ。いまは空きなら、次に入る人
    const one=(x,cls)=>`<i class="supwho ${cls}"><b>${esc(x.name)}</b><em>${x.s!=null&&x.s>=0?tm(x):`時間不明${x.status?`・${esc(x.status)}`:''}`}</em>${job(x)}</i>`;
    if(st.cur.length) return st.cur.map(x=>one(x,'on')).join('');
    if(st.unknown.length) return st.unknown.map(x=>one(x,'unk')).join('');
    if(st.next) return `<i class="supwho"><b>空き</b><span>次：${esc(st.next.name)}</span><em>${tm(st.next)}</em></i>`;
    return `<i class="supwho"><b>空き</b></i>`;
  }
  // 1人1行。施術中・待機中の印はその行の右端に寄せる（2026-11-28 社長）。次に入る人は下の行
  const row=(left, right='', cls='')=>`<span class="rnrow ${cls}"><span class="rnp">${left}</span>${right}</span>`;
  const now = st.cur.length ? st.cur.map(x=>row(`いま：<b>${esc(x.name)}</b>（${tm(x)}）`, job(x))).join('') : st.unknown.length ? st.unknown.map(x=>row(`いま：<b>${unk(x)}</b>`, job(x))).join('') : row('いまは空き');
  const gone = st.left.map(x=>row(`${esc(x.name)}：受付終了（退勤）`,'','rnnext')).join('');
  return `<i class="supwho line ${st.cur.length?'on':st.unknown.length?'unk':''}">${now}${st.next?row(`次：${esc(st.next.name)}（${tm(st.next)}）`,'','rnnext'):''}${gone}</i>`;
}

// メニューの並び（端末ごとに覚える）。[['まとまりの名前',[画面…]], …]。覚えていなければ NAV_GROUPS のまま

function navLayout(){
  const def=NAV_GROUPS.map(([g,ks])=>[g,[...ks]]);
  let a=null; try{ a=JSON.parse(safeGet(LS.navLayout)||'null'); }catch{}
  if(!Array.isArray(a)) return def;
  const out=a.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&Array.isArray(x[1])).map(([g,ks])=>[g, ks.filter(k=>NAV_DEF[k])]);
  for(const [g] of def) if(!out.find(x=>x[0]===g)) out.push([g,[]]);
  const seen=new Set(); for(const x of out) x[1]=x[1].filter(k=>!seen.has(k) && seen.add(k));
  for(const [g,ks] of def) for(const k of ks) if(!seen.has(k)){ out.find(x=>x[0]===g)[1].push(k); seen.add(k); }
  return out;
}
// ▲▼で1つずつ動かす。まとまりの端を越えると、隣のまとまりへ移る（出ていない画面は飛ばす）
function navMove(k, dir){
  const L=navLayout(); const gi=L.findIndex(x=>x[1].includes(k)); if(gi<0) return;
  const ks=L[gi][1], i=ks.indexOf(k), vis=ks.filter(navAvail), vi=vis.indexOf(k);
  ks.splice(i,1);
  if(dir<0){
    if(vi>0){ ks.splice(ks.indexOf(vis[vi-1]),0,k); }
    else if(gi>0){ L[gi-1][1].push(k); }
    else { ks.unshift(k); }
  } else {
    if(vi>=0 && vi<vis.length-1){ ks.splice(ks.indexOf(vis[vi+1])+1,0,k); }
    else if(gi<L.length-1){ L[gi+1][1].unshift(k); }
    else { ks.push(k); }
  }
  safeSet(LS.navLayout, JSON.stringify(L)); render();
}

// ===== 描き直しても、打ちかけの文字・フォーカス・カーソルを保つ（2026-11-28） =====
// 画面はまるごと作り直すので、状態に写していない欄の文字・フォーカス・カーソルは、そのままだと消える（裏の読み直しや後読みで、打っている途中に起きていた）。
// 作り直す前に「描いたときの値（defaultValue）から変わっている欄」と「フォーカスのある欄」を覚え、作り直したあと、同じ欄の描いた値が前と同じなら
// （＝状態の側は変わっていない）打ちかけの値を戻す。状態の側が変わっていたら（保存した・読み直した）新しい値を使う。別窓の中は同じ窓のときだけ
const FOCUS_ATTRS = ['data-rvi','data-rvhi','data-bkf','data-rdq','data-rdtag','data-rdnum','data-pwq','data-cpq','data-sqq','data-sqtq','data-svq','data-supq','data-memoq','data-navq','data-setq','data-insq','data-stf','data-stroom','data-stradd','data-siedit','data-catname','data-newsub','data-mtmsg','data-rdpdfmonth'];
function inKey(el){
  if(!el || !el.matches || !el.matches('input,textarea')) return '';
  const pre = el.closest('.ov') ? '.ov ' : '#app ';
  for(const a of FOCUS_ATTRS) if(el.hasAttribute(a)){ const v=el.getAttribute(a); return pre+(v?`[${a}="${CSS.escape(v)}"]`:`[${a}]`); }
  const f=el.form || el.closest('form');
  if(f && f.dataset.act && el.name){ let k=`form[data-act="${f.dataset.act}"]`; for(const d of ['cat','doc','id','room']) if(f.dataset[d]!==undefined) k+=`[data-${d}="${CSS.escape(f.dataset[d])}"]`; return pre+k+` [name="${CSS.escape(el.name)}"]`; }
  return '';
}
const isChk = el => el.type==='checkbox' || el.type==='radio';
// 押した・Enter・選んだ操作のその場で描き直すときは、打ちかけの値は戻さない（「追加」で欄を空にする処理などを打ち消さないように）。裏の読み直し・後読みのときだけ戻す
let userActNow=false;
['click','submit','keydown','change'].forEach(t=>document.addEventListener(t, ()=>{ userActNow=true; setTimeout(()=>{ userActNow=false; }, 0); }, true));

    let sel=null; if(el===a && !chk){ try{ sel=[el.selectionStart, el.selectionEnd]; }catch{} }

  });

}
function inputBack(list, sameModal, values){

function setShowSec(k){
  const m=S.modal; if(!m || m.type!=='settings') return;
  m.sec=k; safeSet(LS.setSec, k);
  const q=document.querySelector('[data-setq]'); if(q && q.value){ q.value=''; setFilter(q); }
  document.querySelectorAll('.setnavb').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  setNavShow();   // スマホで横に流したとき、選んだまとまりが見えるように（横にだけ流す）
  document.querySelectorAll('.setcard').forEach(c=>{ c.hidden = c.dataset.sec!==k; });
  const main=document.querySelector('.settings'); if(main) main.scrollTop=0;
}
// 探す：言葉が入っているあいだは、まとまりに関係なく当てはまるカードを出す（空にすると、選んでいたまとまりに戻る）
function setFilter(el){
  const m=S.modal; if(!m) return;
  const q=setFold(el.value.trim()), words=q?q.split(/\s+/):[];
  let n=0;
  document.querySelectorAll('.setcard').forEach(c=>{ const hit = words.length ? words.every(w=>c.dataset.k.includes(w)) : c.dataset.sec===m.sec; c.hidden=!hit; if(hit) n++; });
  document.querySelectorAll('.setnavb').forEach(b=>b.classList.toggle('on', !words.length && b.dataset.k===m.sec));
  const f=document.querySelector('.setfound'); if(f){ f.hidden=!words.length || !n; f.textContent=`「${el.value.trim()}」に当てはまる設定 ${n}件`; }
  const none=document.querySelector('.setnone'); if(none) none.hidden=!(words.length && !n);
  const x=document.querySelector('[data-act="set-qx"]'); if(x) x.hidden=!el.value;
}

function openEdit(ref){
  const f=findTask(S.sections, ref); if(!f) return;
  S.modal={type:'edit', ref, orig:{text:f.task.text, due:f.task.due||null, prio:!!f.task.prio, who:f.task.who||null, notes:[...(f.task.notes||[])], subs:(f.task.subs||[]).map(x=>x.text)}, draft:{text:f.task.text, notes:(f.task.notes||[]).join('\n'), cat:ref.cat, due:f.task.due||'', prio:f.task.prio, who:f.task.who||'', subs:(f.task.subs||[]).map(s=>({...s, orig:s.text})), moveTo:JSON.stringify(refPath(ref))}};

function syncDraft(){
  const m=S.modal; if(!m||!m.draft) return; const form=document.querySelector('form[data-act="save-task"]'); if(!form) return;
  m.draft.text=form.text.value; m.draft.due=form.due.value; if(form.notes) m.draft.notes=form.notes.value; if(form.who) m.draft.who=form.who.value;
  form.querySelectorAll('[data-sub]').forEach(i=>{ m.draft.subs[+i.dataset.sub].text=i.value; });
  const ns=form.querySelector('[data-newsub]'); m.draft.newsub=ns?ns.value:'';
  if(form.moveto) m.draft.moveTo=form.moveto.value;
}

function ndragMove(y){
  const d=NDRAG; if(!d) return; d.y=y;
  d.ghost.style.top=(y-d.dy)+'px';
  const wrap=document.querySelector('.notes'); if(!wrap) return;
  if(d.kind==='note'){
    // 指の高さにある区分（区分と区分のすき間なら近いほう）の、どの行の前に入るか
    let sec=null, best=Infinity;
    for(const s of wrap.querySelectorAll('.ncat')){ const r=s.getBoundingClientRect(); const dist = y<r.top ? r.top-y : y>r.bottom ? y-r.bottom : 0; if(dist<best){ best=dist; sec=s; } }
    if(!sec) return;
    const list=sec.querySelector('.nlist'), rows=[...list.querySelectorAll('.nrow')].filter(x=>x!==d.src);
    let before=null; for(const row of rows){ const r=row.getBoundingClientRect(); if(y < r.top+r.height/2){ before=row; break; } }
    if(before) list.insertBefore(d.line, before); else list.appendChild(d.line);
    d.target={cat:sec.dataset.cat, index: before?rows.indexOf(before):rows.length, beforeText: before?noteTextAt(before):null};
  } else {
    const secs=[...wrap.querySelectorAll(':scope > .ncat')].filter(x=>x!==d.src);
    let before=null; for(const s of secs){ const r=s.getBoundingClientRect(); if(y < r.top+r.height/2){ before=s; break; } }
    if(before) wrap.insertBefore(d.line, before); else wrap.insertBefore(d.line, wrap.querySelector('.nfoot'));
    d.target={index: before?secs.indexOf(before):secs.length, beforeName: before?before.dataset.cat:null};

  if(a==='save-supitems'){ const items=f.items.value.split('\n').map(l=>l.split(/[｜|]/).map(x=>x.trim())).filter(c=>c[0]).map(c=>({name:c[0], urgent:c[1]||'', need:c[2]||'', ok:c[3]||'', pin:/★|☆|1|ピン|○|〇/.test(c[4]||'')})); S.modal=null; render(); saveSupItems(items); return; }
  if(a==='save-pw'){ const m=S.modal; if(m.saving) return; const row={}; for(const k of PW_FIELDS) row[k]=(f.elements[k]?.value||'').trim(); if(!row['サービス']) return toast('サービス名を入れてください',true);
    for(const k of PW_FIELDS) m.draft[k]=f.elements[k]?.value ?? m.draft[k];   // 失敗したときに入力を残せるように写しておく

    const ok=await pwSave(m.id, row); m.saving=false; if(ok){ if(S.modal===m) S.modal=null; } else { m.error=pwSave.err; } render(); return; }
  if(a==='save-rvconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url.replace(/[?#].*$/,''), key=sp.key||safeGet(LS.rvKey);  // 管理画面の URL（?admin=1 など）を貼られても、窓口の …/exec だけを使う
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return toast('ささやきのウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.rvUrl,url||null); safeSet(LS.rvKey,url?key:null); RV.rows=null; RV.error=''; RV.at=''; S.modal=null; if(url){ S.tab='bok'; S.bok=null; safeSet(LS.tab,'bok'); } render(); toast(url?'BOK（ささやき）につなぎました':'BOK の接続先と鍵を消しました'); return; }
  if(a==='save-rd'){ rdSubmit(); return; }
  if(a==='save-rdconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url.replace(/[?#].*$/,''), key=sp.key||safeGet(LS.rdKey)||'';
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return toast('セラピストDB のウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.rdUrl,url||null); safeSet(LS.rdKey,url?key:null); rdReset(); S.modal=null; if(url) navGo('db'); else render(); toast(url?'セラピストDB につなぎました':'セラピストDB の設定を消しました'); return; }
  if(a==='cp-search'||a==='sq-search'){ f.q.blur(); return; }  // Enter はキーボードを閉じるだけ（打つたびに絞り込んでいる）
  if(a==='save-cpconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url;  // 「設定画面に貼る文字」（URL#鍵）もそのまま受け付ける
    const key=sp.key||safeGet(LS.cpKey)||'';
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Apps Script のウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.cpUrl,url||null); safeSet(LS.cpKey,url?key:null); CP.all=null; CP.at=0; CP.error=''; S.modal=null; if(url) navGo('coupon'); else render(); toast(url?'クーポンにつなぎました':'クーポンの設定を消しました'); return; }
  if(a==='save-pwconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url, key=sp.key||safeGet(LS.pwKey);
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Apps Script のウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.pwUrl,url||null); safeSet(LS.pwKey,url?key:null); PWD.rows=null; PWD.error=''; S.modal=null; if(url){ S.tab='pw'; safeSet(LS.tab,'pw'); } render(); toast(url?'パスワード表につなぎました':'パスワード表の設定を消しました'); return; }
  if(a==='note-add'){ const v=f.q.value.trim(), body=f.body?f.body.value:'';
    if(!v){ if(noteBody(body)){ toast('表題を入れてください',true); f.q.focus(); } return; }
    f.q.value=''; if(f.body) f.body.value=''; delete S.ndraft[naddKey(f)]; f.classList.remove('open'); if(document.activeElement && f.contains(document.activeElement)) document.activeElement.blur();
    const k=ndoc(f.dataset.doc), c=findCat(S[k], f.dataset.cat); addNote(f.dataset.cat, v, k==='memo'?false:!(c&&catPlain(c)), k, body); return; }
  if(a==='ncat-add'){ const v=f.q.value.trim(); if(!v) return; const err=badNoteCat(v, undefined, f.dataset.doc); if(err) return toast(err,true); f.q.value=''; addNoteCat(v, f.dataset.doc); return; }
  if(a==='save-note'){ const m=S.modal, text=f.text.value.trim(); if(!text) return; S.modal=null; updateNote(m.ref, {text, body:f.body?f.body.value:undefined, kind:ndoc(m.ref.doc)==='memo'?'plain':m.draft.kind, cat:m.draft.cat}); return; }
  if(a==='room-add'){ const v=f.q.value.trim(); if(!v) return; const [name,...rest]=v.split(/\s+/); if(findRoom(S.rooms,name)) return toast('同じ名前のルームがあります',true); f.q.value=''; saveRoom(null, {name, area:'', bldg:rest.join(' '), next:'', last:'', every:null, memo:''}); return; }
  if(a==='save-room'){
    const m=S.modal; const v={name:f.name.value.trim(), area:f.area.value.trim(), bldg:f.bldg.value.trim(), next:f.next.value, last:f.last.value, every:parseInt(f.every.value,10)||null, memo:f.memo.value.trim()};
    if(!v.name) return; if(v.name!==m.orig && findRoom(S.rooms, v.name)) return toast('同じ名前のルームがあります',true);
    S.modal=null; saveRoom(m.orig, v); return;
  }
  if(a==='save-room-clean'){
    const m=S.modal, next=f.next.value; const t=todayStr();
    const every = f.keep.checked && next>t ? Math.round((new Date(next)-new Date(t))/864e5) : undefined;
    S.modal=null; cleanedRoom(m.name, next, every); return;
  }
  if(a==='import'){ const iss=S.issues.find(i=>i.number===+f.dataset.num); importIssue(iss, f.dest.value, f.due.value); }
  if(a==='save-task'){
    syncDraft(); const m=S.modal, d=m.draft; const text=d.text.replace(/📅|🔺|👤/gu,'').trim(); if(!text) return;
    const who=cleanWho(d.who);
    if(d.newsub && d.newsub.trim()) d.subs.push({text:d.newsub.trim(),due:null,prio:false});
    const subs=d.subs.filter(s=>s.text.trim()).map(({orig,...s})=>({...s,text:s.text.trim(),subs:s.subs||[]}));  // 孫以下はそのまま残す
    const subRenames=d.subs.filter(s=>s.orig!==undefined && s.text.trim() && s.text.trim()!==s.orig).map(s=>({from:s.orig, to:s.text.trim()}));  // 名前を変えたサブタスク
    S.modal=null; render();
    const notes=notesOf(d.notes);
    if(m.type==='add') addTask(d.cat, {text, due:d.due||null, prio:d.prio, who, notes});
    else { let moveTo=null; try{ moveTo=JSON.parse(d.moveTo||'null'); }catch{} updateTask(m.ref, {text, due:d.due||null, prio:d.prio, who, cat:d.cat, notes, subs, moveTo, subRenames, orig:m.orig}); }
  }
  if(a==='save-settings'){
    const repo=f.repo.value.trim(); const token=f.token.value.trim()||safeGet(LS.token);
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('リポジトリは owner/name の形で入れてください', true);
    if(!token) return toast('トークンを入れてください', true);
    const be=githubBackend(token, repo);
    try{ await be.check(); }catch(err){ return toast(err.status===401?'トークンが無効です':err.status===404?'リポジトリが見つからないか、トークンの対象外です':'接続できませんでした', true); }
