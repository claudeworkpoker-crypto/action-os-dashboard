// --- ルームの清掃 ---
// rooms.md: 表（ルーム・建物・次回清掃・前回清掃・間隔（日）・メモ）。日付は YYYY-MM-DD
function normDate(s){
  s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function parseRooms(text){
  const rows=[]; let hdr=null;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    if(!/^\s*\|/.test(line)) continue;
    const cells=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
    if(!hdr){ if(cells.some(x=>/ルーム|部屋/.test(x))) hdr=cells.map(x=>x.replace(/\s/g,'')); continue; }
    if(cells.every(x=>/^:?-{2,}:?$/.test(x)||x==='')) continue;
    const get=(...ks)=>{ const i=hdr.findIndex(h=>ks.some(k=>h.startsWith(k))); return i>=0?(cells[i]||''):''; };
    const name=get('ルーム','部屋'); if(!name) continue;
    rows.push({name, area:get('エリア','店舗','地域'), bldg:get('建物','備考'), next:normDate(get('次回')), last:normDate(get('前回')), every:parseInt(get('間隔'),10)||null, memo:get('メモ')});
  }
  return rows;
}
function serializeRooms(rows){
  const cell=v=>String(v??'').replace(/\|/g,'／').replace(/\s*\n\s*/g,' ').trim();
  return ROOMS_INIT + rows.map(r=>`| ${[r.name,r.area,r.bldg,r.next,r.last,r.every||'',r.memo].map(cell).join(' | ')} |`).join('\n') + (rows.length?'\n':'');
}
const roomsFile = (fn,msg) => mutateFile('rooms.md', t=>{ const r=parseRooms(t); if(fn(r)===false) return false; return serializeRooms(r); }, msg, ROOMS_INIT);
function roomOp(label, fn, msg){ enqueue(label, ()=>{ if(S.rooms) fn(S.rooms); }, ()=>roomsFile(fn, msg)); }
const findRoom = (rows, name) => rows.find(r=>r.name===name);
function roomState(r){
  const t=todayStr();
  if(!r.next) return {cls:'', label:'未定'};
  if(r.next<t){ const d=Math.round((new Date(t)-new Date(r.next))/864e5); return {cls: d>=3?'red':'amber', label:`${d}日過ぎ`}; }  // 赤は3日以上の遅れだけ（赤ばかりで本当に急ぐものが埋もれないように）
  if(r.next===t) return {cls:'amber', label:'今日'};
  const d=Math.round((new Date(r.next)-new Date(t))/864e5);
  return {cls: d<=3?'soon':'', label: d===1?'明日':`あと${d}日`};
}
function roomsDueCount(){ const t=todayStr(); return S.rooms ? S.rooms.filter(r=>r.next && r.next<=t).length : 0; }
function cleanedRoom(name, next, every){
  const t=todayStr();
  roomOp('清掃済みにしました', rows=>{ const r=findRoom(rows,name); if(!r) return false; r.last=t; if(every!==undefined) r.every=every; r.next = next!==undefined ? next : (r.every ? addDays(t, r.every) : r.next); }, `dashboard: ${name} を清掃済みにする`);
}
function saveRoom(orig, v){
  roomOp(orig?'更新しました':'追加しました', rows=>{
    if(orig){ const r=findRoom(rows,orig); if(!r) return false; if(v.name!==orig && findRoom(rows,v.name)) return false; Object.assign(r, v); }
    else { if(findRoom(rows,v.name)) return false; rows.push(v); }
  }, orig?`dashboard: ルーム ${v.name} を更新`:`dashboard: ルーム ${v.name} を追加`);
}
function deleteRoom(name){ roomOp('削除しました', rows=>{ const i=rows.findIndex(r=>r.name===name); if(i<0) return false; rows.splice(i,1); }, `dashboard: ルーム ${name} を削除`); }

function viewRooms(){
  const t=todayStr();

const PW_FIELDS = ['区分','サービス','ログインURL','ID・メール','パスワード','メモ'];
const pwConf = () => ({url:safeGet(LS.pwUrl)||'', key:safeGet(LS.pwKey)||''});
const pwOn = () => S.be && (S.be.kind==='demo' || !!pwConf().url);
const PWD = {rows:null, loading:false, error:'', q:'', shown:new Set(), timers:{}};
let pwDemo = null;
async function pwCall(action, payload={}){
  if(S.be && S.be.kind==='demo' && !pwConf().url){  // デモ（接続先が未設定のとき）：画面の中だけで動かす
    if(!pwDemo) pwDemo=[
      {ID:'d1','区分':'媒体','サービス':'見本の媒体（管理画面）','ログインURL':'https://example.com/login','ID・メール':'shop@example.com','パスワード':'sample-Pass-123','メモ':'二段階認証は店のスマホ','更新日':todayStr()},
      {ID:'d2','区分':'連絡','サービス':'見本の LINE 公式アカウント','ログインURL':'https://manager.line.biz/','ID・メール':'info@example.com','パスワード':'demo-0042','メモ':'','更新日':todayStr()},
      {ID:'d3','区分':'店舗','サービス':'見本のルーム Wi-Fi','ログインURL':'','ID・メール':'ROOM-WIFI','パスワード':'0123456789','メモ':'D105 の冷蔵庫の横','更新日':todayStr()}];
    await new Promise(r=>setTimeout(r,150));
    if(action==='list') return {ok:true, rows:pwDemo.map(r=>({...r}))};
    if(action==='add'){ const r={...payload.row, ID:'d'+Date.now(), '更新日':todayStr()}; pwDemo.push(r); return {ok:true, row:r}; }
    if(action==='update'){ const r=pwDemo.find(x=>x.ID===payload.id); if(!r) return {ok:false,error:'見つかりません'}; Object.assign(r, payload.row, {'更新日':todayStr()}); return {ok:true, row:r}; }
    if(action==='delete'){ pwDemo=pwDemo.filter(x=>x.ID!==payload.id); return {ok:true}; }
  }
  const {url,key}=pwConf();
  if(!url||!key) throw new Error('パスワード表の接続先と鍵が設定されていません（設定画面）');
  // text/plain で送ると、Apps Script へ事前確認なしで届く
  const r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow'});
  if(!r.ok) throw new Error(`パスワード表に接続できませんでした（${r.status}）`);
  const j=await r.json().catch(()=>{ throw new Error('パスワード表の返事を読めませんでした（URL が正しいか確かめてください）'); });
  if(!j.ok) throw new Error(j.error||'パスワード表でエラーが出ました');
  return j;
}

}

function cpExpires(drawn){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(drawn||''); if(!m) return ''; const day=+m[3]; const d=new Date(+m[1], +m[2]-1+1, day); if(d.getDate()!==day) d.setDate(0); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function cpDemoItem(r){
  const t=todayStr(), expires=cpExpires(r.drawn), used=!!r.usedAt||r.colored;
  const status = used ? 'used' : (expires && t>expires ? 'expired' : 'valid');
  return {...r, expires, status, daysLeft: status==='valid' ? Math.round((new Date(expires+'T00:00:00')-new Date(t+'T00:00:00'))/86400000) : null};
}
const cpNorm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
async function cpCall(action, payload={}){
  if(S.be && S.be.kind==='demo' && !cpConf().url){
    if(!cpDemo) cpDemo=cpDemoRows();
    await new Promise(r=>setTimeout(r,200));
    if(action==='coupon.search'){ const q=cpNorm(payload.q); return {ok:true, items:cpDemo.filter(r=>!q||[r.code,r.num,r.name,r.therapist].some(x=>cpNorm(x).includes(q))).map(cpDemoItem)}; }
    const r=cpDemo.find(x=>x.row===payload.row && x.code===payload.code); if(!r) return {ok:false, error:'当選者一覧が変わっています。探し直してください'};
    if(action==='coupon.use'){ r.usedAt=todayStr(); r.colored=true; } else { r.usedAt=''; r.colored=false; }
    return {ok:true, item:cpDemoItem(r)};
  }
  const {url,key}=cpConf();
  if(!url||!key) throw new Error('クーポンの接続先と鍵が設定されていません（設定画面）');
  // text/plain で送ると、Apps Script へ事前確認なしで届く
  const r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow'});
  if(!r.ok) throw new Error(`アンケートの窓口に接続できませんでした（${r.status}）`);
  const j=await r.json().catch(()=>{ throw new Error('アンケートの窓口の返事を読めませんでした（URL が正しいか、窓口を足した版が公開されているか確かめてください）'); });
  if(!j.ok) throw new Error(j.error||'アンケートの窓口でエラーが出ました');
  return j;
}
async function cpLoad(){
  const my=++CP.seq; const had=cpFocused(); CP.loading=true; CP.error=''; render(); if(had) cpRefocus();

}

function cpRemoteSearch(q){

  CP.sTimer=setTimeout(async ()=>{ CP.sq=q; try{ const j=await cpCall('coupon.search',{q}); if(CP.q.trim()===q){ const had=cpFocused(); CP.sItems=j.items||[]; render(); if(had) cpRefocus(); } }catch(e){ toast(e.message,true); } }, 400);

const cpMatch = (it, q) => [it.code, it.num, it.name, it.therapist].some(x=>cpNorm(x).includes(q));
// 今の検索の文字で絞った一覧（文字が空なら新しい順に50件）
function cpShown(){
  const q=cpNorm(CP.q);
  if(!q) return {list:(CP.all||[]).slice(0,50), total:(CP.all||[]).length, q:''};
  if(CP.partial){ if(CP.sq!==CP.q.trim()) cpRemoteSearch(CP.q.trim()); return {list:CP.sItems||[], total:null, q, remote:true}; }
  const hit=(CP.all||[]).filter(it=>cpMatch(it,q));
  return {list:hit.slice(0,100), total:hit.length, q};
}

function cpRefocus(pos){ const i=document.querySelector('[data-cpq]'); if(!i) return; i.focus(); const p=pos==null?i.value.length:pos; try{ i.setSelectionRange(p,p); }catch{} }

async function cpMark(row, on){
  const it=[...(CP.all||[]), ...(CP.sItems||[])].find(x=>x.row===row); if(!it || CP.busy[row]) return;
  const who=`「${it.code}」（${it.prize}・${it.name||'名前なし'}さん）`;
  const msg = on
    ? `${it.status==='expired'?`期限が切れています（${cpMd(it.expires)}まで）。\n`:''}${who}を利用済みにしますか？\nスプレッドシートのこの行の色も変わります。`
    : `${who}の利用済みを取り消しますか？\nスプレッドシートのこの行の色も元に戻ります。`;
  if(!confirm(msg)) return;
  CP.busy[row]=true; render();
  try{ const j=await cpCall(on?'coupon.use':'coupon.unuse',{row:it.row, code:it.code}); for(const arr of [CP.all, CP.sItems]){ const i=(arr||[]).findIndex(x=>x.row===row); if(i>=0 && j.item) arr[i]=j.item; } toast(on?'利用済みにしました（スプレッドシートの色も変えました）':'利用済みを取り消しました'); }
  catch(e){ toast(e.message,true); }

}
const cpMd = ds => { const m=/^\d{4}-(\d{2})-(\d{2})/.exec(ds||''); return m ? `${+m[1]}/${+m[2]}` : (ds||''); };
function cpStatusLabel(it){

async function sqLoad(){
  const my=++SQ.seq; let had=sqFocused(); SQ.loading=true; SQ.error=''; render(); if(had) sqRefocus();
  try{
    const j=await sqCall({offset:0, limit:SQ_PAGE}); if(my!==SQ.seq) return;
    SQ.items=j.items||[]; SQ.total=j.total||0; SQ.more=!!j.more; SQ.next=j.next||0; SQ.at=Date.now();
    if(SQ.more){
      // 最初の分を先に出し、残りは並べて読む（新しい順を保ってつなげる）
      const offs=[]; for(let o=SQ.next; o<SQ.total; o+=SQ_PAGE) offs.push(o);
      SQ.rest=Math.max(0, SQ.total-SQ.items.length); had=sqFocused(); render(); if(had) sqRefocus();
      const pages=await Promise.all(offs.map(o=>sqCall({offset:o, limit:SQ_PAGE}).catch(e=>({err:e}))));
      if(my!==SQ.seq) return;
      let bad=null;
      for(const pg of pages){ if(pg.err){ bad=pg.err; break; } SQ.items=SQ.items.concat(pg.items||[]); SQ.next=pg.next||SQ.next; }
      SQ.more = !!bad || SQ.next<SQ.total;   // 読めなかった分は「もっと古い回答を読み込む」で続きから読める
      if(bad) toast(bad.message,true);
    }
  }
  catch(e){ if(my===SQ.seq){ SQ.error=e.message; if(!SQ.items) SQ.items=[]; } }
  if(my===SQ.seq){ SQ.rest=0; had=sqFocused(); SQ.loading=false; render(); if(had) sqRefocus(); }

// ===== 空室情報（BOK のルーム空室情報。正本は BOK のスプレッドシート） =====
// 読み書きは BOK のウェブアプリの窓口（room.list / room.update）を通して行う。GitHub には一切書かない。
// 表の形：ルーム（北千住・柏などのエリア）× 曜日（月〜日）× 1日3マス＋曜日ごとの「見せない人」。週によらない定常の表。
// 接続先の URL と鍵は、この端末のブラウザにだけ保存する。中身はブラウザに残さない（開いている間だけ持つ）。
const rvConf = () => ({url:safeGet(LS.rvUrl)||'', key:safeGet(LS.rvKey)||''});
const rvOn = () => S.be && (S.be.kind==='demo' || !!rvConf().url);
const RV = {rows:null, names:[], loading:false, error:'', at:'', loadedAt:0, ms:0};
const RV_STALE_MS = 10*60*1000;  // これより前に読んだものは、開いたときに読み直す
const rvDay = d => String(d||'').replace(/曜日$/,'');
const rvNone = s => { const t=String(s||'').trim(); return !t || t==='-' || t==='−' || t==='ー'; };  // BOK と同じ「空きなし」の決まり
// 書いてよい形（半角の数字をハイフンでつなぐ。30分単位などの小数も可：10-17、24-6、10-14.5）。「10:00」「1/2」は BOK で化けて戻らないため使わせない
const RV_OK = /^\d{1,2}(\.\d{1,2})?-\d{1,2}(\.\d{1,2})?$/;
// 入力を半角にそろえる（全角の数字・小数点、数字にはさまれた全角のハイフン・長音・波線を「-」に、空白は取る）
const rvClean = s => String(s||'').replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/．/g,'.').replace(/[\s　]/g,'').replace(/(\d)[－−ー―‐〜～~](?=\d)/g,'$1-');
// 「見せない人」の名前の照合（BOK と同じく、全角→半角・スペース無視）
const rvNorm = s => String(s||'').replace(/[０-９Ａ-Ｚａ-ｚ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\s　]/g,'');
// ===== BOK の窓口（ささやきのウェブアプリ）。どの機能も同じ URL・同じ鍵で呼ぶ =====
// デモ（?demo で、接続先が未設定のとき）は、BOK_DEMO の見本のデータで、画面の中だけで動かす
const BOK_DEMO = {};
const clone = o => JSON.parse(JSON.stringify(o));
async function bokCall(action, payload={}, timeoutMs=45000){
  let j;
  if(S.be && S.be.kind==='demo' && !rvConf().url){
    const fn=BOK_DEMO[action]; if(!fn) throw new Error('デモには、この機能の見本がありません');
    await new Promise(r=>setTimeout(r,450));
    j=fn(clone(payload));
  } else {
    const {url,key}=rvConf();
    if(!url||!key) throw new Error('BOK の接続先と鍵が設定されていません（設定画面の「BOK（ささやき）につなぐ」）');
    // text/plain で送ると、Apps Script へ事前確認なしで届く。BOK の窓口は数秒かかるので、待つのは timeoutMs まで
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(), timeoutMs);
    let r;
    try{ r=await fetch(url,{method:'POST', body:JSON.stringify({key, action, ...payload}), redirect:'follow', signal:ac.signal}); }
    catch(e){ throw new Error(e.name==='AbortError' ? 'BOK からの返事に時間がかかりすぎました。少し待ってからもう一度試してください。' : 'BOK につながりませんでした。通信を確かめて、もう一度試してください。'); }
    finally{ clearTimeout(t); }
    if(!r.ok) throw new Error(`BOK につながりませんでした（${r.status}）`);
    j=await r.json().catch(()=>{ throw new Error('BOK の返事を読めませんでした（設定の URL が正しいか確かめてください）'); });
  }
  if(j && j.ok===false && j.needConfirm) return j;  // 設定のルーム一覧など：確かめてから送り直す返事は、そのまま返す
  if(!j || !j.ok){
    const msg=(j&&j.error)||'BOK でエラーが出ました';
    const e=new Error(msg==='鍵が違います' ? '鍵が違います。設定画面の「BOK（ささやき）につなぐ」の鍵を確かめてください。' : msg);
    e.res=j; throw e;
  }
  return j;
}

async function rvSave(){
  const m=S.modal; if(!m || m.type!=='rv' || m.saving) return;
  // 今回さわっていないマス（BOK に前から入っている値）は、そのまま戻す（書き方も確かめない）。
  // 書いたり書き換えたりしたマスだけ、書き方をそろえて（空きなしの印はそのまま、それ以外は半角に）確かめる
  const old=(di,si)=>String(((m.was[di]||{}).slots||[])[si]??'');
  const days=m.draft.map((d,di)=>({day:d.day, slots:d.slots.map((s,si)=>{ const v=String(s??''); if(v===old(di,si)) return v; return rvNone(v)?v.trim():rvClean(v); }), hidden:String(d.hidden||'').trim()}));
  const bad=[]; days.forEach((d,di)=>d.slots.forEach((v,si)=>{ if(v!==old(di,si) && !rvNone(v) && !RV_OK.test(v)) bad.push(`${rvDay(d.day)}の「${v}」`); }));
  if(bad.length){ m.error=`使えない書き方があります：${bad.join('、')}。半角の数字をハイフンでつないでください（例：10-17、24-6、10-14.5）。`; m.conflict=false; render(); return; }
  if(RV.names.length){  // 見せない人の名前を名簿と照らす（書き間違いだと、見せたくない人に見えてしまうため）
    const known=new Set(RV.names.map(rvNorm));
    const unk=[...new Set(days.flatMap(d=>d.hidden.split(/[,、]/).map(s=>s.trim()).filter(Boolean)).filter(n=>!known.has(rvNorm(n))))];
    if(unk.length && !confirm(`名簿にない名前があります：${unk.join('、')}\n書き間違いだと、見せたくない人に見えてしまいます。このまま保存しますか？`)) return;
  }
  m.draft=days.map(d=>({...d, slots:[...d.slots]})); m.saving=true; m.error=''; m.conflict=false; render();
  const t0=performance.now();
  try{
    const j=await rvCall('room.update', {room:m.room, days, was:m.was});
    const i=(RV.rows||[]).findIndex(r=>r.room===m.room); if(i>=0 && j.room) RV.rows[i]=j.room;

    render(); toast(`BOK に保存しました（${rvSec(performance.now()-t0)}。セラピストが次に開いたときから反映）`);
  }catch(e){
    m.saving=false; m.error=e.message; m.conflict=/先に変更/.test(e.message);
    if(S.modal===m) render(); else toast(e.message,true);
  }
}

// 機能ごとの読み込みの状態（中身はブラウザに残さない。開いている間だけ持つ）
const BK = {};
const bk = k => BK[k] || (BK[k]={data:null, loading:false, error:'', at:'', ms:0, loadedAt:0});
const hmNow = () => new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
async function bkLoad(k, action, payload={}, after){
  const s=bk(k); if(s.loading) return;
  s.loading=true; s.error=''; render();
  const t0=performance.now();
  try{ s.data=await bokCall(action, payload); s.loadedAt=Date.now(); s.at=hmNow(); if(after) after(s.data); }
  catch(e){ s.error=e.message; }
  s.ms=performance.now()-t0; s.loading=false; render();
}
function bkBar(k, extra=''){
  const s=bk(k), demo=S.be && S.be.kind==='demo' && !rvConf().url;
  return `<div class="rvbar">${icon('refresh')}<span>${s.loading?'BOK から読み込んでいます…（数秒かかります）':s.at?`${esc(s.at)} に読み込み（${rvSec(s.ms)}）${extra}`:''}${demo?'（デモ）':''}</span><span class="sp"></span><button type="button" class="btn sm" data-act="bk-reload" data-k="${k}" ${s.loading?'disabled':''}>読み直す</button></div>`;
}
// 読み込み中・エラーのときに出すもの（中身があれば空文字）
function bkWait(k){
  const s=bk(k);
  if(s.error) return `<div class="plain"><div class="empty" style="color:var(--red)">${esc(s.error)}</div></div>`;
  if(!s.data) return '<div class="plain"><div class="empty">BOK から読み込んでいます…</div></div>';
  return '';
}
// 取り消せない操作の前の確認（o：title・html・ok（ボタンの文字）・danger・run（押したときにすること））
function bkConfirm(o){ S.modal={type:'bkok', ...o}; render(); }
function bkOkModal(m){
  return `<div class="ov" data-act="close-ov"><div class="modal"><h2>${esc(m.title)}</h2><div class="bkok">${m.html}</div>
    <div class="actions"><button type="button" class="btn" data-act="close">やめる</button><button type="button" class="btn pri${m.danger?' warnbtn':''}" data-act="bkok-yes">${esc(m.ok)}</button></div></div></div>`;
}
// 名前の照らし合わせ（BOK と同じく、全角→半角・スペース無視）
const nameKey = s => rvNorm(s);
function viewBok(){
  const f=BOK_FEATURES.find(x=>x.k===S.bok);
  if(f){
    const back=`<div class="bokback"><button type="button" class="iconbtn sm" data-act="bok-back" title="BOK の機能の一覧へ">${icon('back')}</button><span class="ttl">BOK ／ ${esc(f.name)}</span></div>`;
    if(!rvOn()) return back+'<div class="plain"><div class="empty">この端末は、まだ BOK につながっていません。設定（右上の歯車）の「BOK（ささやき）につなぐ」に、ささやきの URL と鍵を入れてください。</div></div>';
    const v=BK_VIEW[f.k]; if(v) return back+v();
  }
  S.bok=null;
  if(rvOn()) himeRefresh();  // 姫予約の件数（BOK のタブの札）を、古ければ数え直す

    const n = x.k==='himeLog' && HIME.count>0 ? `<span class="bokn">${HIME.count}</span>` : '';
    return `<button type="button" class="bokfn" data-act="bok-open" data-k="${x.k}"><span class="ic">${icon(x.ic)}</span><span class="tx"><span class="t1">${esc(x.name)}</span><span class="t2">${esc(x.desc||'')}</span></span>${n}${icon('chev')}</button>`;
  }).join('')}</div>`;
}
// ===== 姫予約ログの未確認の件数（BOK のタブの「姫 ◯」の札） =====
// himeLog.list を1件だけ読んで、シート全体の未確認の件数（unconfirmedCount）をもらう。BOK の注意に合わせ、5分より短い間隔では読まない
const HIME = {count:0, loadedAt:0, loading:false};
const HIME_MIN_MS = 5*60*1000;
async function himeRefresh(force){
  if(!rvOn() || HIME.loading || (!force && Date.now()-HIME.loadedAt<HIME_MIN_MS)) return;
  HIME.loading=true;
  try{ const j=await bokCall('himeLog.list',{limit:1}); himeSetCount(j); }catch(e){}
  HIME.loading=false; HIME.loadedAt=Date.now();
}
function himeSetCount(j){
  if(!j || typeof j.unconfirmedCount!=='number') return;
  const before=HIME.count; HIME.count=j.unconfirmedCount; HIME.loadedAt=Date.now();
  if(before!==HIME.count && !S.modal) render();
}
const himePill = () => HIME.count>0 ? `<span class="himepill" title="姫予約ログの未確認">姫 ${HIME.count}</span>` : '';

// ===== 【1】メンテナンス管理（セラピストのアプリのメニューを一時的に止める。止める・戻すは手で） =====
const MT = {draft:null, saving:false};
BK_LOAD.maintenance = () => bkLoad('maintenance','maintenance.get',{}, d=>{ MT.draft={keys:[...(d.keys||[])], message:d.message||''}; });
BK_VIEW.maintenance = () => {
  const w=bkWait('maintenance'); if(w) return bkBar('maintenance')+w;
  const d=bk('maintenance').data, dr=MT.draft || (MT.draft={keys:[...(d.keys||[])], message:d.message||''});
  const lab=k=>((d.allKeys||[]).find(x=>x.key===k)||{label:k}).label;
  const now=d.keys||[];
  return bkBar('maintenance')+
    (now.length?`<div class="bkwarn">いま ${now.length}件 止めています（${now.map(lab).map(esc).join('、')}）。自動では戻りません。</div>`:'<div class="bkok-ok">いまは何も止めていません。</div>')+
    `<div class="bkcard"><div class="bknote" style="margin:0 0 4px">止めたメニューは、セラピストのアプリで灰色になって押せなくなります。</div>
      ${(d.allKeys||[]).map(x=>{ const on=dr.keys.includes(x.key);
        return `<div class="mtrow${x.enabled===false?' off':''}"><span>${esc(x.label)}</span>${x.enabled===false?'<span class="mtnone">この店舗では使っていない</span>':
          `<span class="mtsw"><button type="button" class="${on?'':'ok'}" data-act="mt-set" data-key="${esc(x.key)}" data-v="0">使える</button><button type="button" class="${on?'stop':''}" data-act="mt-set" data-key="${esc(x.key)}" data-v="1">止める</button></span>`}</div>`; }).join('')}
    </div>
    <div class="bkcard" style="margin-top:12px"><div class="bknote" style="margin:0 0 6px">止めたメニューを押したときにセラピストに出る文言（空にすると既定の文言に戻ります）</div>
      <textarea class="inp" data-mtmsg rows="3" placeholder="${esc(d.defaultMessage||'')}">${esc(dr.message)}</textarea></div>
    <div class="actions" style="margin-top:12px"><button type="button" class="btn pri" data-act="mt-save" ${MT.saving?'disabled':''}>${MT.saving?'保存中…':'BOK に保存'}</button></div>`;
};
function mtSave(){
  const d=bk('maintenance').data, dr=MT.draft; if(!d || !dr || MT.saving) return;
  const order=(d.allKeys||[]).map(x=>x.key);
  const keys=order.filter(k=>dr.keys.includes(k)).concat(dr.keys.filter(k=>!order.includes(k)));
  const before=d.keys||[], lab=k=>((d.allKeys||[]).find(x=>x.key===k)||{label:k}).label;
  const stop=keys.filter(k=>!before.includes(k)), resume=before.filter(k=>!keys.includes(k));
  const message=dr.message.replace(/\r/g,'').trim(), msgChanged = message!==(d.message||'').trim();
  if(!stop.length && !resume.length && !msgChanged) return toast('変わったところがありません');
  bkConfirm({title:'保存してよいですか？', danger:stop.length>0, ok: stop.length?'止めて保存':resume.length?'再開して保存':'保存',
    html:`<p><b class="warn">止める：</b>${stop.length?stop.map(lab).map(esc).join('、'):'（なし）'}</p>
      <p><b style="color:var(--green)">再開する：</b>${resume.length?resume.map(lab).map(esc).join('、'):'（なし）'}</p>
      ${msgChanged?`<p>文言：${message?'変える':'既定の文言に戻す'}</p>`:''}
      <p class="sub">保存した瞬間から、止めたメニューはセラピストが使えなくなります。自動では戻りません。</p>`,
    run: async ()=>{
      MT.saving=true; render();
      try{
        const send = message===String(d.defaultMessage||'').trim() ? '' : message;  // 既定の文言のままなら空で送る（BOK の欄を空のままにする）
        const j=await bokCall('maintenance.save',{keys, message:send, was:{keys:before, message:d.message||''}});
        d.keys=j.keys||keys; if(j.message!==undefined) d.message=j.message;
        MT.draft={keys:[...d.keys], message:d.message||''};
        toast('BOK に保存しました');
      }catch(e){ toast(e.message,true); if(/先に変更|読み直/.test(e.message)) { MT.saving=false; return BK_LOAD.maintenance(); } }
      MT.saving=false; render();
    }});
}
// ===== 【2】姫予約ログ（セラピストが取った予約。内勤が 未確認→対応中→確認済み と進める） =====
// 読むだけでシートの電話番号を直すことがあるので、開いたときと「読み直す」のときだけ読む（自動では読まない）
const HL = {filter:'open', saving:{}};
const HL_ST = ['未確認','対応中','確認済み'];
BK_LOAD.himeLog = () => bkLoad('himeLog','himeLog.list',{limit:200}, d=>himeSetCount(d));
const telHref = p => 'tel:'+String(p||'').replace(/[^\d+]/g,'');
const telFmt = p => { const d=String(p||'').replace(/\D/g,''); return d.length===11 ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}` : d.length===10 ? `${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}` : String(p||''); };
const yen = v => { const n=Number(String(v||'').replace(/[^\d]/g,'')); return n ? n.toLocaleString('ja-JP')+'円' : (v?esc(v):''); };
BK_VIEW.himeLog = () => {
  const w=bkWait('himeLog'); if(w) return bkBar('himeLog')+w;
  const d=bk('himeLog').data, logs=(d.logs||[]).filter(l=>l.registeredAt||l.therapistName||l.customerName);
  const hot=l=>l.isUrgent||l.nameMismatch||l.notifyFailed;
  const F={open:['未確認・対応中',l=>l.status!=='確認済み'], all:['すべて',()=>true], done:['確認済み',l=>l.status==='確認済み'], hot:['急ぎだけ',l=>hot(l)&&l.status!=='確認済み']};
  const list=logs.filter(F[HL.filter][1]);
  const unc=typeof d.unconfirmedCount==='number'?d.unconfirmedCount:logs.filter(l=>l.status==='未確認').length;
  const open=typeof d.openCount==='number'?d.openCount:logs.filter(l=>l.status!=='確認済み').length;
  return bkBar('himeLog', `・最新${logs.length}件${d.total!=null?`（全${d.total}件）`:''}`)+
    `<div class="bktop">${unc?`<span class="bktag red" style="font-size:13px;font-weight:600">未確認 ${unc}件</span>`:'<span class="bktag green">未確認はありません</span>'}${open>unc?`<span class="bktag amber">対応中 ${open-unc}件</span>`:''}</div>
    <div class="bksel">${Object.entries(F).map(([k,[l]])=>`<button type="button" class="wp${HL.filter===k?' on':''}" data-act="hl-filter" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="bklist">${list.length?list.map(l=>{
      const st=HL_ST.includes(l.status)?l.status:'未確認', saving=HL.saving[l.rowNumber];
      return `<div class="bkcard hl${hot(l)&&st!=='確認済み'?' hot':''}${st==='確認済み'?' done':''}">
        <div class="hltop">${l.isUrgent?'<span class="bktag red">24時間以内</span>':''}${l.nameMismatch?'<span class="bktag amber">名前不一致</span>':''}${l.notifyFailed?'<span class="bktag violet">通知失敗</span>':''}<span class="hlreg">登録 ${esc(l.registeredAt||'')}</span></div>
        <div class="hlwho">${esc(l.therapistName||'')} → お客様：${esc(l.customerName||'')}</div>
        <div class="hlrow"><span>${icon('cal')} ${esc(l.date||'')} ${esc(l.start||'')}〜${l.minutes?` ${esc(l.minutes)}分`:''}</span>${l.type?`<span>${esc(l.type)}</span>`:''}${l.total?`<span>${yen(l.total)}</span>`:''}</div>
        ${l.phone?`<div class="hlrow"><a class="hltel" href="${esc(telHref(l.phone))}">${icon('phone')} ${esc(telFmt(l.phone))}</a></div>`:''}
        <div class="bkseg">${HL_ST.map((x,i)=>`<button type="button" class="${st===x?'on'+(i+1):''}" data-act="hl-set" data-row="${l.rowNumber}" data-v="${x}" ${saving?'disabled':''}>${saving&&saving===x?'保存中…':x}</button>`).join('')}</div>
      </div>`; }).join(''):'<div class="plain"><div class="empty">ここに出す予約はありません</div></div>'}</div>`;
};
async function hlSet(rowNumber, status){
  const d=bk('himeLog').data; if(!d) return;
  const l=(d.logs||[]).find(x=>x.rowNumber===rowNumber); if(!l || l.status===status || HL.saving[rowNumber]) return;
  HL.saving[rowNumber]=status; render();
  try{
    const j=await bokCall('himeLog.setStatus',{rowNumber, status, was:{registeredAt:l.registeredAt, therapistName:l.therapistName, status:l.status}});
    const prev=l.status; Object.assign(l, j.log||{status});
    if(typeof j.unconfirmedCount==='number'){ d.unconfirmedCount=j.unconfirmedCount; if(typeof j.openCount==='number') d.openCount=j.openCount; }
    else {  // 件数が返らないとき（v7.98 まで）だけ、変えた分をその場で合わせる
      const du=(l.status==='未確認')-(prev==='未確認'), dop=(l.status!=='確認済み')-(prev!=='確認済み');
      if(typeof d.unconfirmedCount==='number') d.unconfirmedCount=Math.max(0,d.unconfirmedCount+du);
      if(typeof d.openCount==='number') d.openCount=Math.max(0,d.openCount+dop);
    }
    himeSetCount({unconfirmedCount:d.unconfirmedCount});
  }catch(e){ toast(e.message,true); if(/変わって|読み直/.test(e.message)){ delete HL.saving[rowNumber]; return BK_LOAD.himeLog(); } }
  delete HL.saving[rowNumber]; render();
}

      mk(409,'2026/11/25 18:02','見本D香','見本川','09011112222','2026/11/26','19:00','60','本指名','15000',false,false,'確認済み',false)];

const hlCounts = () => { const a=hlDemo(); return {unconfirmedCount:a.filter(x=>x.status==='未確認').length, openCount:a.filter(x=>x.status!=='確認済み').length}; };
BOK_DEMO['himeLog.list'] = p => { const a=hlDemo(), lim=p.limit||200; return {ok:true, total:a.length, returned:Math.min(lim,a.length), logs:clone(a.slice(0,lim)), ...hlCounts()}; };
BOK_DEMO['himeLog.setStatus'] = p => { const l=hlDemo().find(x=>x.rowNumber===p.rowNumber);

// ===== BOK の書く画面の共通の部品 =====
// 入力は打つたびに S.modal.draft へ写す（画面を描き直しても消えないように）。<… data-bkf="項目名">
const todayMD = () => { const [,m,d]=todayStr().split('-'); return `${+m}/${+d}`; };
const bkField = (label, inner, hint='') => `<div class="field"><label>${label}</label>${inner}${hint?`<div class="hint" style="margin-top:4px">${hint}</div>`:''}</div>`;
const bkIn = (f,v,ph='') => `<input class="inp" data-bkf="${f}" value="${esc(v??'')}" placeholder="${esc(ph)}" autocomplete="off">`;
const bkTa = (f,v,ph='',rows=4) => `<textarea class="inp" data-bkf="${f}" rows="${rows}" placeholder="${esc(ph)}">${esc(v??'')}</textarea>`;
const bkChk = (f,on,label,sub) => `<label class="bkchk"><input type="checkbox" data-bkf="${f}" ${on?'checked':''}><span><b>${label}</b>${sub?`<br><span class="sub">${sub}</span>`:''}</span></label>`;
const inNames = (v, names) => names.some(n=>nameKey(n)===nameKey(v));
function bkNameSel(f, v, names){
  const miss = v && !inNames(v, names);
  return `<select class="inp" data-bkf="${f}"><option value="">選んでください</option>${miss?`<option value="${esc(v)}" selected>${esc(v)}（名簿にいない）</option>`:''}${names.map(n=>`<option value="${esc(n)}" ${n===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;

function bkModalWrap(title, body, buttons){ return `<div class="ov" data-act="close-ov"><div class="modal"><h2>${title}</h2>${body}<div class="actions">${buttons}</div></div></div>`; }
// 一覧をまるごと保存する画面（お知らせ・アンケート）と、1件ずつの画面で共通：保存して、ずれていたら読み直す
async function bkSave(k, action, payload, apply, msg){
  const s=bk(k); if(s.saving) return; s.saving=true; render();
  try{ const j=await bokCall(action, payload); if(apply) apply(j); toast(msg); }
  catch(e){ toast(e.message,true); if(/先に変更|変わって|ずれて|読み直/.test(e.message)){ s.saving=false; return BK_LOAD[k](); } }
  s.saving=false; render();
}

function siSendConfirm(){

    html:`<p>Telegram：<b>${tg.length}件</b>${tg.length?`（${tg.map(nm).join('、')}）`:''}</p>

      <p class="warn">送ると取り消せません。${SI.mark?'送った回答は一覧から消えます。':''}</p>`,

async function siSend(plan){
  const d=bk('surveyImport').data; if(!d || SI.sending) return;
  SI.sending=true; SI.prog={done:0, total:plan.length, lines:[]}; render();
  const nm=x=>esc(x.it.matchedName||x.it.rawName||'（名前なし）');
  for(let i=0;i<plan.length;i+=20){  // 1回20件まで（BOK の決まり）
    const chunk=plan.slice(i,i+20);
    const items=chunk.map(x=>({row:x.it.row, rowKey:x.it.rowKey??x.it.key, text:String(SI.edit[x.it.row]??x.it.text), toTelegram:x.tg, toApp:x.app, matchedName:x.it.matchedName||''}));
    let res;
    try{ res=(await bokCall('surveyImport.sendMany',{items, markSent:SI.mark}, 180000)).results||[]; }
    catch(e){
      for(const x of chunk){ SI.fails[x.it.row]=`送れたかどうか分かりません（${e.message}）。「更新」で一覧を取り直して確かめてください。`; SI.prog.lines.push(`<span class="warn">？</span> ${nm(x)}：分かりません`); }
      SI.prog.done+=chunk.length; render(); break;
    }
    chunk.forEach((x,k)=>{
      const r=res.find(y=>Number(y.row)===Number(x.it.row)) || res[k] || {ok:false, error:'返事がありませんでした'};
      if(r.ok){
        delete SI.fails[x.it.row];
        SI.prog.lines.push(`<span style="color:var(--green)">✓</span> ${nm(x)}（${esc((r.done||[]).join('・'))}）`);
        if(SI.mark){ d.items=(d.items||[]).filter(it=>it.row!==x.it.row); if(typeof d.total==='number') d.total=Math.max(0,d.total-1); }
        else if(SI.pick[x.it.row]) SI.pick[x.it.row]={tg:false, app:false};  // 色を塗らないときは一覧に残るので、二重に送らないようチェックを外す
      } else if(SI_ALREADY.test(r.error||'')){  // ほかの人がもう送った回答（BOK が色を見て止めた）。一覧から外す
        delete SI.fails[x.it.row];
        SI.prog.lines.push(`<span style="color:var(--sub)">－</span> ${nm(x)}：もう送ってあります（ほかの人が送ったようです）`);
        d.items=(d.items||[]).filter(it=>it.row!==x.it.row); if(typeof d.total==='number') d.total=Math.max(0,d.total-1);
      } else {
        let err=r.error||'送れませんでした';
        // 途中で失敗しても、BOK はできたところまでを done で返す（v7.99）。済んだ送り先はチェックを外して、二重に送らないようにする
        const done=r.done||[], pk=SI.pick[x.it.row];
        if(done.length){ err+=`（${done.join('・')} は済んでいます。もう一度送るときは、済んだ分のチェックは外したままにしてください）`;
          if(pk){ if(done.includes('Telegram')) pk.tg=false; if(done.includes('アプリ')) pk.app=false; } }
        SI.fails[x.it.row]=err;
        SI.prog.lines.push(`<span class="warn">×</span> ${nm(x)}：${esc(err)}`);
      }
    });
    SI.prog.done+=chunk.length; render();
  }
  SI.sending=false; render();
  const bad=Object.keys(SI.fails).length; toast(bad?`送り終わりました（送れなかったもの ${bad}件）`:'送り終わりました', !!bad);
}

async function stSave(act, fields, extra={}){
  const d=bk('settings').data; if(!d || ST.saving) return;
  const body={...fields}, was={};
  for(const f of Object.keys(fields)) if(f!=='newPasscode' && f in d) was[f]=String(d[f]??'');
  if(Object.keys(was).length) body.was=was;
  ST.saving=act; render();
  try{
    const j=await bokCall('settings.save',{...body, ...extra});
    if(j && j.needConfirm==='rooms'){
      ST.saving=''; render();
      const det=j.detail||{};
      return bkConfirm({title:'ルームの順番または名前が変わります', ok:'それでも保存する', danger:true,
        html:`<div class="stcmp"><div><b>前</b><br>${(det.before||[]).map(esc).join('<br>')}</div><div><b>後</b><br>${(det.after||[]).map(esc).join('<br>')}</div></div><p class="sub">${esc(j.error||'ルーム空室情報の中身が、別のルームにずれます。')}</p>`,
        run:()=>stSave(act, fields, {confirmRooms:true})});
    }
    if(j.settings){ const keepLogo=ST.logo; Object.assign(d, j.settings); delete d.logoDataUri; if('logoDataUri' in fields) ST.logo=fields.logoDataUri, ST.logoNew=null; else ST.logo=keepLogo; }
    else Object.assign(d, fields);
    stInit(d);
    toast('BOK に保存しました');
    for(const w of j.warnings||[]) setTimeout(()=>toast(w,true), 1900);
  }catch(e){ toast(e.message,true); if(/先に変更|読み直/.test(e.message)){ ST.saving=''; return BK_LOAD.settings(); } }
  ST.saving=''; render();
}
function stAct(a, el){
  const d=bk('settings').data; if(!d) return;
  const dr=ST.dr;
  if(a==='st-week'){ const v=dr.weekStart; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return toast('日付を入れてください',true);
    return bkConfirm({title:'対象週を変えますか？', ok:'変える', danger:true, html:`<p>${esc(d.weekStart)} → <b>${esc(v)}</b>${wdayOf(v)!==1?' <span class="warn">（月曜日ではありません）</span>':''}</p><p class="sub">セラピストに出るシフト提出の週が変わります。</p>`, run:()=>stSave(a,{weekStart:v})}); }
  if(a==='st-rooms'){ const rooms=ST.rooms.map(x=>x.trim()).filter(Boolean); if(!rooms.length) return toast('ルームを1つ以上入れてください',true);
    return stSave(a,{rooms:rooms.join(', '), areas:splitList(dr.areas).join(', ')}); }
  if(a==='st-links'){ const f={}; for(const [k] of ST_LINKS) f[k]=String(dr[k]||'').trim(); return stSave(a,f); }
  if(a==='st-tg'){ const f={telegramChatId:String(dr.telegramChatId||'').trim(), telegramMemoChatId:String(dr.telegramMemoChatId||'').trim()};
    if(ST.tokEdit && String(dr.telegramToken||'').trim()) f.telegramToken=String(dr.telegramToken).trim();

  if(a==='st-hime') return stSave(a,{himeNgMessage:String(dr.himeNgMessage||'').trim()});
  if(a==='st-logo'){ if(!ST.logoNew) return; if(ST.logoNew.length>45000) return toast('画像が大きすぎます',true); return stSave(a,{logoDataUri:ST.logoNew}); }
  if(a==='st-pass'){ S.modal={type:'bkpass', draft:{p1:'',p2:''}}; render(); return; }
}

// ロゴ：BOK に入る大きさ（45,000文字まで）になるまで縮める
async function stLogoPick(file){
  try{
    const url=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    for(const size of [512,400,320,256,200,160,128,96]) for(const [type,q] of [['image/png'],['image/jpeg',0.88],['image/jpeg',0.72]]){
      const sc=Math.min(1,size/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      const g=c.getContext('2d'); if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); } g.drawImage(img,0,0,c.width,c.height);
      const out=c.toDataURL(type,q); if(out.length<=44000){ ST.logoNew=out; render(); return; }
    }
    toast('画像を小さくしきれませんでした。もう少し軽い画像を選んでください',true);
  }catch(e){ toast('画像を読めませんでした',true); }
}

// ===== 備品の補充（supplies.md） =====
// 「## チェック項目」の表に、品目ごとの目安（至急・補充必要・補充の必要無）を持つ。
// 「## ルーム名」ごとに、点検した日（点検: YYYY-MM-DD）と、補充が要るものをチェック付きの箇条書きで持つ（例：- [ ] お茶【至急】）。
// 足りているものは書かない。ファイルがあるときだけタブを出す。
const SUP_INIT = '# 備品の補充\n\n## チェック項目\n\n| 品目 | 至急 | 補充必要 | 補充の必要無 | ピン |\n|---|---|---|---|---|\n';
const SUP_LV = {urgent:{tag:'至急', cls:'red'}, need:{tag:'補充', cls:'amber'}};
function supItemOf(t){
  let s=String(t), level='need', qty=1;
  const lv=s.match(/【\s*(至急|補充|補充必要)\s*】/); if(lv){ level = lv[1]==='至急'?'urgent':'need'; s=s.replace(lv[0],''); }
  const q=s.match(/\s*[×xX＊*]\s*(\d+)\s*$/); if(q){ qty=+q[1]; s=s.slice(0,q.index); }
  return {name:s.trim(), level, qty};
}
function parseSupplies(text){
  const d={items:[], rooms:[]}; let cur=null, inItems=false;
  for(const line of String(text||'').replace(/\r/g,'').split('\n')){
    const h=line.match(/^##\s+(.+?)\s*$/);
    if(h){ inItems = /^チェック項目$/.test(h[1]); cur = inItems ? null : {room:h[1], checked:'', items:[]}; if(cur) d.rooms.push(cur); continue; }
    if(inItems){
      if(!/^\s*\|/.test(line)) continue;
      const c=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
      if(c[0]==='品目' || c.every(x=>/^:?-{2,}:?$/.test(x)||x==='')) continue;
      if(c[0]) d.items.push({name:c[0], urgent:c[1]||'', need:c[2]||'', ok:c[3]||'', pin:/★|☆|1|ピン|○|〇/.test(c[4]||'')});
      continue;
    }
    if(!cur || !line.trim()) continue;
    const ck=line.match(/^\s*点検\s*[:：]\s*(\d{4}-\d{2}-\d{2})/); if(ck){ cur.checked=ck[1]; continue; }
    const m=line.match(/^\s*[-*] (?:\[( |x|X)\]\s?)?(.*)$/); if(!m) continue;
    const it=supItemOf(m[2]); if(!it.name) continue;
    cur.items.push({...it, done: m[1]!==undefined && m[1]!==' '});
  }
  return d;
}
function serializeSupplies(d){
  const cell=v=>String(v??'').replace(/\|/g,'／').replace(/\s*\n\s*/g,' ').trim();
  let out=SUP_INIT;
  for(const it of d.items) out+=`| ${[it.name,it.urgent,it.need,it.ok,it.pin?'★':''].map(cell).join(' | ')} |\n`;
  for(const r of d.rooms){
    if(!r.items.length && !r.checked) continue;
    out+=`\n## ${r.room}\n\n`;
    if(r.checked) out+=`点検: ${r.checked}\n\n`;
    for(const it of r.items) out+=`- [${it.done?'x':' '}] ${it.name}【${SUP_LV[it.level].tag}】${it.qty>1?` ×${it.qty}`:''}\n`;
  }
  return out;
}
const suppliesFile = (fn,msg) => mutateFile('supplies.md', t=>{ const d=parseSupplies(t); if(fn(d)===false) return false; return serializeSupplies(d); }, msg, SUP_INIT);
function supOp(label, fn, msg){ enqueue(label, ()=>{ if(S.supplies) fn(S.supplies); }, ()=>suppliesFile(fn, msg)); }
const supRoom = (d, room) => d.rooms.find(r=>r.room===room);
const supFind = (d, ref) => { const r=supRoom(d, ref.room); if(!r) return null; const i=r.items.findIndex(x=>x.name===ref.name && !!x.done===!!ref.done); return i<0?null:{r, i, it:r.items[i]}; };
const supOpen = r => r.items.filter(x=>!x.done);
function supOpenCount(){ return S.supplies ? S.supplies.rooms.reduce((a,r)=>a+supOpen(r).length,0) : 0; }
function supRoomCount(room){ const r=S.supplies && supRoom(S.supplies, room); return r ? supOpen(r).length : 0; }
// ルームの並び：清掃の表の順（エリアごと）。補充リストにだけあるルームは後ろ
function supRoomNames(){ return [...new Set([...(S.rooms||[]).map(r=>r.name), ...(S.supplies?S.supplies.rooms.map(r=>r.room):[])])]; }
const roomArea = n => ((S.rooms||[]).find(x=>x.name===n)||{}).area || '';

// 点検の結果を書く：選んだ品目は「至急／補充」にし、「足りている」にした品目の未補充の行は消す。点検した日も書く
function saveInspection(room, picks){
  const day=todayStr();
  supOp('点検の結果を保存しました', d=>{
    let r=supRoom(d, room); if(!r){ r={room, checked:'', items:[]}; d.rooms.push(r); }
    for(const [name, lv] of Object.entries(picks)){
      const open=r.items.find(x=>x.name===name && !x.done);
      if(lv==='ok'){ if(open) r.items.splice(r.items.indexOf(open),1); }
      else if(open) open.level=lv;
      else r.items.push({name, level:lv, qty:1, done:false});
    }
    r.checked=day;
  }, `dashboard: ${room} の備品を点検`);
}
function addSupply(room, name, level){
  supOp('補充リストに足しました', d=>{
    let r=supRoom(d, room); if(!r){ r={room, checked:'', items:[]}; d.rooms.push(r); }
    const open=r.items.find(x=>x.name===name && !x.done);
    if(open) open.level=level; else r.items.push({name, level, qty:1, done:false});
  }, `dashboard: ${room} に「${name}」の補充を追加`);
}
function toggleSupply(ref){ supOp('', d=>{ const f=supFind(d,ref); if(!f) return false; f.it.done=!f.it.done; }, `dashboard: ${ref.room} の「${ref.name}」を${ref.done?'未補充に戻す':'補充済みにする'}`); }
function delSupply(ref){ supOp('消しました', d=>{ const f=supFind(d,ref); if(!f) return false; f.r.items.splice(f.i,1); }, `dashboard: ${ref.room} の「${ref.name}」を消す`); }
function roomSupplyDone(room){ supOp('このルームの補充を済みにしました', d=>{ const r=supRoom(d,room); if(!r || !supOpen(r).length) return false; r.items.forEach(x=>x.done=true); }, `dashboard: ${room} の補充をすべて済みにする`); }
function clearDoneSupplies(){ supOp('済みを消しました', d=>{ let hit=false; d.rooms.forEach(r=>{ const n=r.items.length; r.items=r.items.filter(x=>!x.done); if(r.items.length!==n) hit=true; }); if(!hit) return false; }, 'dashboard: 補充済みを消す'); }
function toggleSupPin(name){ supOp('', d=>{ const it=d.items.find(x=>x.name===name); if(!it) return false; it.pin=!it.pin; }, `dashboard: 点検項目「${name}」のピンを切り替え`); }
function saveSupItems(items){ supOp('点検項目を保存しました', d=>{ d.items=items; }, 'dashboard: 備品の点検項目を更新'); }

// 絞り込み：all＝すべて／open＝要対応だけ（補充済みは隠す）／urgent＝至急だけ
const supF = () => ['all','open','urgent'].includes(safeGet(LS.supF)) ? safeGet(LS.supF) : 'all';
const supShow = x => { const f=supF(); return f==='all' ? true : f==='open' ? !x.done : (!x.done && x.level==='urgent'); };
// 送る用の文面（いまは貼り付けて使う。Telegram などに自動で送るかは別に決める）。至急だけに絞っているときは至急だけ
function supText(){
  const lines=[];
  for(const n of supRoomNames()){ const r=supRoom(S.supplies,n); if(!r) continue; const o=supOpen(r); if(!o.length) continue;
    const u=o.filter(x=>x.level==='urgent').map(x=>x.name), nd=supF()==='urgent' ? [] : o.filter(x=>x.level!=='urgent').map(x=>x.name);
    if(!u.length && !nd.length) continue;
    lines.push(`■ ${n}${roomArea(n)?`（${roomArea(n)}）`:''}`); if(u.length) lines.push(`　至急：${u.join('、')}`); if(nd.length) lines.push(`　補充：${nd.join('、')}`); }
  return lines.length ? `【備品の補充${supF()==='urgent'?'（至急）':''}】${mdw(todayStr())}\n${lines.join('\n')}` : '';
}
function supTotals(){
  const m=new Map();
  for(const r of S.supplies.rooms) for(const x of supOpen(r).filter(supShow)){ const e=m.get(x.name)||{urgent:[], need:[]}; e[x.level==='urgent'?'urgent':'need'].push(r.room); m.set(x.name,e); }
  return [...m.entries()].sort((a,b)=>(b[1].urgent.length-a[1].urgent.length)||((b[1].urgent.length+b[1].need.length)-(a[1].urgent.length+a[1].need.length))||a[0].localeCompare(b[0],'ja'));
}
function viewSupplies(){
  const d=S.supplies, open=supOpenCount(), doneN=d.rooms.reduce((a,r)=>a+r.items.filter(x=>x.done).length,0);
  const names=supRoomNames();
  // 点検：エリアごとにルームを並べ、押すと点検の画面を開く
  const areas=[...new Set(names.map(n=>roomArea(n)||'その他'))];
  const f=supF(), roomShow=n=>{ if(f==='all') return true; const r=supRoom(d,n); return !!r && supOpen(r).some(supShow); };
  const insp=`<div class="supinsp">${areas.filter(a=>names.some(n=>(roomArea(n)||'その他')===a && roomShow(n))).map(a=>`<div class="supa"><div class="grouphd">${esc(a)}</div><div class="supchips">${names.filter(n=>(roomArea(n)||'その他')===a && roomShow(n)).map(n=>{ const r=supRoom(d,n), c=r?supOpen(r):[], u=c.filter(x=>x.level==='urgent').length;
      return `<button class="supchip ${u?'red':c.length?'amber':''}" data-act="sup-inspect" data-room="${esc(n)}"><b>${esc(n)}</b><span>${c.length?(u?`至急${u}・`:'')+`要${c.length}`:'—'}</span><small>${r&&r.checked?`点検 ${esc(mdw(r.checked))}`:'未点検'}</small></button>`; }).join('')}</div></div>`).join('')}</div>`;
  const qq=(S.supQ||'').trim().toLowerCase(), hit=t=>!qq || String(t).toLowerCase().includes(qq);
  const urgentN=d.rooms.reduce((a,r)=>a+supOpen(r).filter(x=>x.level==='urgent').length,0);
  const search=`<form class="supsearch" onsubmit="return false"><input class="inp" data-supq placeholder="さがす（品目・ルーム）" value="${esc(S.supQ||'')}" autocomplete="off">
    <div class="seg supfilter">${[['all','すべて',''],['open','要対応だけ',open],['urgent','至急だけ',urgentN]].map(([k,l,n])=>`<button type="button" class="${f===k?'on':''}" data-act="sup-filter" data-k="${k}">${l}${n!==''?` ${n}`:''}</button>`).join('')}</div></form>`;
  const tools=`<div class="suptools">
    <button type="button" class="btn sm" data-act="sup-copy" ${open?'':'disabled'}>${icon('copy')} 文面をコピー</button>
    ${doneN?`<button type="button" class="btn sm" data-act="sup-clear">補充済みを消す（${doneN}）</button>`:''}
    <button type="button" class="btn sm" data-act="sup-items">点検項目を編集</button>
    <span class="sp"></span><span class="hint">補充が要るもの ${open}件</span></div>`;

// ===== メニュー（左から出す。広い画面では左に出しっぱなしにできる） =====
// 画面はまとまりごとに並べる。上の帯には ★ を付けた画面（端末ごとに覚える）と、いま開いている画面だけを出す
const NAV_DEF = {
  board:{l:'カテゴリ別', ic:'list'}, timeline:{l:'期限順', ic:'cal'}, someday:{l:'いつかやる', ic:'flag'}, runs:{l:'実行', ic:'play'}, done:{l:'完了', ic:'check'},
  notes:{l:'引き継ぎ', ic:'msg'}, memo:{l:'ノート', ic:'book'}, guide:{l:'ご案内状況', ic:'clock'}, rooms:{l:'清掃', ic:'home'}, supplies:{l:'補充', ic:'box'},
  bok:{l:'BOK', ic:'bell'}, coupon:{l:'クーポン', ic:'gift'}, survey:{l:'アンケート', ic:'clip'}, pw:{l:'パスワード', ic:'key'},
};
const NAV_GROUPS = [['タスク',['board','timeline','someday','runs','done']], ['運用',['notes','memo','rooms','supplies']], ['システム',['bok','guide','coupon','survey','pw']]];
const PIN_DEFAULT = ['board','notes','supplies','rooms'];  // ★の数に上限は無い（2026-11-27 社長）
const navWide = () => matchMedia('(min-width:1100px)').matches;
function navAvail(k){ return k==='notes'?!!S.notes : k==='memo'?!!S.memo : k==='rooms'?!!S.rooms : k==='supplies'?!!S.supplies : k==='pw'?pwOn() : k==='coupon'||k==='survey'||k==='guide'?cpOn() : !!NAV_DEF[k]; }
function navPins(){ let a=null; try{ a=JSON.parse(safeGet(LS.pins)||'null'); }catch{} return (Array.isArray(a)?a:PIN_DEFAULT).filter(k=>NAV_DEF[k]); }
function setNavPin(k, on){ let a=navPins().filter(x=>x!==k); if(on) a.push(k); safeSet(LS.pins, JSON.stringify(a)); render(); }
// 画面ごとの件数と、赤くする（すぐ見てほしい）かどうか
function navBadge(k, st){
  const t=todayStr();
  switch(k){
    case 'board': case 'timeline': return {n:st.total, red:st.over>0};
    case 'someday': return {n:S.someday.length};
    case 'runs': { const n=S.runs.filter(r=>RUN_ST[r.status]?.attn).length; return {n, red:n>0}; }
    case 'done': return {n:(S.done[monthOf(t)]||[]).length};
    case 'notes': return {n:notesOpenCount()};
    case 'memo': return {n:''};
    case 'rooms': return {n:roomsDueCount(), red:!!(S.rooms && S.rooms.some(r=>r.next && r.next<=addDays(t,-3)))};
    case 'supplies': { const u=S.supplies ? S.supplies.rooms.reduce((a,r)=>a+supOpen(r).filter(x=>x.level==='urgent').length,0) : 0; return {n:supOpenCount(), red:u>0}; }
    case 'bok': return {n:HIME.count>0?`姫 ${HIME.count}`:'', red:HIME.count>0};
    case 'pw': return {n:PWD.rows?PWD.rows.length:''};
    case 'coupon': return {n:''};
    case 'survey': return {n:''};
    case 'guide': return {n:''};
  }
  return {n:''};
}

// メニューの並び（端末ごとに覚える）。[['まとまりの名前',[画面…]], …]。覚えていなければ NAV_GROUPS のまま
// 覚えたあとで画面が増えたときは、既定のまとまりの最後に足す
function navLayout(){
  const def=NAV_GROUPS.map(([g,ks])=>[g,[...ks]]);
  let a=null; try{ a=JSON.parse(safeGet(LS.navLayout)||'null'); }catch{}
  if(!Array.isArray(a)) return def;
  const out=a.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&Array.isArray(x[1])).map(([g,ks])=>[g, ks.filter(k=>NAV_DEF[k])]);
  for(const [g] of def) if(!out.find(x=>x[0]===g)) out.push([g,[]]);
  const seen=new Set(); for(const x of out) x[1]=x[1].filter(k=>!seen.has(k) && seen.add(k));
  for(const [g,ks] of def) for(const k of ks) if(!seen.has(k)){ out.find(x=>x[0]===g)[1].push(k); seen.add(k); }
  return out;
}
// ▲▼で1つずつ動かす。まとまりの端を越えると、隣のまとまりへ移る（出ていない画面は飛ばす）
function navMove(k, dir){
  const L=navLayout(); const gi=L.findIndex(x=>x[1].includes(k)); if(gi<0) return;
  const ks=L[gi][1], i=ks.indexOf(k), vis=ks.filter(navAvail), vi=vis.indexOf(k);
  ks.splice(i,1);
  if(dir<0){
    if(vi>0){ ks.splice(ks.indexOf(vis[vi-1]),0,k); }
    else if(gi>0){ L[gi-1][1].push(k); }
    else { ks.unshift(k); }
  } else {
    if(vi>=0 && vi<vis.length-1){ ks.splice(ks.indexOf(vis[vi+1])+1,0,k); }
    else if(gi<L.length-1){ L[gi+1][1].unshift(k); }
    else { ks.push(k); }
  }
  safeSet(LS.navLayout, JSON.stringify(L)); render();
}

function tryCloseModal(){

// 親タスクを変える選択肢（同じカテゴリのタスク。自分と自分の下にあるものは選べない）
function moveField(ref, d){
  const sec=S.sections.find(s=>s.name===ref.cat); if(!sec) return '';
  const self=[...refPath(ref), ref.text], opts=[[JSON.stringify([]), 'なし（いちばん上のタスクにする）']];
  const walk=(list, path)=>{ for(const t of list){ if(t.text===undefined) continue; const p=[...path, t.text];
    if(samePath(p.slice(0,self.length), self)) continue;
    opts.push([JSON.stringify(p), '　'.repeat(path.length)+(path.length?'└ ':'')+t.text]); walk(t.subs||[], p); } };
  walk(sec.items, []);
  if(opts.length<2) return '';
  return `<div class="field"><label>親タスク（どのタスクの下に置くか）</label><select class="inp" name="moveto">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===d.moveTo?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
}

function syncDraft(){
  const m=S.modal; if(!m||!m.draft) return; const form=document.querySelector('form[data-act="save-task"]'); if(!form) return;
  m.draft.text=form.text.value; m.draft.due=form.due.value; if(form.notes) m.draft.notes=form.notes.value; if(form.who) m.draft.who=form.who.value;
  form.querySelectorAll('[data-sub]').forEach(i=>{ m.draft.subs[+i.dataset.sub].text=i.value; });
  const ns=form.querySelector('[data-newsub]'); m.draft.newsub=ns?ns.value:'';
  if(form.moveto) m.draft.moveTo=form.moveto.value;
}

function ndragMove(y){
  const d=NDRAG; if(!d) return; d.y=y;
  d.ghost.style.top=(y-d.dy)+'px';
  const wrap=document.querySelector('.notes'); if(!wrap) return;
  if(d.kind==='note'){
    // 指の高さにある区分（区分と区分のすき間なら近いほう）の、どの行の前に入るか
    let sec=null, best=Infinity;
    for(const s of wrap.querySelectorAll('.ncat')){ const r=s.getBoundingClientRect(); const dist = y<r.top ? r.top-y : y>r.bottom ? y-r.bottom : 0; if(dist<best){ best=dist; sec=s; } }
    if(!sec) return;
    const list=sec.querySelector('.nlist'), rows=[...list.querySelectorAll('.nrow')].filter(x=>x!==d.src);
    let before=null; for(const row of rows){ const r=row.getBoundingClientRect(); if(y < r.top+r.height/2){ before=row; break; } }
    if(before) list.insertBefore(d.line, before); else list.appendChild(d.line);
    d.target={cat:sec.dataset.cat, index: before?rows.indexOf(before):rows.length, beforeText: before?noteTextAt(before):null};
  } else {
    const secs=[...wrap.querySelectorAll(':scope > .ncat')].filter(x=>x!==d.src);
    let before=null; for(const s of secs){ const r=s.getBoundingClientRect(); if(y < r.top+r.height/2){ before=s; break; } }
    if(before) wrap.insertBefore(d.line, before); else wrap.insertBefore(d.line, wrap.querySelector('.nfoot'));

    if(url && !/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return toast('ささやきのウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.rvUrl,url||null); safeSet(LS.rvKey,url?key:null); RV.rows=null; RV.error=''; RV.at=''; S.modal=null; if(url){ S.tab='bok'; S.bok=null; safeSet(LS.tab,'bok'); } render(); toast(url?'BOK（ささやき）につなぎました':'BOK の接続先と鍵を消しました'); return; }
  if(a==='cp-search'||a==='sq-search'){ f.q.blur(); return; }  // Enter はキーボードを閉じるだけ（打つたびに絞り込んでいる）
  if(a==='save-cpconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url;  // 「設定画面に貼る文字」（URL#鍵）もそのまま受け付ける
    const key=sp.key||safeGet(LS.cpKey)||'';
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Apps Script のウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.cpUrl,url||null); safeSet(LS.cpKey,url?key:null); CP.all=null; CP.at=0; CP.error=''; S.modal=null; if(url) navGo('coupon'); else render(); toast(url?'クーポンにつなぎました':'クーポンの設定を消しました'); return; }
  if(a==='save-pwconf'){ const sp=splitUrlKey(f.url.value.trim(), f.key.value.trim()), url=sp.url, key=sp.key||safeGet(LS.pwKey);
    if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Apps Script のウェブアプリの URL（https://script.google.com/…/exec）を入れてください',true);
    if(url && !key) return toast('鍵を入れてください',true);
    safeSet(LS.pwUrl,url||null); safeSet(LS.pwKey,url?key:null); PWD.rows=null; PWD.error=''; S.modal=null; if(url){ S.tab='pw'; safeSet(LS.tab,'pw'); } render(); toast(url?'パスワード表につなぎました':'パスワード表の設定を消しました'); return; }
  if(a==='note-add'){ const v=f.q.value.trim(); if(!v) return; f.q.value=''; const k=ndoc(f.dataset.doc), c=findCat(S[k], f.dataset.cat); addNote(f.dataset.cat, v, k==='memo'?false:!(c&&catPlain(c)), k); return; }
  if(a==='ncat-add'){ const v=f.q.value.trim(); if(!v) return; const err=badNoteCat(v, undefined, f.dataset.doc); if(err) return toast(err,true); f.q.value=''; addNoteCat(v, f.dataset.doc); return; }
  if(a==='save-note'){ const m=S.modal, text=f.text.value.trim(); if(!text) return; S.modal=null; updateNote(m.ref, {text, kind:ndoc(m.ref.doc)==='memo'?'plain':m.draft.kind, cat:m.draft.cat}); return; }
  if(a==='room-add'){ const v=f.q.value.trim(); if(!v) return; const [name,...rest]=v.split(/\s+/); if(findRoom(S.rooms,name)) return toast('同じ名前のルームがあります',true); f.q.value=''; saveRoom(null, {name, area:'', bldg:rest.join(' '), next:'', last:'', every:null, memo:''}); return; }
  if(a==='save-room'){
    const m=S.modal; const v={name:f.name.value.trim(), area:f.area.value.trim(), bldg:f.bldg.value.trim(), next:f.next.value, last:f.last.value, every:parseInt(f.every.value,10)||null, memo:f.memo.value.trim()};
    if(!v.name) return; if(v.name!==m.orig && findRoom(S.rooms, v.name)) return toast('同じ名前のルームがあります',true);
    S.modal=null; saveRoom(m.orig, v); return;
  }
  if(a==='save-room-clean'){
    const m=S.modal, next=f.next.value; const t=todayStr();
    const every = f.keep.checked && next>t ? Math.round((new Date(next)-new Date(t))/864e5) : undefined;
    S.modal=null; cleanedRoom(m.name, next, every); return;
  }
  if(a==='import'){ const iss=S.issues.find(i=>i.number===+f.dataset.num); importIssue(iss, f.dest.value, f.due.value); }
  if(a==='save-task'){
    syncDraft(); const m=S.modal, d=m.draft; const text=d.text.replace(/📅|🔺|👤/gu,'').trim(); if(!text) return;
    const who=cleanWho(d.who);
    if(d.newsub && d.newsub.trim()) d.subs.push({text:d.newsub.trim(),due:null,prio:false});
    const subs=d.subs.filter(s=>s.text.trim()).map(({orig,...s})=>({...s,text:s.text.trim(),subs:s.subs||[]}));  // 孫以下はそのまま残す
    const subRenames=d.subs.filter(s=>s.orig!==undefined && s.text.trim() && s.text.trim()!==s.orig).map(s=>({from:s.orig, to:s.text.trim()}));  // 名前を変えたサブタスク
    S.modal=null; render();
    const notes=notesOf(d.notes);
    if(m.type==='add') addTask(d.cat, {text, due:d.due||null, prio:d.prio, who, notes});
    else { let moveTo=null; try{ moveTo=JSON.parse(d.moveTo||'null'); }catch{} updateTask(m.ref, {text, due:d.due||null, prio:d.prio, who, cat:d.cat, notes, subs, moveTo, subRenames}); }
  }
  if(a==='save-settings'){
    const repo=f.repo.value.trim(); const token=f.token.value.trim()||safeGet(LS.token);
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('リポジトリは owner/name の形で入れてください', true);
    if(!token) return toast('トークンを入れてください', true);
    const be=githubBackend(token, repo);
    try{ await be.check(); }catch(err){ return toast(err.status===401?'トークンが無効です':err.status===404?'リポジトリが見つからないか、トークンの対象外です':'接続できませんでした', true); }
    safeSet(LS.repo,repo); safeSet(LS.token,token); S.be=be; S.modal=null; loadAll(true);
  }
});
// 画面に戻ってきたら最新を取り直す（スマホとPCの行き来用）
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.be && !qRunning && !Q.length && !S.modal && Date.now()-S.loadedAt>15000) loadAll(true); });

// ピンチや2本指の操作で拡大させない（iOS Safari は viewport 指定だけでは拡大を止めないため）
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
// ダブルタップでの拡大は CSS の touch-action:manipulation で止めている（連続タップを妨げないため）

// ===== 新しい版の自動読み込み =====
// 公開するとき deploy.py が、下の BUILD の値を中身から作った版の印（16進の12文字）に置きかえる。手元で開いたとき（?demo など）は dev のまま
// 開いている画面の印と公開版の印が違えば、新しい版が出ている。ホーム画面のアイコンから開いた画面は閉じない限り古いままなので、自分で気づいて読み込み直す
const BUILD = 'AOS_BUILD:d0cffa8ed89f';
const UPD = {at:0, newer:null};
const UPD_RE = new RegExp("'AOS" + "_BUILD:([0-9a-f]{12})'");
async function checkUpdate(force){
  if(BUILD.endsWith(':dev') || !/^https?:$/.test(location.protocol)) return;
  if(!force && Date.now()-UPD.at < 5*60*1000) return;  // 画面は大きいので、読みに行くのは5分に1回まで（開き直したとき・戻ってきたときは毎回）
  UPD.at=Date.now();
  let txt=''; try{ const r=await fetch(location.pathname+'?v='+Date.now(), {cache:'no-store'}); if(!r.ok) return; txt=await r.text(); }catch{ return; }
  const m=txt.match(UPD_RE); if(!m || 'AOS_BUILD:'+m[1]===BUILD) return;
  UPD.newer=m[1]; applyUpdate();
}
// 入力中・保存中・画面を開いている間は読み込み直さない（入れかけの内容が消えるため）。そのときは上に知らせを出し、押したら読み込み直す
const updSafe = () => { const a=document.activeElement; return !S.modal && !qRunning && !Q.length && !NDRAG && !S.nav && !(a && a.closest && a.closest('input,textarea,select')); };
function applyUpdate(){
  if(!UPD.newer) return;
  let tried=null; try{ tried=sessionStorage.getItem('aos.updFor'); }catch{}
  if(updSafe() && tried!==UPD.newer){ try{ sessionStorage.setItem('aos.updFor', UPD.newer); }catch{} location.reload(); return; }  // 同じ版で2回は読み直さない（行き来し続けないように）
  if(!document.getElementById('updbar')){ const b=document.createElement('button'); b.id='updbar'; b.type='button'; b.textContent='新しい画面があります。押すと読み込み直します'; b.onclick=()=>location.reload(); document.body.appendChild(b); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(true); });
addEventListener('pageshow', e=>{ if(e.persisted) checkUpdate(true); });  // 戻るで出し直した画面も確かめる

// ===== 起動 =====
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.has('demo')) S.be=demoBackend();
  else { const tk=safeGet(LS.token); if(tk) S.be=githubBackend(tk, safeGet(LS.repo)||DEFAULT_REPO); }
  const hk=decodeURIComponent(location.hash.slice(1)); if(hk && NAV_DEF[hk]){ S.tab=hk; safeSet(LS.tab,hk); } else if(S.be) history.replaceState(null,'',location.pathname+location.search+'#'+S.tab);
  render();
  if(S.be) loadAll(true);
  setInterval(pollRuns, 12000);
  checkUpdate(true);
  setInterval(()=>{ if(document.visibilityState!=='visible') return; if(UPD.newer) applyUpdate(); else checkUpdate(false); }, 60000);
  setInterval(()=>{ if(S.be && document.visibilityState==='visible' && !qRunning && !Q.length && !S.modal && !document.activeElement?.closest?.('form')) loadAll(true); }, 60000);
})();
window.__aos = {S, parseTodo, serializeTodo, parseSomeday, serializeSomeday, parseDone};
</script>
